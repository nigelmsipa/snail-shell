const S=[{"s": 0, "e": 2000, "t": "Matthew, Chapter Twenty-Five."}, {"s": 2000, "e": 9333, "t": "Then shall the kingdom of heaven be likened unto ten virgins, which took their lamps, and went forth to meet the bridegroom."}, {"s": 9333, "e": 12667, "t": "And five of them were wise, and five were foolish."}, {"s": 12667, "e": 20000, "t": "They that were foolish took their lamps, and took no oil with them: But the wise took oil in their vessels with their lamps."}, {"s": 20000, "e": 23867, "t": "While the bridegroom tarried, they all slumbered and slept."}, {"s": 23867, "e": 29200, "t": "And at midnight there was a cry made, Behold, the bridegroom cometh; go ye out to meet him."}, {"s": 29200, "e": 32533, "t": "Then all those virgins arose, and trimmed their lamps."}, {"s": 32533, "e": 38133, "t": "And the foolish said unto the wise, Give us of your oil; for our lamps are gone out."}, {"s": 38133, "e": 46667, "t": "But the wise answered, saying, Not so; lest there be not enough for us and you: but go ye rather to them that sell, and buy for yourselves."}, {"s": 46667, "e": 54400, "t": "And while they went to buy, the bridegroom came; and they that were ready went in with him to the marriage: and the door was shut."}, {"s": 54400, "e": 59733, "t": "Afterward came also the other virgins, saying, Lord, Lord, open to us."}, {"s": 59733, "e": 63733, "t": "But he answered and said, Verily I say unto you, I know you not."}, {"s": 63733, "e": 69600, "t": "Watch therefore, for ye know neither the day nor the hour wherein the Son of man cometh."}, {"s": 69600, "e": 77333, "t": "For the kingdom of heaven is as a man travelling into a far country, who called his own servants, and delivered unto them his goods."}, {"s": 77333, "e": 86933, "t": "And unto one he gave five talents, to another two, and to another one; to every man according to his several ability; and straightway took his journey."}, {"s": 86933, "e": 93333, "t": "Then he that had received the five talents went and traded with the same, and made them other five talents."}, {"s": 93333, "e": 97467, "t": "And likewise he that had received two, he also gained other two."}, {"s": 97467, "e": 102533, "t": "But he that had received one went and digged in the earth, and hid his lord's money."}, {"s": 102533, "e": 107067, "t": "After a long time the lord of those servants cometh, and reckoneth with them."}, {"s": 107067, "e": 117867, "t": "And so he that had received five talents came and brought other five talents, saying, Lord, thou deliveredst unto me five talents: behold, I have gained beside them five talents more."}, {"s": 117867, "e": 128667, "t": "His lord said unto him, Well done, thou good and faithful servant: thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord."}, {"s": 128667, "e": 137467, "t": "He also that had received two talents came and said, Lord, thou deliveredst unto me two talents: behold, I have gained two other talents beside them."}, {"s": 137467, "e": 149067, "t": "His lord said unto him, Well done, good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord."}, {"s": 149067, "e": 165200, "t": "Then he which had received the one talent came and said, Lord, I knew thee that thou art an hard man, reaping where thou hast not sown, and gathering where thou hast not strawed: And I was afraid, and went and hid thy talent in the earth: lo, there thou hast that is thine."}, {"s": 165200, "e": 182400, "t": "His lord answered and said unto him, Thou wicked and slothful servant, thou knewest that I reap where I sowed not, and gather where I have not strawed: Thou oughtest therefore to have put my money to the exchangers, and then at my coming I should have received mine own with usury."}, {"s": 182400, "e": 187600, "t": "Take therefore the talent from him, and give it unto him which hath ten talents."}, {"s": 187600, "e": 196533, "t": "For unto every one that hath shall be given, and he shall have abundance: but from him that hath not shall be taken away even that which he hath."}, {"s": 196533, "e": 203467, "t": "And cast ye the unprofitable servant into outer darkness: there shall be weeping and gnashing of teeth."}, {"s": 203467, "e": 219200, "t": "When the Son of man shall come in his glory, and all the holy angels with him, then shall he sit upon the throne of his glory: And before him shall be gathered all nations: and he shall separate them one from another, as a shepherd divideth his sheep from the goats:"}, {"s": 219200, "e": 222800, "t": "And he shall set the sheep on his right hand, but the goats on the left."}, {"s": 222800, "e": 242133, "t": "Then shall the King say unto them on his right hand, Come, ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world: For I was an hungred, and ye gave me meat: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in: Naked, and ye clothed me:"}, {"s": 242133, "e": 246667, "t": "I was sick, and ye visited me: I was in prison, and ye came unto me."}, {"s": 246667, "e": 253067, "t": "Then shall the righteous answer him, saying, Lord, when saw we thee an hungred, and fed thee?"}, {"s": 253067, "e": 255467, "t": "or thirsty, and gave thee drink?"}, {"s": 255467, "e": 258667, "t": "When saw we thee a stranger, and took thee in?"}, {"s": 258667, "e": 260667, "t": "or naked, and clothed thee?"}, {"s": 260667, "e": 264133, "t": "Or when saw we thee sick, or in prison, and came unto thee?"}, {"s": 264133, "e": 273600, "t": "And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me."}, {"s": 273600, "e": 290133, "t": "Then shall he say also unto them on the left hand, Depart from me, ye cursed, into everlasting fire, prepared for the devil and his angels: For I was an hungred, and ye gave me no meat: I was thirsty, and ye gave me no drink: I was a stranger, and ye took me not in: naked, and ye clothed me not:"}, {"s": 290133, "e": 292933, "t": "sick, and in prison, and ye visited me not."}, {"s": 292933, "e": 303067, "t": "Then shall they also answer him, saying, Lord, when saw we thee an hungred, or athirst, or a stranger, or naked, or sick, or in prison, and did not minister unto thee?"}, {"s": 303067, "e": 311600, "t": "Then shall he answer them, saying, Verily I say unto you, Inasmuch as ye did it not to one of the least of these, ye did it not to me."}, {"s": 311600, "e": 316667, "t": "And these shall go away into everlasting punishment: but the righteous into life eternal."}],a=document.getElementById('a'),t=document.getElementById('t');
