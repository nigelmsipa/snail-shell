alk?"}, {"s": 180533, "e": 191600, "t": "But that ye may know that the Son of man hath power upon earth to forgive sins, (he said unto the sick of the palsy,) I say unto thee, Arise, and take up thy couch, and go into thine house."}, {"s": 191600, "e": 198267, "t": "And immediately he rose up before them, and took up that whereon he lay, and departed to his own house, glorifying God."}, {"s": 198267, "e": 206000, "t": "And they were all amazed, and they glorified God, and were filled with fear, saying, We have seen strange things to day."}, {"s": 206000, "e": 214800, "t": "And after these things he went forth, and saw a publican, named Levi, sitting at the receipt of custom: and he said unto him, Follow me."}, {"s": 214800, "e": 218667, "t": "And he left all, rose up, and followed him."}, {"s": 218667, "e": 225467, "t": "And Levi made him a great feast in his own house: and there was a great company of publicans and of others that sat down with them."}, {"s": 225467, "e": 232933, "t": "But their scribes and Pharisees murmured against his disciples, saying, Why do ye eat and drink with publicans and sinners?"}, {"s": 232933, "e": 239333, "t": "And Jesus answering said unto them, They that are whole need not a physician; but they that are sick."}, {"s": 239333, "e": 242667, "t": "I came not to call the righteous, but sinners to repentance."}, {"s": 242667, "e": 252000, "t": "And they said unto him, Why do the disciples of John fast often, and make prayers, and likewise the disciples of the Pharisees; but thine eat and drink?"}, {"s": 252000, "e": 257600, "t": "And he said unto them, Can ye make the children of the bridechamber fast, while the bridegroom is with them?"}, {"s": 257600, "e": 264267, "t": "But the days will come, when the bridegroom shall be taken away from them, and then shall they fast in those days."}, {"s": 264267, "e": 277200, "t": "And he spake also a parable unto them; No man putteth a piece of a new garment upon an old; if otherwise, then both the
