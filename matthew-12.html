<script>
const S=[{"s": 0, "e": 1867, "t": "Matthew, Chapter Twelve."}, {"s": 1867, "e": 10000, "t": "At that time Jesus went on the sabbath day through the corn; and his disciples were an hungred, and began to pluck the ears of corn, and to eat."}, {"s": 10000, "e": 17200, "t": "But when the Pharisees saw it, they said unto him, Behold, thy disciples do that which is not lawful to do upon the sabbath day."}, {"s": 17200, "e": 31333, "t": "But he said unto them, Have ye not read what David did, when he was an hungred, and they that were with him; How he entered into the house of God, and did eat the shewbread, which was not lawful for him to eat, neither for them which were with him, but only for the priests?"}, {"s": 31333, "e": 37600, "t": "Or have ye not read in the law, how that on the sabbath days the priests in the temple profane the sabbath, and are blameless?"}, {"s": 37600, "e": 42267, "t": "But I say unto you, That in this place is one greater than the temple."}, {"s": 42267, "e": 50133, "t": "But if ye had known what this meaneth, I will have mercy, and not sacrifice, ye would not have condemned the guiltless."}, {"s": 50133, "e": 53600, "t": "For the Son of man is Lord even of the sabbath day."}, {"s": 53600, "e": 60000, "t": "And when he was departed thence, he went into their synagogue: And, behold, there was a man which had his hand withered."}, {"s": 60000, "e": 64667, "t": "And they asked him, saying, Is it lawful to heal on the sabbath days?"}, {"s": 64667, "e": 66133, "t": "that they might accuse him."}, {"s": 66133, "e": 76800, "t": "And he said unto them, What man shall there be among you, that shall have one sheep, and if it fall into a pit on the sabbath day, will he not lay hold on it, and lift it out?"}, {"s": 76800, "e": 79733, "t": "How much then is a man better than a sheep?"}, {"s": 79733, "e": 83200, "t": "Wherefore it is lawful to do well on the sabbath days."}, {"s": 83200, "e": 86533, "t": "Then saith he to the man, Stretch forth thine hand."}, {"s": 86533, "e": 90800, "t": "And he stretched it forth; and it was restored whole, like as the other."}, {"s": 90800, "e": 95200, "t": "Then the Pharisees went out, and held a council against him, how they might destroy him."}, {"s": 95200, "e": 112667, "t": "But when Jesus knew it, he withdrew himself from thence: and great multitudes followed him, and he healed them all; And charged them that they should not make him known: That it might be fulfilled which was spoken by Esaias the prophet, saying, Behold my servant, whom I have chosen; my beloved,"}, {"s": 112667, "e": 119600, "t": "in whom my soul is well pleased: I will put my spirit upon him, and he shall shew judgment to the Gentiles."}, {"s": 119600, "e": 125467, "t": "He shall not strive, nor cry; neither shall any man hear his voice in the streets."}, {"s": 125467, "e": 132400, "t": "A bruised reed shall he not break, and smoking flax shall he not quench, till he send forth judgment unto victory."}, {"s": 132400, "e": 135467, "t": "And in his name shall the Gentiles trust."}, {"s": 135467, "e": 145333, "t": "Then was brought unto him one possessed with a devil, blind, and dumb: and he healed him, insomuch that the blind and dumb both spake and saw."}, {"s": 145333, "e": 150000, "t": "And all the people were amazed, and said, Is not this the son of David?"}, {"s": 150000, "e": 157200, "t": "But when the Pharisees heard it, they said, This fellow doth not cast out devils, but by Beelzebub the prince of the devils."}, {"s": 157200, "e": 173867, "t": "And Jesus knew their thoughts, and said unto them, Every kingdom divided against itself is brought to desolation; and every city or house divided against itself shall not stand: And if Satan cast out Satan, he is divided against himself; how shall then his kingdom stand?"}, {"s": 173867, "e": 179600, "t": "And if I by Beelzebub cast out devils, by whom do your children cast them out?"}, {"s": 179600, "e": 181867, "t": "therefore they shall be your judges."}, {"s": 181867, "e": 187467, "t": "But if I cast out devils by the Spirit of God, then the kingdom of God is come unto you."}, {"s": 187467, "e": 194400, "t": "Or else how can one enter into a strong man's house, and spoil his goods, except he first bind the strong man?"}, {"s": 194400, "e": 196400, "t": "and then he will spoil his house."}, {"s": 196400, "e": 201733, "t": "He that is not with me is against me; and he that gathereth not with me scattereth abroad."}, {"s": 201733, "e": 211333, "t": "Wherefore I say unto you, All manner of sin and blasphemy shall be forgiven unto men: but the blasphemy against the Holy Ghost shall not be forgiven unto men."}, {"s": 211333, "e": 223600, "t": "And whosoever speaketh a word against the Son of man, it shall be forgiven him: but whosoever speaketh against the Holy Ghost, it shall not be forgiven him, neither in this world, neither in the world to come."}, {"s": 223600, "e": 230933, "t": "Either make the tree good, and his fruit good; or else make the tree corrupt, and his fruit corrupt: for the tree is known by his fruit."}, {"s": 230933, "e": 235867, "t": "O generation of vipers, how can ye, being evil, speak good things?"}, {"s": 235867, "e": 238667, "t": "for out of the abundance of the heart the mouth speaketh."}, {"s": 238667, "e": 247200, "t": "A good man out of the good treasure of the heart bringeth forth good things: and an evil man out of the evil treasure bringeth forth evil things."}, {"s": 247200, "e": 254133, "t": "But I say unto you, That every idle word that men shall speak, they shall give account thereof in the day of judgment."}, {"s": 254133, "e": 258800, "t": "For by thy words thou shalt be justified, and by thy words thou shalt be condemned."}, {"s": 258800, "e": 264267, "t": "Then certain of the scribes and of the Pharisees answered, saying, Master, we would see a sign from thee."}, {"s": 264267, "e": 278133, "t": "But he answered and said unto them, An evil and adulterous generation seeketh after a sign; and there shall no sign be given to it, but the sign of the prophet Jonas: For as Jonas was three days and three nights in the whale's belly;"}, {"s": 278133, "e": 282000, "t": "so shall the Son of man be three days and three nights in the heart of the earth."}, {"s": 282000, "e": 292400, "t": "The men of Nineveh shall rise in judgment with this generation, and shall condemn it: because they repented at the preaching of Jonas; and, behold, a greater than Jonas is here."}, {"s": 292400, "e": 305867, "t": "The queen of the south shall rise up in the judgment with this generation, and shall condemn it: for she came from the uttermost parts of the earth to hear the wisdom of Solomon; and, behold, a greater than Solomon is here."}, {"s": 305867, "e": 311867, "t": "When the unclean spirit is gone out of a man, he walketh through dry places, seeking rest, and findeth none."}, {"s": 311867, "e": 320133, "t": "Then he saith, I will return into my house from whence I came out; and when he is come, he findeth it empty, swept, and garnished."}, {"s": 320133, "e": 330533, "t": "Then goeth he, and taketh with himself seven other spirits more wicked than himself, and they enter in and dwell there: and the last state of that man is worse than the first."}, {"s": 330533, "e": 334267, "t": "Even so shall it be also unto this wicked generation."}, {"s": 334267, "e": 341200, "t": "While he yet talked to the people, behold, his mother and his brethren stood without, desiring to speak with him."}, {"s": 341200, "e": 347200, "t": "Then one said unto him, Behold, thy mother and thy brethren stand without, desiring to speak with thee."}, {"s": 347200, "e": 351600, "t": "But he answered and said unto him that told him, Who is my mother?"}, {"s": 351600, "e": 353200, "t": "and who are my brethren?"}, {"s": 353200, "e": 358800, "t": "And he stretched forth his hand toward his disciples, and said, Behold my mother and my brethren!"}, {"s": 358800, "e": 365200, "t": "For whosoever shall do the will of my Father which is in heaven, the same is my brother, and sister, and mother."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
