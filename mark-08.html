<script>
const S=[{"s": 0, "e": 1867, "t": "Mark, Chapter Eight."}, {"s": 1867, "e": 21600, "t": "In those days the multitude being very great, and having nothing to eat, Jesus called his disciples unto him, and saith unto them, I have compassion on the multitude, because they have now been with me three days, and have nothing to eat: And if I send them away fasting to their own houses,"}, {"s": 21600, "e": 25600, "t": "they will faint by the way: for divers of them came from far."}, {"s": 25600, "e": 31600, "t": "And his disciples answered him, From whence can a man satisfy these men with bread here in the wilderness?"}, {"s": 31600, "e": 34533, "t": "And he asked them, How many loaves have ye?"}, {"s": 34533, "e": 36533, "t": "And they said, Seven."}, {"s": 36533, "e": 47200, "t": "And he commanded the people to sit down on the ground: and he took the seven loaves, and gave thanks, and brake, and gave to his disciples to set before them; and they did set them before the people."}, {"s": 47200, "e": 53200, "t": "And they had a few small fishes: and he blessed, and commanded to set them also before them."}, {"s": 53200, "e": 58800, "t": "So they did eat, and were filled: and they took up of the broken meat that was left seven baskets."}, {"s": 58800, "e": 63867, "t": "And they that had eaten were about four thousand: and he sent them away."}, {"s": 63867, "e": 69333, "t": "And straightway he entered into a ship with his disciples, and came into the parts of Dalmanutha."}, {"s": 69333, "e": 76133, "t": "And the Pharisees came forth, and began to question with him, seeking of him a sign from heaven, tempting him."}, {"s": 76133, "e": 82400, "t": "And he sighed deeply in his spirit, and saith, Why doth this generation seek after a sign?"}, {"s": 82400, "e": 88133, "t": "verily I say unto you, There shall no sign be given unto this generation."}, {"s": 88133, "e": 92533, "t": "And he left them, and entering into the ship again departed to the other side."}, {"s": 92533, "e": 98267, "t": "Now the disciples had forgotten to take bread, neither had they in the ship with them more than one loaf."}, {"s": 98267, "e": 104400, "t": "And he charged them, saying, Take heed, beware of the leaven of the Pharisees, and of the leaven of Herod."}, {"s": 104400, "e": 108533, "t": "And they reasoned among themselves, saying, It is because we have no bread."}, {"s": 108533, "e": 113867, "t": "And when Jesus knew it, he saith unto them, Why reason ye, because ye have no bread?"}, {"s": 113867, "e": 116667, "t": "perceive ye not yet, neither understand?"}, {"s": 116667, "e": 118800, "t": "have ye your heart yet hardened?"}, {"s": 118800, "e": 120667, "t": "Having eyes, see ye not?"}, {"s": 120667, "e": 122533, "t": "and having ears, hear ye not?"}, {"s": 122533, "e": 123733, "t": "and do ye not remember?"}, {"s": 123733, "e": 129733, "t": "When I brake the five loaves among five thousand, how many baskets full of fragments took ye up?"}, {"s": 129733, "e": 131600, "t": "They say unto him, Twelve."}, {"s": 131600, "e": 136533, "t": "And when the seven among four thousand, how many baskets full of fragments took ye up?"}, {"s": 136533, "e": 137733, "t": "And they said, Seven."}, {"s": 137733, "e": 141600, "t": "And he said unto them, How is it that ye do not understand?"}, {"s": 141600, "e": 147200, "t": "And he cometh to Bethsaida; and they bring a blind man unto him, and besought him to touch him."}, {"s": 147200, "e": 156133, "t": "And he took the blind man by the hand, and led him out of the town; and when he had spit on his eyes, and put his hands upon him, he asked him if he saw ought."}, {"s": 156133, "e": 159733, "t": "And he looked up, and said, I see men as trees, walking."}, {"s": 159733, "e": 167067, "t": "After that he put his hands again upon his eyes, and made him look up: and he was restored, and saw every man clearly."}, {"s": 167067, "e": 173733, "t": "And he sent him away to his house, saying, Neither go into the town, nor tell it to any in the town."}, {"s": 173733, "e": 184400, "t": "And Jesus went out, and his disciples, into the towns of Caesarea Philippi: and by the way he asked his disciples, saying unto them, Whom do men say that I am?"}, {"s": 184400, "e": 190533, "t": "And they answered, John the Baptist: but some say, Elias; and others, One of the prophets."}, {"s": 190533, "e": 194400, "t": "And he saith unto them, But whom say ye that I am?"}, {"s": 194400, "e": 199200, "t": "And Peter answereth and saith unto him, Thou art the Christ."}, {"s": 199200, "e": 202800, "t": "And he charged them that they should tell no man of him."}, {"s": 202800, "e": 214133, "t": "And he began to teach them, that the Son of man must suffer many things, and be rejected of the elders, and of the chief priests, and scribes, and be killed, and after three days rise again."}, {"s": 214133, "e": 216267, "t": "And he spake that saying openly."}, {"s": 216267, "e": 219067, "t": "And Peter took him, and began to rebuke him."}, {"s": 219067, "e": 230533, "t": "But when he had turned about and looked on his disciples, he rebuked Peter, saying, Get thee behind me, Satan: for thou savourest not the things that be of God, but the things that be of men."}, {"s": 230533, "e": 240667, "t": "And when he had called the people unto him with his disciples also, he said unto them, Whosoever will come after me, let him deny himself, and take up his cross, and follow me."}, {"s": 240667, "e": 248933, "t": "For whosoever will save his life shall lose it; but whosoever shall lose his life for my sake and the gospel's, the same shall save it."}, {"s": 248933, "e": 254133, "t": "For what shall it profit a man, if he shall gain the whole world, and lose his own soul?"}, {"s": 254133, "e": 257067, "t": "Or what shall a man give in exchange for his soul?"}, {"s": 257067, "e": 269200, "t": "Whosoever therefore shall be ashamed of me and of my words in this adulterous and sinful generation; of him also shall the Son of man be ashamed, when he cometh in the glory of his Father with the holy angels."}],a=document.getElementById('a'),t=document.getElementById('t');
