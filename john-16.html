<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>john-16</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}

<div class="spd">Speed:

<main><h1>john-16</h1><p id="t"></p></main>

e of mine, and shall shew it unto you."}, {"s": 95067, "e": 102400, "t": "A little while, and ye shall not see me: and again, a little while, and ye shall see me, because I go to the Father."}, {"s": 102400, "e": 114667, "t": "Then said some of his disciples among themselves, What is this that he saith unto us, A little while, and ye shall not see me: and again, a little while, and ye shall see me: and, Because I go to the Father?"}, {"s": 114667, "e": 118667, "t": "They said therefore, What is this that he saith, A little while?"}, {"s": 118667, "e": 120533, "t": "we cannot tell what he saith."}, {"s": 120533, "e": 133733, "t": "Now Jesus knew that they were desirous to ask him, and said unto them, Do ye inquire among yourselves of that I said, A little while, and ye shall not see me: and again, a little while, and ye shall see me?"}, {"s": 133733, "e": 143600, "t": "Verily, verily, I say unto you, That ye shall weep and lament, but the world shall rejoice: and ye shall be sorrowful, but your sorrow shall be turned into joy."}, {"s": 143600, "e": 155200, "t": "A woman when she is in travail hath sorrow, because her hour is come: but as soon as she is delivered of the child, she remembereth no more the anguish, for joy that a man is born into the world."}, {"s": 155200, "e": 163467, "t": "And ye now therefore have sorrow: but I will see you again, and your heart shall rejoice, and your joy no man taketh from you."}, {"s": 163467, "e": 166133, "t": "And in that day ye shall ask me nothing."}, {"s": 166133, "e": 172800, "t": "Verily, verily, I say unto you, Whatsoever ye shall ask the Father in my name, he will give it you."}, {"s": 172800, "e": 179467, "t": "Hitherto have ye asked nothing in my name: ask, and ye shall receive, that your joy may be full."}, {"s": 179467, "e": 187600, "t": "These things have I spoken unto you in proverbs: but the time cometh, when I shall no more speak unto you in proverbs, but I shall shew you plainly of the Father."}, {"s": 187600, "e": 200133, "t": "At that day ye shall ask in my name: and I say not unto you, that I will pray the Father for you: For the Father himself loveth you, because ye have loved me, and have believed that I came out from God."}, {"s": 200133, "e": 206133, "t": "I came forth from the Father, and am come into the world: again, I leave the world, and go to the Father."}, {"s": 206133, "e": 212267, "t": "His disciples said unto him, Lo, now speakest thou plainly, and speakest no proverb."}, {"s": 212267, "e": 220800, "t": "Now are we sure that thou knowest all things, and needest not that any man should ask thee: by this we believe that thou camest forth from God."}, {"s": 220800, "e": 224400, "t": "Jesus answered them, Do ye now believe?"}, {"s": 224400, "e": 235067, "t": "Behold, the hour cometh, yea, is now come, that ye shall be scattered, every man to his own, and shall leave me alone: and yet I am not alone, because the Father is with me."}, {"s": 235067, "e": 239333, "t": "These things I have spoken unto you, that in me ye might have peace."}, {"s": 239333, "e": 244800, "t": "In the world ye shall have tribulation: but be of good cheer; I have overcome the world."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
