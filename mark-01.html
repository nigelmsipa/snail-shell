<style>

repent ye, and believe the gospel."}, {"s": 97333, "e": 105067, "t": "Now as he walked by the sea of Galilee, he saw Simon and Andrew his brother casting a net into the sea: for they were fishers."}, {"s": 105067, "e": 110800, "t": "And Jesus said unto them, Come ye after me, and I will make you to become fishers of men."}, {"s": 110800, "e": 114133, "t": "And straightway they forsook their nets, and followed him."}, {"s": 114133, "e": 122400, "t": "And when he had gone a little further thence, he saw James the son of Zebedee, and John his brother, who also were in the ship mending their nets."}, {"s": 122400, "e": 129067, "t": "And straightway he called them: and they left their father Zebedee in the ship with the hired servants, and went after him."}, {"s": 129067, "e": 135200, "t": "And they went into Capernaum; and straightway on the sabbath day he entered into the synagogue, and taught."}, {"s": 135200, "e": 141733, "t": "And they were astonished at his doctrine: for he taught them as one that had authority, and not as the scribes."}, {"s": 141733, "e": 151333, "t": "And there was in their synagogue a man with an unclean spirit; and he cried out, Saying, Let us alone; what have we to do with thee, thou Jesus of Nazareth?"}, {"s": 151333, "e": 153333, "t": "art thou come to destroy us?"}, {"s": 153333, "e": 156533, "t": "I know thee who thou art, the Holy One of God."}, {"s": 156533, "e": 160800, "t": "And Jesus rebuked him, saying, Hold thy peace, and come out of him."}, {"s": 160800, "e": 165600, "t": "And when the unclean spirit had torn him, and cried with a loud voice, he came out of him."}, {"s": 165600, "e": 172000, "t": "And they were all amazed, insomuch that they questioned among themselves, saying, What thing is this?"}, {"s": 172000, "e": 173733, "t": "what new doctrine is this?"}, {"s": 173733, "e": 178533, "t": "for with authority commandeth he even the unclean spirits, and they do obey him."}, {"s": 178533, "e": 183200, "t": "And immediately his fame spread abroad throughout all the region round about Galilee."}, {"s": 183200, "e": 189200, "t": "And forthwith, when they were come out of the synagogue, they entered into the house of Simon and Andrew, with James and John."}, {"s": 189200, "e": 194267, "t": "But Simon's wife's mother lay sick of a fever, and anon they tell him of her."}, {"s": 194267, "e": 202133, "t": "And he came and took her by the hand, and lifted her up; and immediately the fever left her, and she ministered unto them."}, {"s": 202133, "e": 209600, "t": "And at even, when the sun did set, they brought unto him all that were diseased, and them that were possessed with devils."}, {"s": 209600, "e": 212000, "t": "And all the city was gathered together at the door."}, {"s": 212000, "e": 220667, "t": "And he healed many that were sick of divers diseases, and cast out many devils; and suffered not the devils to speak, because they knew him."}, {"s": 220667, "e": 228533, "t": "And in the morning, rising up a great while before day, he went out, and departed into a solitary place, and there prayed."}, {"s": 228533, "e": 231733, "t": "And Simon and they that were with him followed after him."}, {"s": 231733, "e": 236533, "t": "And when they had found him, they said unto him, All men seek for thee."}, {"s": 236533, "e": 243733, "t": "And he said unto them, Let us go into the next towns, that I may preach there also: for therefore came I forth."}, {"s": 243733, "e": 248000, "t": "And he preached in their synagogues throughout all Galilee, and cast out devils."}, {"s": 248000, "e": 255733, "t": "And there came a leper to him, beseeching him, and kneeling down to him, and saying unto him, If thou wilt, thou canst make me clean."}, {"s": 255733, "e": 263333, "t": "And Jesus, moved with compassion, put forth his hand, and touched him, and saith unto him, I will; be thou clean."}, {"s": 263333, "e": 268667, "t": "And as soon as he had spoken, immediately the leprosy departed from him, and he was cleansed."}, {"s": 268667, "e": 283600, "t": "And he straitly charged him, and forthwith sent him away; And saith unto him, See thou say nothing to any man: but go thy way, shew thyself to the priest, and offer for thy cleansing those things which Moses commanded, for a testimony unto them."}, {"s": 283600, "e": 296000, "t": "But he went out, and began to publish it much, and to blaze abroad the matter, insomuch that Jesus could no more openly enter into the city, but was without in desert places: and they came to him from every quarter."}],a=document.getElementById('a'),t=document.getElementById('t');
