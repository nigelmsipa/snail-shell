<script>
const S=[{"s": 0, "e": 1600, "t": "Matthew, Chapter Fifteen."}, {"s": 1600, "e": 10267, "t": "Then came to Jesus scribes and Pharisees, which were of Jerusalem, saying, Why do thy disciples transgress the tradition of the elders?"}, {"s": 10267, "e": 13067, "t": "for they wash not their hands when they eat bread."}, {"s": 13067, "e": 19733, "t": "But he answered and said unto them, Why do ye also transgress the commandment of God by your tradition?"}, {"s": 19733, "e": 28800, "t": "For God commanded, saying, Honour thy father and mother: and, He that curseth father or mother, let him die the death."}, {"s": 28800, "e": 39867, "t": "But ye say, Whosoever shall say to his father or his mother, It is a gift, by whatsoever thou mightest be profited by me; And honour not his father or his mother, he shall be free."}, {"s": 39867, "e": 44667, "t": "Thus have ye made the commandment of God of none effect by your tradition."}, {"s": 44667, "e": 55867, "t": "Ye hypocrites, well did Esaias prophesy of you, saying, This people draweth nigh unto me with their mouth, and honoureth me with their lips; but their heart is far from me."}, {"s": 55867, "e": 61200, "t": "But in vain they do worship me, teaching for doctrines the commandments of men."}, {"s": 61200, "e": 72000, "t": "And he called the multitude, and said unto them, Hear, and understand: Not that which goeth into the mouth defileth a man; but that which cometh out of the mouth, this defileth a man."}, {"s": 72000, "e": 79467, "t": "Then came his disciples, and said unto him, Knowest thou that the Pharisees were offended, after they heard this saying?"}, {"s": 79467, "e": 85467, "t": "But he answered and said, Every plant, which my heavenly Father hath not planted, shall be rooted up."}, {"s": 85467, "e": 89067, "t": "Let them alone: they be blind leaders of the blind."}, {"s": 89067, "e": 93067, "t": "And if the blind lead the blind, both shall fall into the ditch."}, {"s": 93067, "e": 96933, "t": "Then answered Peter and said unto him, Declare unto us this parable."}, {"s": 96933, "e": 100800, "t": "And Jesus said, Are ye also yet without understanding?"}, {"s": 100800, "e": 108800, "t": "Do not ye yet understand, that whatsoever entereth in at the mouth goeth into the belly, and is cast out into the draught?"}, {"s": 108800, "e": 114267, "t": "But those things which proceed out of the mouth come forth from the heart; and they defile the man."}, {"s": 114267, "e": 127200, "t": "For out of the heart proceed evil thoughts, murders, adulteries, fornications, thefts, false witness, blasphemies: These are the things which defile a man: but to eat with unwashen hands defileth not a man."}, {"s": 127200, "e": 132000, "t": "Then Jesus went thence, and departed into the coasts of Tyre and Sidon."}, {"s": 132000, "e": 141733, "t": "And, behold, a woman of Canaan came out of the same coasts, and cried unto him, saying, Have mercy on me, O Lord, thou Son of David; my daughter is grievously vexed with a devil."}, {"s": 141733, "e": 144133, "t": "But he answered her not a word."}, {"s": 144133, "e": 149733, "t": "And his disciples came and besought him, saying, Send her away; for she crieth after us."}, {"s": 149733, "e": 154800, "t": "But he answered and said, I am not sent but unto the lost sheep of the house of Israel."}, {"s": 154800, "e": 159067, "t": "Then came she and worshipped him, saying, Lord, help me."}, {"s": 159067, "e": 164667, "t": "But he answered and said, It is not meet to take the children's bread, and to cast it to dogs."}, {"s": 164667, "e": 169867, "t": "And she said, Truth, Lord: yet the dogs eat of the crumbs which fall from their masters' table."}, {"s": 169867, "e": 176533, "t": "Then Jesus answered and said unto her, O woman, great is thy faith: be it unto thee even as thou wilt."}, {"s": 176533, "e": 179733, "t": "And her daughter was made whole from that very hour."}, {"s": 179733, "e": 187600, "t": "And Jesus departed from thence, and came nigh unto the sea of Galilee; and went up into a mountain, and sat down there."}, {"s": 187600, "e": 206000, "t": "And great multitudes came unto him, having with them those that were lame, blind, dumb, maimed, and many others, and cast them down at Jesus' feet; and he healed them: Insomuch that the multitude wondered, when they saw the dumb to speak, the maimed to be whole, the lame to walk,"}, {"s": 206000, "e": 210000, "t": "and the blind to see: and they glorified the God of Israel."}, {"s": 210000, "e": 222400, "t": "Then Jesus called his disciples unto him, and said, I have compassion on the multitude, because they continue with me now three days, and have nothing to eat: and I will not send them away fasting, lest they faint in the way."}, {"s": 222400, "e": 231733, "t": "And his disciples say unto him, Whence should we have so much bread in the wilderness, as to fill so great a multitude?"}, {"s": 231733, "e": 235200, "t": "And Jesus saith unto them, How many loaves have ye?"}, {"s": 235200, "e": 238133, "t": "And they said, Seven, and a few little fishes."}, {"s": 238133, "e": 241200, "t": "And he commanded the multitude to sit down on the ground."}, {"s": 241200, "e": 250267, "t": "And he took the seven loaves and the fishes, and gave thanks, and brake them, and gave to his disciples, and the disciples to the multitude."}, {"s": 250267, "e": 256133, "t": "And they did all eat, and were filled: and they took up of the broken meat that was left seven baskets full."}, {"s": 256133, "e": 260933, "t": "And they that did eat were four thousand men, beside women and children."}, {"s": 260933, "e": 265867, "t": "And he sent away the multitude, and took ship, and came into the coasts of Magdala."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');

function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
