<style>

<script>
const S=[{"s": 0, "e": 1467, "t": "Luke, Chapter Sixteen."}, {"s": 1467, "e": 10667, "t": "And he said also unto his disciples, There was a certain rich man, which had a steward; and the same was accused unto him that he had wasted his goods."}, {"s": 10667, "e": 15333, "t": "And he called him, and said unto him, How is it that I hear this of thee?"}, {"s": 15333, "e": 19467, "t": "give an account of thy stewardship; for thou mayest be no longer steward."}, {"s": 19467, "e": 23067, "t": "Then the steward said within himself, What shall I do?"}, {"s": 23067, "e": 28000, "t": "for my lord taketh away from me the stewardship: I cannot dig; to beg I am ashamed."}, {"s": 28000, "e": 34000, "t": "I am resolved what to do, that, when I am put out of the stewardship, they may receive me into their houses."}, {"s": 34000, "e": 40533, "t": "So he called every one of his lord's debtors unto him, and said unto the first, How much owest thou unto my lord?"}, {"s": 40533, "e": 43333, "t": "And he said, An hundred measures of oil."}, {"s": 43333, "e": 48267, "t": "And he said unto him, Take thy bill, and sit down quickly, and write fifty."}, {"s": 48267, "e": 52267, "t": "Then said he to another, And how much owest thou?"}, {"s": 52267, "e": 54933, "t": "And he said, An hundred measures of wheat."}, {"s": 54933, "e": 58400, "t": "And he said unto him, Take thy bill, and write fourscore."}, {"s": 58400, "e": 67600, "t": "And the lord commended the unjust steward, because he had done wisely: for the children of this world are in their generation wiser than the children of light."}, {"s": 67600, "e": 78667, "t": "And I say unto you, Make to yourselves friends of the mammon of unrighteousness; that, when ye fail, they may receive you into everlasting habitations."}, {"s": 78667, "e": 86800, "t": "He that is faithful in that which is least is faithful also in much: and he that is unjust in the least is unjust also in much."}, {"s": 86800, "e": 93200, "t": "If therefore ye have not been faithful in the unrighteous mammon, who will commit to your trust the true riches?"}, {"s": 93200, "e": 99200, "t": "And if ye have not been faithful in that which is another man's, who shall give you that which is your own?"}, {"s": 99200, "e": 107733, "t": "No servant can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other."}, {"s": 107733, "e": 110133, "t": "Ye cannot serve God and mammon."}, {"s": 110133, "e": 115733, "t": "And the Pharisees also, who were covetous, heard all these things: and they derided him."}, {"s": 115733, "e": 126133, "t": "And he said unto them, Ye are they which justify yourselves before men; but God knoweth your hearts: for that which is highly esteemed among men is abomination in the sight of God."}, {"s": 126133, "e": 133600, "t": "The law and the prophets were until John: since that time the kingdom of God is preached, and every man presseth into it."}, {"s": 133600, "e": 138800, "t": "And it is easier for heaven and earth to pass, than one tittle of the law to fail."}, {"s": 138800, "e": 148000, "t": "Whosoever putteth away his wife, and marrieth another, committeth adultery: and whosoever marrieth her that is put away from her husband committeth adultery."}, {"s": 148000, "e": 163333, "t": "There was a certain rich man, which was clothed in purple and fine linen, and fared sumptuously every day: And there was a certain beggar named Lazarus, which was laid at his gate, full of sores, And desiring to be fed with the crumbs which fell from the rich man's table:"}, {"s": 163333, "e": 165867, "t": "moreover the dogs came and licked his sores."}, {"s": 165867, "e": 180667, "t": "And it came to pass, that the beggar died, and was carried by the angels into Abraham's bosom: the rich man also died, and was buried; And in hell he lift up his eyes, being in torments, and seeth Abraham afar off, and Lazarus in his bosom."}, {"s": 180667, "e": 191333, "t": "And he cried and said, Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue; for I am tormented in this flame."}, {"s": 191333, "e": 202533, "t": "But Abraham said, Son, remember that thou in thy lifetime receivedst thy good things, and likewise Lazarus evil things: but now he is comforted, and thou art tormented."}, {"s": 202533, "e": 212400, "t": "And beside all this, between us and you there is a great gulf fixed: so that they which would pass from hence to you cannot; neither can they pass to us, that would come from thence."}, {"s": 212400, "e": 224000, "t": "Then he said, I pray thee therefore, father, that thou wouldest send him to my father's house: For I have five brethren; that he may testify unto them, lest they also come into this place of torment."}, {"s": 224000, "e": 228400, "t": "Abraham saith unto him, They have Moses and the prophets; let them hear them."}, {"s": 228400, "e": 234400, "t": "And he said, Nay, father Abraham: but if one went unto them from the dead, they will repent."}, {"s": 234400, "e": 241467, "t": "And he said unto him, If they hear not Moses and the prophets, neither will they be persuaded, though one rose from the dead."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
