const S=[{"s": 0, "e": 1333, "t": "Luke, Chapter Twenty."}, {"s": 1333, "e": 14933, "t": "And it came to pass, that on one of those days, as he taught the people in the temple, and preached the gospel, the chief priests and the scribes came upon him with the elders, And spake unto him, saying, Tell us, by what authority doest thou these things?"}, {"s": 14933, "e": 17867, "t": "or who is he that gave thee this authority?"}, {"s": 17867, "e": 26533, "t": "And he answered and said unto them, I will also ask you one thing; and answer me: The baptism of John, was it from heaven, or of men?"}, {"s": 26533, "e": 34133, "t": "And they reasoned with themselves, saying, If we shall say, From heaven; he will say, Why then believed ye him not?"}, {"s": 34133, "e": 41467, "t": "But and if we say, Of men; all the people will stone us: for they be persuaded that John was a prophet."}, {"s": 41467, "e": 45467, "t": "And they answered, that they could not tell whence it was."}, {"s": 45467, "e": 50667, "t": "And Jesus said unto them, Neither tell I you by what authority I do these things."}, {"s": 50667, "e": 59733, "t": "Then began he to speak to the people this parable; A certain man planted a vineyard, and let it forth to husbandmen, and went into a far country for a long time."}, {"s": 59733, "e": 67867, "t": "And at the season he sent a servant to the husbandmen, that they should give him of the fruit of the vineyard: but the husbandmen beat him, and sent him away empty."}, {"s": 67867, "e": 75067, "t": "And again he sent another servant: and they beat him also, and entreated him shamefully, and sent him away empty."}, {"s": 75067, "e": 80267, "t": "And again he sent a third: and they wounded him also, and cast him out."}, {"s": 80267, "e": 83467, "t": "Then said the lord of the vineyard, What shall I do?"}, {"s": 83467, "e": 88400, "t": "I will send my beloved son: it may be they will reverence him when they see him."}, {"s": 88400, "e": 96933, "t": "But when the husbandmen saw him, they reasoned among themselves, saying, This is the heir: come, let us kill him, that the inheritance may be ours."}, {"s": 96933, "e": 99733, "t": "So they cast him out of the vineyard, and killed him."}, {"s": 99733, "e": 103200, "t": "What therefore shall the lord of the vineyard do unto them?"}, {"s": 103200, "e": 107200, "t": "He shall come and destroy these husbandmen, and shall give the vineyard to others."}, {"s": 107200, "e": 109733, "t": "And when they heard it, they said, God forbid."}, {"s": 109733, "e": 118400, "t": "And he beheld them, and said, What is this then that is written, The stone which the builders rejected, the same is become the head of the corner?"}, {"s": 118400, "e": 125200, "t": "Whosoever shall fall upon that stone shall be broken; but on whomsoever it shall fall, it will grind him to powder."}, {"s": 125200, "e": 135333, "t": "And the chief priests and the scribes the same hour sought to lay hands on him; and they feared the people: for they perceived that he had spoken this parable against them."}, {"s": 135333, "e": 146800, "t": "And they watched him, and sent forth spies, which should feign themselves just men, that they might take hold of his words, that so they might deliver him unto the power and authority of the governor."}, {"s": 146800, "e": 159467, "t": "And they asked him, saying, Master, we know that thou sayest and teachest rightly, neither acceptest thou the person of any, but teachest the way of God truly: Is it lawful for us to give tribute unto Caesar, or no?"}, {"s": 159467, "e": 164000, "t": "But he perceived their craftiness, and said unto them, Why tempt ye me?"}, {"s": 164000, "e": 165467, "t": "Shew me a penny."}, {"s": 165467, "e": 167867, "t": "Whose image and superscription hath it?"}, {"s": 167867, "e": 171867, "t": "They answered and said, Caesar's."}, {"s": 171867, "e": 179200, "t": "And he said unto them, Render therefore unto Caesar the things which be Caesar's, and unto God the things which be God's."}, {"s": 179200, "e": 185200, "t": "And they could not take hold of his words before the people: and they marvelled at his answer, and held their peace."}, {"s": 185200, "e": 201867, "t": "Then came to him certain of the Sadducees, which deny that there is any resurrection; and they asked him, Saying, Master, Moses wrote unto us, If any man's brother die, having a wife, and he die without children, that his brother should take his wife, and raise up seed unto his brother."}, {"s": 201867, "e": 206800, "t": "There were therefore seven brethren: and the first took a wife, and died without children."}, {"s": 206800, "e": 210400, "t": "And the second took her to wife, and he died childless."}, {"s": 210400, "e": 216667, "t": "And the third took her; and in like manner the seven also: and they left no children, and died."}, {"s": 216667, "e": 219200, "t": "Last of all the woman died also."}, {"s": 219200, "e": 222267, "t": "Therefore in the resurrection whose wife of them is she?"}, {"s": 222267, "e": 224400, "t": "for seven had her to wife."}, {"s": 224400, "e": 239200, "t": "And Jesus answering said unto them, The children of this world marry, and are given in marriage: But they which shall be accounted worthy to obtain that world, and the resurrection from the dead, neither marry, nor are given in marriage: Neither can they die any more:"}, {"s": 239200, "e": 245867, "t": "for they are equal unto the angels; and are the children of God, being the children of the resurrection."}, {"s": 245867, "e": 254533, "t": "Now that the dead are raised, even Moses shewed at the bush, when he calleth the Lord the God of Abraham, and the God of Isaac, and the God of Jacob."}, {"s": 254533, "e": 259733, "t": "For he is not a God of the dead, but of the living: for all live unto him."}, {"s": 259733, "e": 264667, "t": "Then certain of the scribes answering said, Master, thou hast well said."}, {"s": 264667, "e": 268133, "t": "And after that they durst not ask him any question at
