<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>philemon-01</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
   line-height:1.7;font-size:1.15rem}
 header{position:sticky;top:0;background:var(--bg);padding:.6rem 1rem;
   border-bottom:1px solid #ddd5c7;box-shadow:0 2px 8px rgba(0,0,0,.05)}
 audio{width:100%}
 main{max-width:42rem;margin:0 auto;padding:1.2rem 1.1rem 40vh}
 h1{font-size:1.1rem;color:var(--dim);font-weight:600;margin:.2rem 0 1rem}
 .s{cursor:pointer;border-radius:.25rem;padding:.02em 0;transition:background .12s}
 .s:hover{background:#eadfc8}
 .s.active{background:var(--hi);box-shadow:0 0 0 .15em var(--hi)}
 .spd{margin-top:.45rem;font-size:.85rem;color:var(--dim)}
 .spd button{font:inherit;margin:0 .12rem;padding:.18rem .55rem;border:1px solid #ccc3b2;
   background:#fbf7ee;color:var(--fg);border-radius:.4rem;cursor:pointer}
 .spd button.on{background:var(--hi);border-color:#e0c050}
</style></head><body>
<header><audio id="a" src="philemon-01.opus" controls preload="metadata"></audio>
<div class="spd">Speed:
 <button data-r="1" class="on">1&times;</button><button data-r="1.25">1.25&times;</button>
 <button data-r="1.5">1.5&times;</button><button data-r="2">2&times;</button></div></header>
<main><h1>philemon-01</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 800, "t": "Philemon."}, {"s": 800, "e": 17333, "t": "Paul, a prisoner of Jesus Christ, and Timothy our brother, unto Philemon our dearly beloved, and fellowlabourer, And to our beloved Apphia, and Archippus our fellowsoldier, and to the church in thy house: Grace to you, and peace, from God our Father and the Lord Jesus Christ."}, {"s": 17333, "e": 34000, "t": "I thank my God, making mention of thee always in my prayers, Hearing of thy love and faith, which thou hast toward the Lord Jesus, and toward all saints; That the communication of thy faith may become effectual by the acknowledging of every good thing which is in you in Christ Jesus."}, {"s": 34000, "e": 40533, "t": "For we have great joy and consolation in thy love, because the bowels of the saints are refreshed by thee, brother."}, {"s": 40533, "e": 52133, "t": "Wherefore, though I might be much bold in Christ to enjoin thee that which is convenient, Yet for love's sake I rather beseech thee, being such an one as Paul the aged, and now also a prisoner of Jesus Christ."}, {"s": 52133, "e": 69333, "t": "I beseech thee for my son Onesimus, whom I have begotten in my bonds: Which in time past was to thee unprofitable, but now profitable to thee and to me: Whom I have sent again: thou therefore receive him, that is, mine own bowels: Whom I would have retained with me,"}, {"s": 69333, "e": 81067, "t": "that in thy stead he might have ministered unto me in the bonds of the gospel: But without thy mind would I do nothing; that thy benefit should not be as it were of necessity, but willingly."}, {"s": 81067, "e": 96400, "t": "For perhaps he therefore departed for a season, that thou shouldest receive him for ever; Not now as a servant, but above a servant, a brother beloved, specially to me, but how much more unto thee, both in the flesh, and in the Lord?"}, {"s": 96400, "e": 100933, "t": "If thou count me therefore a partner, receive him as myself."}, {"s": 100933, "e": 114133, "t": "If he hath wronged thee, or oweth thee ought, put that on mine account; I Paul have written it with mine own hand, I will repay it: albeit I do not say to thee how thou owest unto me even thine own self besides."}, {"s": 114133, "e": 118533, "t": "Yea, brother, let me have joy of thee in the Lord: refresh my bowels in the Lord."}, {"s": 118533, "e": 124533, "t": "Having confidence in thy obedience I wrote unto thee, knowing that thou wilt also do more than I say."}, {"s": 124533, "e": 130533, "t": "But withal prepare me also a lodging: for I trust that through your prayers I shall be given unto you."}, {"s": 130533, "e": 139067, "t": "There salute thee Epaphras, my fellowprisoner in Christ Jesus; Marcus, Aristarchus, Demas, Lucas, my fellowlabourers."}, {"s": 139067, "e": 142533, "t": "The grace of our Lord Jesus Christ be with your spirit."}, {"s": 142533, "e": 143333, "t": "Amen."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
