const S=[{"s": 0, "e": 2400, "t": "Luke, Chapter Twenty-Two."}, {"s": 2400, "e": 6533, "t": "Now the feast of unleavened bread drew nigh, which is called the Passover."}, {"s": 6533, "e": 11733, "t": "And the chief priests and scribes sought how they might kill him; for they feared the people."}, {"s": 11733, "e": 17333, "t": "Then entered Satan into Judas surnamed Iscariot, being of the number of the twelve."}, {"s": 17333, "e": 23467, "t": "And he went his way, and communed with the chief priests and captains, how he might betray him unto them."}, {"s": 23467, "e": 26533, "t": "And they were glad, and covenanted to give him money."}, {"s": 26533, "e": 31733, "t": "And he promised, and sought opportunity to betray him unto them in the absence of the multitude."}, {"s": 31733, "e": 36267, "t": "Then came the day of unleavened bread, when the passover must be killed."}, {"s": 36267, "e": 41467, "t": "And he sent Peter and John, saying, Go and prepare us the passover, that we may eat."}, {"s": 41467, "e": 45333, "t": "And they said unto him, Where wilt thou that we prepare?"}, {"s": 45333, "e": 54667, "t": "And he said unto them, Behold, when ye are entered into the city, there shall a man meet you, bearing a pitcher of water; follow him into the house where he entereth in."}, {"s": 54667, "e": 63467, "t": "And ye shall say unto the goodman of the house, The Master saith unto thee, Where is the guestchamber, where I shall eat the passover with my disciples?"}, {"s": 63467, "e": 68800, "t": "And he shall shew you a large upper room furnished: there make ready."}, {"s": 68800, "e": 73600, "t": "And they went, and found as he had said unto them: and they made ready the passover."}, {"s": 73600, "e": 78133, "t": "And when the hour was come, he sat down, and the twelve apostles with him."}, {"s": 78133, "e": 90400, "t": "And he said unto them, With desire I have desired to eat this passover with you before I suffer: For I say unto you, I will not any more eat thereof, until it be fulfilled in the kingdom of God."}, {"s": 90400, "e": 100933, "t": "And he took the cup, and gave thanks, and said, Take this, and divide it among yourselves: For I say unto you, I will not drink of the fruit of the vine, until the kingdom of God shall come."}, {"s": 100933, "e": 110000, "t": "And he took bread, and gave thanks, and brake it, and gave unto them, saying, This is my body which is given for you: this do in remembrance of me."}, {"s": 110000, "e": 117333, "t": "Likewise also the cup after supper, saying, This cup is the new testament in my blood, which is shed for you."}, {"s": 117333, "e": 122000, "t": "But, behold, the hand of him that betrayeth me is with me on the table."}, {"s": 122000, "e": 128400, "t": "And truly the Son of man goeth, as it was determined: but woe unto that man by whom he is betrayed!"}, {"s": 128400, "e": 133467, "t": "And they began to inquire among themselves, which of them it was that should do this thing."}, {"s": 133467, "e": 137600, "t": "And there was also a strife among them, which of them should be accounted the greatest."}, {"s": 137600, "e": 146267, "t": "And he said unto them, The kings of the Gentiles exercise lordship over them; and they that exercise authority upon them are called benefactors."}, {"s": 146267, "e": 156400, "t": "But ye shall not be so: but he that is greatest among you, let him be as the younger; and he that is chief, as he that doth serve."}, {"s": 156400, "e": 160400, "t": "For whether is greater, he that sitteth at meat, or he that serveth?"}, {"s": 160400, "e": 162667, "t": "is not he that sitteth at meat?"}, {"s": 162667, "e": 165867, "t": "but I am among you as he that serveth."}, {"s": 165867, "e": 169733, "t": "Ye are they which have continued with me in my temptations."}, {"s": 169733, "e": 181333, "t": "And I appoint unto you a kingdom, as my Father hath appointed unto me; That ye may eat and drink at my table in my kingdom, and sit on thrones judging the twelve tribes of Israel."}, {"s": 181333, "e": 194800, "t": "And the Lord said, Simon, Simon, behold, Satan hath desired to have you, that he may sift you as wheat: But I have prayed for thee, that thy faith fail not: and when thou art converted, strengthen thy brethren."}, {"s": 194800, "e": 200267, "t": "And he said unto him, Lord, I am ready to go with thee, both into prison, and to death."}, {"s": 200267, "e": 208933, "t": "And he said, I tell thee, Peter, the cock shall not crow this day, before that thou shalt thrice deny that thou knowest me."}, {"s": 208933, "e": 215733, "t": "And he said unto them, When I sent you without purse, and scrip, and shoes, lacked ye any thing?"}, {"s": 215733, "e": 217600, "t": "And they said, Nothing."}, {"s": 217600, "e": 228400, "t": "Then said he unto them, But now, he that hath a purse, let him take it, and likewise his scrip: and he that hath no sword, let him sell his garment, and buy one."}, {"s": 228400, "e": 238533, "t": "For I say unto you, that this that is written must yet be accomplished in me, And he was reckoned among the transgressors: for the things concerning me have an end."}, {"s": 238533, "e": 241600, "t": "And they said, Lord, behold, here are two swords."}, {"s": 241600, "e": 244267, "t": "And he said unto them, It is enough."}, {"s": 244267, "e": 250133, "t": "And he came out, and went, as he was wont, to the mount of Olives; and his disciples also followed him."}, {"s": 250133, "e": 256800, "t": "And when he was at the place, he said unto them, Pray that ye enter not into temptation."}, {"s": 256800, "e": 269067, "t": "And he was withdrawn from them about a stone's cast, and kneeled down, and prayed, Saying, Father, if thou be willing, remove this cup from me: nevertheless not my will, but thine, be done."}, {"s": 269067, "e": 273600, "t": "And there appeared an angel unto him from heaven, strengthening him."}, {"s": 273600, "e": 281600, "t": "And being in an agony he prayed more earnestly: and his sweat was as it were great drops of blood falling down to the ground."}, {"s": 281600, "e": 290400, "t": "And when he rose up from prayer, and was come to his disciples, he found them sleeping for sorrow, And said unto them, Why sleep ye?"}, {"s": 290400, "e": 293600, "t": "rise and pray, lest ye enter into temptation."}, {"s": 293600, "e": 303200, "t": "And while he yet spake, behold a multitude, and he that was called Judas, one of the twelve, went before them, and drew near unto Jesus to kiss him."}, {"s": 303200, "e": 307867, "t": "But Jesus said unto him, Judas, betrayest thou the Son of man with a kiss?"}, {"s": 307867, "e": 313600, "t": "When they which were about him saw what would follow, they said unto him, Lord, shall we smite with the sword?"}, {"s": 313600, "e": 317867, "t": "And one of them smote the servant of the high priest, and cut off his right ear."}, {"s": 317867, "e": 321067, "t": "And Jesus answered and said, Suffer ye thus far."}, {"s": 321067, "e": 323333, "t": "And he touched his ear, and healed him."}, {"s": 323333, "e": 333067, "t": "Then Jesus said unto the chief priests, and captains of the temple, and the elders, which were come to him, Be ye come out, as against a thief, with swords and staves?"}, {"s": 333067, "e": 340667, "t": "When I was daily with you in the temple, ye stretched forth no hands against me: but this is your hour, and the power of darkness."}, {"s": 340667, "e": 345467, "t": "Then took they him, and led him, and brought him into the high priest's house."}, {"s": 345467, "e": 347733, "t": "And Peter followed afar off."}, {"s": 347733, "e": 355067, "t": "And when they had kindled a fire in the midst of the hall, and were set down together, Peter sat down among them."}, {"s": 355067, "e": 362667, "t": "But a certain maid beheld him as he sat by the fire, and earnestly looked upon him, and said, This man was also with him."}, {"s": 362667, "e": 367067, "t": "And he denied him, saying, Woman, I know him not."}, {"s": 367067, "e": 371867, "t": "And after a little while another saw him, and said, Thou art also of them."}, {"s": 371867, "e": 375067, "t": "And Peter said, Man, I am not."}, {"s": 375067, "e": 384667, "t": "And about the space of one hour after another confidently affirmed, saying, Of a truth this fellow also was with him: for he is a Galilaean."}, {"s": 384667, "e": 388667, "t": "And Peter said, Man, I know not what thou sayest."}, {"s": 388667, "e": 391600, "t": "And immediately, while he yet spake, the cock crew."}, {"s": 391600, "e": 394400, "t": "And the Lord turned, and looked upon Peter."}, {"s": 394400, "e": 400933, "t": "And Peter remembered the word of the Lord, how he had said unto him, Before the cock crow, thou shalt deny me thrice."}, {"s": 400933, "e": 403600, "t": "And Peter went out, and wept bitterly."}, {"s": 403600, "e": 406533, "t": "And the men that held Jesus mocked him, and smote him."}, {"s": 406533, "e": 414133, "t": "And when they had blindfolded him, they struck him on the face, and asked him, saying, Prophesy, who is it that smote thee?"}, {"s": 414133, "e": 417867, "t": "And many other things blasphemously spake they against him."}, {"s": 417867, "e": 427067, "t": "And as soon as it was day, the elders of the people and the chief priests and the scribes came together, and led him into their council, saying, Art thou the Christ?"}, {"s": 427067, "e": 428000, "t": "tell us."}, {"s": 428000, "e": 436133, "t": "And he said unto them, If I tell you, ye will not believe: And if I also ask you, ye will not answer me, nor let me go."}, {"s": 436133, "e": 440400, "t": "Hereafter shall the Son of man sit on the right hand of the power of God."}, {"s": 440400, "e": 444000, "t": "Then said they all, Art thou then the Son of God?"}, {"s": 444000, "e": 447467, "t": "And he said unto them, Ye say that I am."}, {"s": 447467, "e": 450533, "t": "And they said, What need we any further witness?"}, {"s": 450533, "e": 453333, "t": "for we ourselves have heard of his own mouth."}],a=document.
