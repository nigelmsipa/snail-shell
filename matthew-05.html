const S=[{"s": 0, "e": 2000, "t": "Matthew, Chapter Five."}, {"s": 2000, "e": 15867, "t": "And seeing the multitudes, he went up into a mountain: and when he was set, his disciples came unto him: And he opened his mouth, and taught them, saying, Blessed are the poor in spirit: for theirs is the kingdom of heaven."}, {"s": 15867, "e": 19467, "t": "Blessed are they that mourn: for they shall be comforted."}, {"s": 19467, "e": 22667, "t": "Blessed are the meek: for they shall inherit the earth."}, {"s": 22667, "e": 27867, "t": "Blessed are they which do hunger and thirst after righteousness: for they shall be filled."}, {"s": 27867, "e": 31467, "t": "Blessed are the merciful: for they shall obtain mercy."}, {"s": 31467, "e": 35867, "t": "Blessed are the pure in heart: for they shall see God."}, {"s": 35867, "e": 40400, "t": "Blessed are the peacemakers: for they shall be called the children of God."}, {"s": 40400, "e": 46533, "t": "Blessed are they which are persecuted for righteousness' sake: for theirs is the kingdom of heaven."}, {"s": 46533, "e": 55067, "t": "Blessed are ye, when men shall revile you, and persecute you, and shall say all manner of evil against you falsely, for my sake."}, {"s": 55067, "e": 63333, "t": "Rejoice, and be exceeding glad: for great is your reward in heaven: for so persecuted they the prophets which were before you."}, {"s": 63333, "e": 70933, "t": "Ye are the salt of the earth: but if the salt have lost his savour, wherewith shall it be salted?"}, {"s": 70933, "e": 76667, "t": "it is thenceforth good for nothing, but to be cast out, and to be trodden under foot of men."}, {"s": 76667, "e": 78800, "t": "Ye are the light of the world."}, {"s": 78800, "e": 81733, "t": "A city that is set on an hill cannot be hid."}, {"s": 81733, "e": 89867, "t": "Neither do men light a candle, and put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house."}, {"s": 89867, "e": 97333, "t": "Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven."}, {"s": 97333, "e": 104267, "t": "Think not that I am come to destroy the law, or the prophets: I am not come to destroy, but to fulfil."}, {"s": 104267, "e": 113867, "t": "For verily I say unto you, Till heaven and earth pass, one jot or one tittle shall in no wise pass from the law, till all be fulfilled."}, {"s": 113867, "e": 127067, "t": "Whosoever therefore shall break one of these least commandments, and shall teach men so, he shall be called the least in the kingdom of heaven: but whosoever shall do and teach them, the same shall be called great in the kingdom of heaven."}, {"s": 127067, "e": 137200, "t": "For I say unto you, That except your righteousness shall exceed the righteousness of the scribes and Pharisees, ye shall in no case enter into the kingdom of heaven."}, {"s": 137200, "e": 157333, "t": "Ye have heard that it was said by them of old time, Thou shalt not kill; and whosoever shall kill shall be in danger of the judgment: But I say unto you, That whosoever is angry with his brother without a cause shall be in danger of the judgment: and whosoever shall say to his brother, Raca,"}, {"s": 157333, "e": 163467, "t": "shall be in danger of the council: but whosoever shall say, Thou fool, shall be in danger of hell fire."}, {"s": 163467, "e": 176800, "t": "Therefore if thou bring thy gift to the altar, and there rememberest that thy brother hath ought against thee; Leave there thy gift before the altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift."}, {"s": 176800, "e": 188400, "t": "Agree with thine adversary quickly, whiles thou art in the way with him; lest at any time the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison."}, {"s": 188400, "e": 194667, "t": "Verily I say unto thee, Thou shalt by no means come out thence, till thou hast paid the uttermost farthing."}, {"s": 194667, "e": 206933, "t": "Ye have heard that it was said by them of old time, Thou shalt not commit adultery: But I say unto you, That whosoever looketh on a woman to lust after her hath committed adultery with her already in his heart."}, {"s": 206933, "e": 217200, "t": "And if thy right eye offend thee, pluck it out, and cast it from thee: for it is profitable for thee that one of thy members should perish, and not that thy whole body should be cast into hell."}, {"s": 217200, "e": 228667, "t": "And if thy right hand offend thee, cut it off, and cast it from thee: for it is profitable for thee that one of thy members should perish, and not that thy whole body should be cast into hell."}, {"s": 228667, "e": 246267, "t": "It hath been said, Whosoever shall put away his wife, let him give her a writing of divorcement: But I say unto you, That whosoever shall put away his wife, saving for the cause of fornication, causeth her to commit adultery: and whosoever shall marry her that is divorced committeth adultery."}, {"s": 246267, "e": 262400, "t": "Again, ye have heard that it hath been said by them of old time, Thou shalt not forswear thyself, but shalt perform unto the Lord thine oaths: But I say unto you, Swear not at all; neither by heaven; for it is God's throne: Nor by the earth; for it is his footstool: neither by Jerusalem;"}, {"s": 262400, "e": 264533, "t": "for it is the city of the great King."}, {"s": 264533, "e": 269867, "t": "Neither shalt thou swear by thy head, because thou canst not make one hair white or black."}, {"s": 269867, "e": 277467, "t": "But let your communication be, Yea, yea; Nay, nay: for whatsoever is more than these cometh of evil."}, {"s": 277467, "e": 291733, "t": "Ye have heard that it hath been said, An eye for an eye, and a tooth for a tooth: But I say unto you, That ye resist not evil: but whosoever shall smite thee on thy right cheek, turn to him the other also."}, {"s": 291733, "e": 298133, "t": "And if any man will sue thee at the law, and take away thy coat, let him have thy cloke also."}, {"s": 298133, "e": 302267, "t": "And whosoever shall compel thee to go a mile, go with him twain."}, {"s": 302267, "e": 307333, "t": "Give to him that asketh thee, and from him that would borrow of thee turn not thou away."}, {"s": 307333, "e": 312000, "t": "Ye have heard that it hath been said, Thou shalt love thy neighbour, and hate thine enemy."}, {"s": 312000, "e": 329333, "t": "But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you; That ye may be the children of your Father which is in heaven: for he maketh his sun to rise on the evil and on the good,"}, {"s": 329333, "e": 331067, "t": "and sendeth rain on the just and on the unjust."}, {"s": 331067, "e": 334400, "t": "For if ye love them which love you, what reward have ye?"}, {"s": 334400, "e": 336800, "t": "do not even the publicans the same?"}, {"s": 336800, "e": 340267, "t": "And if ye salute your brethren only, what do ye more than others?"}, {"s": 340267, "e": 342400, "t": "do not even the publicans so?"}, {"s": 342400, "e": 346267, "t": "Be ye therefore perfect, even as your Father which is in heaven is perfect."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');

 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
