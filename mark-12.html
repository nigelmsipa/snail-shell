<main><h1>mark-12</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1200, "t": "Mark, Chapter Twelve."}, {"s": 1200, "e": 3600, "t": "And he began to speak unto them by parables."}, {"s": 3600, "e": 14267, "t": "A certain man planted a vineyard, and set an hedge about it, and digged a place for the winefat, and built a tower, and let it out to husbandmen, and went into a far country."}, {"s": 14267, "e": 21200, "t": "And at the season he sent to the husbandmen a servant, that he might receive from the husbandmen of the fruit of the vineyard."}, {"s": 21200, "e": 24933, "t": "And they caught him, and beat him, and sent him away empty."}, {"s": 24933, "e": 33867, "t": "And again he sent unto them another servant; and at him they cast stones, and wounded him in the head, and sent him away shamefully handled."}, {"s": 33867, "e": 40533, "t": "And again he sent another; and him they killed, and many others; beating some, and killing some."}, {"s": 40533, "e": 48000, "t": "Having yet therefore one son, his wellbeloved, he sent him also last unto them, saying, They will reverence my son."}, {"s": 48000, "e": 56267, "t": "But those husbandmen said among themselves, This is the heir; come, let us kill him, and the inheritance shall be ours."}, {"s": 56267, "e": 60133, "t": "And they took him, and killed him, and cast him out of the vineyard."}, {"s": 60133, "e": 62800, "t": "What shall therefore the lord of the vineyard do?"}, {"s": 62800, "e": 67467, "t": "he will come and destroy the husbandmen, and will give the vineyard unto others."}, {"s": 67467, "e": 76133, "t": "And have ye not read this scripture; The stone which the builders rejected is become the head of the corner: This was the Lord's doing, and it is marvellous in our eyes?"}, {"s": 76133, "e": 85200, "t": "And they sought to lay hold on him, but feared the people: for they knew that he had spoken the parable against them: and they left him, and went their way."}, {"s": 85200, "e": 90533, "t": "And they send unto him certain of the Pharisees and of the Herodians, to catch him in his words."}, {"s": 90533, "e": 106000, "t": "And when they were come, they say unto him, Master, we know that thou art true, and carest for no man: for thou regardest not the person of men, but teachest the way of God in truth: Is it lawful to give tribute to Caesar, or not?"}, {"s": 106000, "e": 108400, "t": "Shall we give, or shall we not give?"}, {"s": 108400, "e": 113467, "t": "But he, knowing their hypocrisy, said unto them, Why tempt ye me?"}, {"s": 113467, "e": 116133, "t": "bring me a penny, that I may see it."}, {"s": 116133, "e": 117067, "t": "And they brought it."}, {"s": 117067, "e": 120800, "t": "And he saith unto them, Whose is this image and superscription?"}, {"s": 120800, "e": 123067, "t": "And they said unto him, Caesar's."}, {"s": 123067, "e": 130000, "t": "And Jesus answering said unto them, Render to Caesar the things that are Caesar's, and to God the things that are God's."}, {"s": 130000, "e": 131733, "t": "And they marvelled at him."}, {"s": 131733, "e": 146400, "t": "Then come unto him the Sadducees, which say there is no resurrection; and they asked him, saying, Master, Moses wrote unto us, If a man's brother die, and leave his wife behind him, and leave no children, that his brother should take his wife, and raise up seed unto his brother."}, {"s": 146400, "e": 151333, "t": "Now there were seven brethren: and the first took a wife, and dying left no seed."}, {"s": 151333, "e": 156267, "t": "And the second took her, and died, neither left he any seed: and the third likewise."}, {"s": 156267, "e": 161467, "t": "And the seven had her, and left no seed: last of all the woman died also."}, {"s": 161467, "e": 166933, "t": "In the resurrection therefore, when they shall rise, whose wife shall she be of them?"}, {"s": 166933, "e": 169467, "t": "for the seven had her to wife."}, {"s": 169467, "e": 176400, "t": "And Jesus answering said unto them, Do ye not therefore err, because ye know not the scriptures, neither the power of God?"}, {"s": 176400, "e": 184000, "t": "For when they shall rise from the dead, they neither marry, nor are given in marriage; but are as the angels which are in heaven."}, {"s": 184000, "e": 196400, "t": "And as touching the dead, that they rise: have ye not read in the book of Moses, how in the bush God spake unto him, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob?"}, {"s": 196400, "e": 200667, "t": "He is not the God of the dead, but the God of the living: ye therefore do greatly err."}, {"s": 200667, "e": 210533, "t": "And one of the scribes came, and having heard them reasoning together, and perceiving that he had answered them well, asked him, Which is the first commandment of all?"}, {"s": 210533, "e": 226267, "t": "And Jesus answered him, The first of all the commandments is, Hear, O Israel; The Lord our God is one Lord: And thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind, and with all thy strength: this is the first commandment."}, {"s": 226267, "e": 231467, "t": "And the second is like, namely this, Thou shalt love thy neighbour as thyself."}, {"s": 231467, "e": 234133, "t": "There is none other commandment greater than these."}, {"s": 234133, "e": 251733, "t": "And the scribe said unto him, Well, Master, thou hast said the truth: for there is one God; and there is none other but he: And to love him with all the heart, and with all the understanding, and with all the soul, and with all the strength, and to love his neighbour as himself,"}, {"s": 251733, "e": 254800, "t": "is more than all whole burnt offerings and sacrifices."}, {"s": 254800, "e": 260800, "t": "And when Jesus saw that he answered discreetly, he said unto him, Thou art not far from the kingdom of God."}, {"s": 260800, "e": 263867, "t": "And no man after that durst ask him any question."}, {"s": 263867, "e": 270800, "t": "And Jesus answered and said, while he taught in the temple, How say the scribes that Christ is the Son of David?"}, {"s": 270800, "e": 279467, "t": "For David himself said by the Holy Ghost, The LORD said to my Lord, Sit thou on my right hand, till I make thine enemies thy footstool."}, {"s": 279467, "e": 284267, "t": "David therefore himself calleth him Lord; and whence is he then his son?"}, {"s": 284267, "e": 286533, "t": "And the common people heard him gladly."}, {"s": 286533, "e": 302133, "t": "And he said unto them in his doctrine, Beware of the scribes, which love to go in long clothing, and love salutations in the marketplaces, And the chief seats in the synagogues, and the uppermost rooms at feasts: Which devour widows' houses, and for a pretence make long prayers:"}, {"s": 302133, "e": 304533, "t": "these shall receive greater damnation."}, {"s": 304533, "e": 312133, "t": "And Jesus sat over against the treasury, and beheld how the people cast money into the treasury: and many that were rich cast in much."}, {"s": 312133, "e": 316667, "t": "And there came a certain poor widow, and she threw in two mites, which make a farthing."}, {"s": 316667, "e": 334800, "t": "And he called unto him his disciples, and saith unto them, Verily I say unto you, That this poor widow hath cast more in, than all they which have cast into the treasury: For all they did cast in of their abundance; but she of her want did cast in all that she had, even all her living."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
