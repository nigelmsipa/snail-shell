<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>hebrews-07</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
   line-height:1.7;font-size:1.15rem}
 header{position:sticky;top:0;background:var(--bg);padding:.6rem 1rem;

 audio{width:100%}
 main{max-width:42rem;margin:0 auto;padding:1.2rem 1.1rem 40vh}
 h1{font-size:1.1rem;color:var(--dim);font-weight:600;margin:.2rem 0 1rem}

 .s.active{background:var(--hi);box-shadow:0 0 0 .15em var(--hi)}
 .spd{margin-top:.45rem;font-size:.85rem;color:var(--dim)}

<header><audio id="a" src="hebrews-07.opus" controls preload="metadata"></audio>
<div class="spd">Speed:

<main><h1>hebrews-07</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1600, "t": "Hebrews, Chapter Seven."}, {"s": 1600, "e": 18933, "t": "For this Melchisedec, king of Salem, priest of the most high God, who met Abraham returning from the slaughter of the kings, and blessed him; To whom also Abraham gave a tenth part of all; first being by interpretation King of righteousness, and after that also King of Salem, which is,"}, {"s": 18933, "e": 30667, "t": "King of peace; Without father, without mother, without descent, having neither beginning of days, nor end of life; but made like unto the Son of God; abideth a priest continually."}, {"s": 30667, "e": 37333, "t": "Now consider how great this man was, unto whom even the patriarch Abraham gave the tenth of the spoils."}, {"s": 37333, "e": 50400, "t": "And verily they that are of the sons of Levi, who receive the office of the priesthood, have a commandment to take tithes of the people according to the law, that is, of their brethren, though they come out of the loins of Abraham:"}, {"s": 50400, "e": 56667, "t": "But he whose descent is not counted from them received tithes of Abraham, and blessed him that had the promises."}, {"s": 56667, "e": 60133, "t": "And without all contradiction the less is blessed of the better."}, {"s": 60133, "e": 66400, "t": "And here men that die receive tithes; but there he receiveth them, of whom it is witnessed that he liveth."}, {"s": 66400, "e": 72267, "t": "And as I may so say, Levi also, who receiveth tithes, payed tithes in Abraham."}, {"s": 72267, "e": 76533, "t": "For he was yet in the loins of his father, when Melchisedec met him."}, {"s": 76533, "e": 90000, "t": "If therefore perfection were by the Levitical priesthood, (for under it the people received the law,) what further need was there that another priest should rise after the order of Melchisedec, and not be called after the order of Aaron?"}, {"s": 90000, "e": 95467, "t": "For the priesthood being changed, there is made of necessity a change also of the law."}, {"s": 95467, "e": 102133, "t": "For he of whom these things are spoken pertaineth to another tribe, of which no man gave attendance at the altar."}, {"s": 102133, "e": 108133, "t": "For it is evident that our Lord sprang out of Juda; of which tribe Moses spake nothing concerning priesthood."}, {"s": 108133, "e": 119867, "t": "And it is yet far more evident: for that after the similitude of Melchisedec there ariseth another priest, Who is made, not after the law of a carnal commandment, but after the power of an endless life."}, {"s": 119867, "e": 125200, "t": "For he testifieth, Thou art a priest for ever after the order of Melchisedec."}, {"s": 125200, "e": 130667, "t": "For there is verily a disannulling of the commandment going before for the weakness and unprofitableness thereof."}, {"s": 130667, "e": 137467, "t": "For the law made nothing perfect, but the bringing in of a better hope did; by the which we draw nigh unto God."}, {"s": 137467, "e": 149067, "t": "And inasmuch as not without an oath he was made priest: (For those priests were made without an oath; but this with an oath by him that said unto him, The Lord sware and will not repent,"}, {"s": 149067, "e": 156400, "t": "Thou art a priest for ever after the order of Melchisedec:) By so much was Jesus made a surety of a better testament."}, {"s": 156400, "e": 166000, "t": "And they truly were many priests, because they were not suffered to continue by reason of death: But this man, because he continueth ever, hath an unchangeable priesthood."}, {"s": 166000, "e": 174133, "t": "Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them."}, {"s": 174133, "e": 191867, "t": "For such an high priest became us, who is holy, harmless, undefiled, separate from sinners, and made higher than the heavens; Who needeth not daily, as those high priests, to offer up sacrifice, first for his own sins, and then for the people's: for this he did once, when he offered up himself."}, {"s": 191867, "e": 201067, "t": "For the law maketh men high priests which have infirmity; but the word of the oath, which was since the law, maketh the Son, who is consecrated for evermore."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
