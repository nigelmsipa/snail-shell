<script>
const S=[{"s": 0, "e": 2133, "t": "Luke, Chapter One."}, {"s": 2133, "e": 16533, "t": "Forasmuch as many have taken in hand to set forth in order a declaration of those things which are most surely believed among us, Even as they delivered them unto us, which from the beginning were eyewitnesses, and ministers of the word; It seemed good to me also,"}, {"s": 16533, "e": 29333, "t": "having had perfect understanding of all things from the very first, to write unto thee in order, most excellent Theophilus, That thou mightest know the certainty of those things, wherein thou hast been instructed."}, {"s": 29333, "e": 40000, "t": "There was in the days of Herod, the king of Judaea, a certain priest named Zacharias, of the course of Abia: and his wife was of the daughters of Aaron, and her name was Elisabeth."}, {"s": 40000, "e": 46267, "t": "And they were both righteous before God, walking in all the commandments and ordinances of the Lord blameless."}, {"s": 46267, "e": 52533, "t": "And they had no child, because that Elisabeth was barren, and they both were now well stricken in years."}, {"s": 52533, "e": 64400, "t": "And it came to pass, that while he executed the priest's office before God in the order of his course, According to the custom of the priest's office, his lot was to burn incense when he went into the temple of the Lord."}, {"s": 64400, "e": 68400, "t": "And the whole multitude of the people were praying without at the time of incense."}, {"s": 68400, "e": 74267, "t": "And there appeared unto him an angel of the Lord standing on the right side of the altar of incense."}, {"s": 74267, "e": 78933, "t": "And when Zacharias saw him, he was troubled, and fear fell upon him."}, {"s": 78933, "e": 89067, "t": "But the angel said unto him, Fear not, Zacharias: for thy prayer is heard; and thy wife Elisabeth shall bear thee a son, and thou shalt call his name John."}, {"s": 89067, "e": 93867, "t": "And thou shalt have joy and gladness; and many shall rejoice at his birth."}, {"s": 93867, "e": 103067, "t": "For he shall be great in the sight of the Lord, and shall drink neither wine nor strong drink; and he shall be filled with the Holy Ghost, even from his mother's womb."}, {"s": 103067, "e": 106800, "t": "And many of the children of Israel shall he turn to the Lord their God."}, {"s": 106800, "e": 118667, "t": "And he shall go before him in the spirit and power of Elias, to turn the hearts of the fathers to the children, and the disobedient to the wisdom of the just; to make ready a people prepared for the Lord."}, {"s": 118667, "e": 122533, "t": "And Zacharias said unto the angel, Whereby shall I know this?"}, {"s": 122533, "e": 126667, "t": "for I am an old man, and my wife well stricken in years."}, {"s": 126667, "e": 135733, "t": "And the angel answering said unto him, I am Gabriel, that stand in the presence of God; and am sent to speak unto thee, and to shew thee these glad tidings."}, {"s": 135733, "e": 145733, "t": "And, behold, thou shalt be dumb, and not able to speak, until the day that these things shall be performed, because thou believest not my words, which shall be fulfilled in their season."}, {"s": 145733, "e": 150400, "t": "And the people waited for Zacharias, and marvelled that he tarried so long in the temple."}, {"s": 150400, "e": 159600, "t": "And when he came out, he could not speak unto them: and they perceived that he had seen a vision in the temple: for he beckoned unto them, and remained speechless."}, {"s": 159600, "e": 166133, "t": "And it came to pass, that, as soon as the days of his ministration were accomplished, he departed to his own house."}, {"s": 166133, "e": 177733, "t": "And after those days his wife Elisabeth conceived, and hid herself five months, saying, Thus hath the Lord dealt with me in the days wherein he looked on me, to take away my reproach among men."}, {"s": 177733, "e": 190533, "t": "And in the sixth month the angel Gabriel was sent from God unto a city of Galilee, named Nazareth, To a virgin espoused to a man whose name was Joseph, of the house of David; and the virgin's name was Mary."}, {"s": 190533, "e": 198267, "t": "And the angel came in unto her, and said, Hail, thou that art highly favoured, the Lord is with thee: blessed art thou among women."}, {"s": 198267, "e": 205600, "t": "And when she saw him, she was troubled at his saying, and cast in her mind what manner of salutation this should be."}, {"s": 205600, "e": 211067, "t": "And the angel said unto her, Fear not, Mary: for thou hast found favour with God."}, {"s": 211067, "e": 217200, "t": "And, behold, thou shalt conceive in thy womb, and bring forth a son, and shalt call his name JESUS."}, {"s": 217200, "e": 229733, "t": "He shall be great, and shall be called the Son of the Highest: and the Lord God shall give unto him the throne of his father David: And he shall reign over the house of Jacob for ever; and of his kingdom there shall be no end."}, {"s": 229733, "e": 234667, "t": "Then said Mary unto the angel, How shall this be, seeing I know not a man?"}, {"s": 234667, "e": 246400, "t": "And the angel answered and said unto her, The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee: therefore also that holy thing which shall be born of thee shall be called the Son of God."}, {"s": 246400, "e": 254933, "t": "And, behold, thy cousin Elisabeth, she hath also conceived a son in her old age: and this is the sixth month with her, who was called barren."}, {"s": 254933, "e": 257733, "t": "For with God nothing shall be impossible."}, {"s": 257733, "e": 263067, "t": "And Mary said, Behold the handmaid of the Lord; be it unto me according to thy word."}, {"s": 263067, "e": 265067, "t": "And the angel departed from her."}, {"s": 265067, "e": 275067, "t": "And Mary arose in those days, and went into the hill country with haste, into a city of Juda; And entered into the house of Zacharias, and saluted Elisabeth."}, {"s": 275067, "e": 291200, "t": "And it came to pass, that, when Elisabeth heard the salutation of Mary, the babe leaped in her womb; and Elisabeth was filled with the Holy Ghost: And she spake out with a loud voice, and said, Blessed art thou among women, and blessed is the fruit of thy womb."}, {"s": 291200, "e": 295467, "t": "And whence is this to me, that the mother of my Lord should come to me?"}, {"s": 295467, "e": 304000, "t": "For, lo, as soon as the voice of thy salutation sounded in mine ears, the babe leaped in my womb for joy."}, {"s": 304000, "e": 310267, "t": "And blessed is she that believed: for there shall be a performance of those things which were told her from the Lord."}, {"s": 310267, "e": 316000, "t": "And Mary said, My soul doth magnify the Lord, And my spirit hath rejoiced in God my Saviour."}, {"s": 316000, "e": 324133, "t": "For he hath regarded the low estate of his handmaiden: for, behold, from henceforth all generations shall call me blessed."}, {"s": 324133, "e": 329200, "t": "For he that is mighty hath done to me great things; and holy is his name."}, {"s": 329200, "e": 333733, "t": "And his mercy is on them that fear him from generation to generation."}, {"s": 333733, "e": 339733, "t": "He hath shewed strength with his arm; he hath scattered the proud in the imagination of their hearts."}, {"s": 339733, "e": 343867, "t": "He hath put down the mighty from their seats, and exalted them of low degree."}, {"s": 343867, "e": 348933, "t": "He hath filled the hungry with good things; and the rich he hath sent empty away."}, {"s": 348933, "e": 356533, "t": "He hath holpen his servant Israel, in remembrance of his mercy; As he spake to our fathers, to Abraham, and to his seed for ever."}, {"s": 356533, "e": 360267, "t": "And Mary abode with her about three months, and returned to her own house."}, {"s": 360267, "e": 366000, "t": "Now Elisabeth's full time came that she should be delivered; and she brought forth a son."}, {"s": 366000, "e": 372400, "t": "And her neighbours and her cousins heard how the Lord had shewed great mercy upon her; and they rejoiced with her."}, {"s": 372400, "e": 380667, "t": "And it came to pass, that on the eighth day they came to circumcise the child; and they called him Zacharias, after the name of his father."}, {"s": 380667, "e": 385733, "t": "And his mother answered and said, Not so; but he shall be called John."}, {"s": 385733, "e": 390800, "t": "And they said unto her, There is none of thy kindred that is called by this name."}, {"s": 390800, "e": 394800, "t": "And they made signs to his father, how he would have him called."}, {"s": 394800, "e": 398400, "t": "And he asked for a writing table, and wrote, saying, His name is John."}, {"s": 398400, "e": 400267, "t": "And they marvelled all."}, {"s": 400267, "e": 404533, "t": "And his mouth was opened immediately, and his tongue loosed, and he spake, and praised God."}, {"s": 404533, "e": 412800, "t": "And fear came on all that dwelt round about them: and all these sayings were noised abroad throughout all the hill country of Judaea."}, {"s": 412800, "e": 418267, "t": "And all they that heard them laid them up in their hearts, saying, What manner of child shall this be!"}, {"s": 418267, "e": 420400, "t": "And the hand of the Lord was with him."}, {"s": 420400, "e": 437467, "t": "And his father Zacharias was filled with the Holy Ghost, and prophesied, saying, Blessed be the Lord God of Israel; for he hath visited and redeemed his people, And hath raised up an horn of salvation for us in the house of his servant David; As he spake by the mouth of his holy prophets,"}, {"s": 437467, "e": 454400, "t": "which have been since the world began: That we should be saved from our enemies, and from the hand of all that hate us; To perform the mercy promised to our fathers, and to remember his holy covenant; The oath which he sware to our father Abraham, That he would grant unto us,"}, {"s": 454400, "e": 463600, "t": "that we being delivered out of the hand of our enemies might serve him without fear, In holiness and righteousness before him, all the days of our life."}, {"s": 463600, "e": 481467, "t": "And thou, child, shalt be called the prophet of the Highest: for thou shalt go before the face of the Lord to prepare his ways; To give knowledge of salvation unto his people by the remission of their sins, Through the tender mercy of our God; whereby the dayspring from on high hath visited us,"}, {"s": 481467, "e": 487867, "t": "To give light to them that sit in darkness and in the shadow of death, to guide our feet into the way of peace."}, {"s": 487867, "e": 495067, "t": "And the child grew, and waxed strong in spirit, and was in the deserts till the day of his shewing unto Israel."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;

</script></body></html>
