<script>
const S=[{"s": 0, "e": 1867, "t": "John, Chapter Twelve."}, {"s": 1867, "e": 9867, "t": "Then Jesus six days before the passover came to Bethany, where Lazarus was which had been dead, whom he raised from the dead."}, {"s": 9867, "e": 16800, "t": "There they made him a supper; and Martha served: but Lazarus was one of them that sat at the table with him."}, {"s": 16800, "e": 26933, "t": "Then took Mary a pound of ointment of spikenard, very costly, and anointed the feet of Jesus, and wiped his feet with her hair: and the house was filled with the odour of the ointment."}, {"s": 26933, "e": 36800, "t": "Then saith one of his disciples, Judas Iscariot, Simon's son, which should betray him, Why was not this ointment sold for three hundred pence, and given to the poor?"}, {"s": 36800, "e": 44400, "t": "This he said, not that he cared for the poor; but because he was a thief, and had the bag, and bare what was put therein."}, {"s": 44400, "e": 50400, "t": "Then said Jesus, Let her alone: against the day of my burying hath she kept this."}, {"s": 50400, "e": 55467, "t": "For the poor always ye have with you; but me ye have not always."}, {"s": 55467, "e": 65200, "t": "Much people of the Jews therefore knew that he was there: and they came not for Jesus' sake only, but that they might see Lazarus also, whom he had raised from the dead."}, {"s": 65200, "e": 74400, "t": "But the chief priests consulted that they might put Lazarus also to death; Because that by reason of him many of the Jews went away, and believed on Jesus."}, {"s": 74400, "e": 88400, "t": "On the next day much people that were come to the feast, when they heard that Jesus was coming to Jerusalem, Took branches of palm trees, and went forth to meet him, and cried, Hosanna: Blessed is the King of Israel that cometh in the name of the Lord."}, {"s": 88400, "e": 97867, "t": "And Jesus, when he had found a young ass, sat thereon; as it is written, Fear not, daughter of Sion: behold, thy King cometh, sitting on an ass's colt."}, {"s": 97867, "e": 108400, "t": "These things understood not his disciples at the first: but when Jesus was glorified, then remembered they that these things were written of him, and that they had done these things unto him."}, {"s": 108400, "e": 114667, "t": "The people therefore that was with him when he called Lazarus out of his grave, and raised him from the dead, bare record."}, {"s": 114667, "e": 120133, "t": "For this cause the people also met him, for that they heard that he had done this miracle."}, {"s": 120133, "e": 126133, "t": "The Pharisees therefore said among themselves, Perceive ye how ye prevail nothing?"}, {"s": 126133, "e": 129067, "t": "behold, the world is gone after him."}, {"s": 129067, "e": 140400, "t": "And there were certain Greeks among them that came up to worship at the feast: The same came therefore to Philip, which was of Bethsaida of Galilee, and desired him, saying, Sir, we would see Jesus."}, {"s": 140400, "e": 144667, "t": "Philip cometh and telleth Andrew: and again Andrew and Philip tell Jesus."}, {"s": 144667, "e": 151200, "t": "And Jesus answered them, saying, The hour is come, that the Son of man should be glorified."}, {"s": 151200, "e": 160533, "t": "Verily, verily, I say unto you, Except a corn of wheat fall into the ground and die, it abideth alone: but if it die, it bringeth forth much fruit."}, {"s": 160533, "e": 166667, "t": "He that loveth his life shall lose it; and he that hateth his life in this world shall keep it unto life eternal."}, {"s": 166667, "e": 176267, "t": "If any man serve me, let him follow me; and where I am, there shall also my servant be: if any man serve me, him will my Father honour."}, {"s": 176267, "e": 179200, "t": "Now is my soul troubled; and what shall I say?"}, {"s": 179200, "e": 184400, "t": "Father, save me from this hour: but for this cause came I unto this hour."}, {"s": 184400, "e": 186267, "t": "Father, glorify thy name."}, {"s": 186267, "e": 192133, "t": "Then came there a voice from heaven, saying, I have both glorified it, and will glorify it again."}, {"s": 192133, "e": 198800, "t": "The people therefore, that stood by, and heard it, said that it thundered: others said, An angel spake to him."}, {"s": 198800, "e": 204800, "t": "Jesus answered and said, This voice came not because of me, but for your sakes."}, {"s": 204800, "e": 212000, "t": "Now is the judgment of this world: now shall the prince of this world be cast out."}, {"s": 212000, "e": 216533, "t": "And I, if I be lifted up from the earth, will draw all men unto me."}, {"s": 216533, "e": 220133, "t": "This he said, signifying what death he should die."}, {"s": 220133, "e": 228800, "t": "The people answered him, We have heard out of the law that Christ abideth for ever: and how sayest thou, The Son of man must be lifted up?"}, {"s": 228800, "e": 231200, "t": "who is this Son of man?"}, {"s": 231200, "e": 235867, "t": "Then Jesus said unto them, Yet a little while is the light with you."}, {"s": 235867, "e": 242933, "t": "Walk while ye have the light, lest darkness come upon you: for he that walketh in darkness knoweth not whither he goeth."}, {"s": 242933, "e": 248133, "t": "While ye have light, believe in the light, that ye may be the children of light."}, {"s": 248133, "e": 252800, "t": "These things spake Jesus, and departed, and did hide himself from them."}, {"s": 252800, "e": 264667, "t": "But though he had done so many miracles before them, yet they believed not on him: That the saying of Esaias the prophet might be fulfilled, which he spake, Lord, who hath believed our report?"}, {"s": 264667, "e": 267333, "t": "and to whom hath the arm of the Lord been revealed?"}, {"s": 267333, "e": 280667, "t": "Therefore they could not believe, because that Esaias said again, He hath blinded their eyes, and hardened their heart; that they should not see with their eyes, nor understand with their heart, and be converted, and I should heal them."}, {"s": 280667, "e": 284933, "t": "These things said Esaias, when he saw his glory, and spake of him."}, {"s": 284933, "e": 297200, "t": "Nevertheless among the chief rulers also many believed on him; but because of the Pharisees they did not confess him, lest they should be put out of the synagogue: For they loved the praise of men more than the praise of God."}, {"s": 297200, "e": 302267, "t": "Jesus cried and said, He that believeth on me, believeth not on me, but on him that sent me."}, {"s": 302267, "e": 304933, "t": "And he that seeth me seeth him that sent me."}, {"s": 304933, "e": 310933, "t": "I am come a light into the world, that whosoever believeth on me should not abide in darkness."}, {"s": 310933, "e": 318533, "t": "And if any man hear my words, and believe not, I judge him not: for I came not to judge the world, but to save the world."}, {"s": 318533, "e": 327867, "t": "He that rejecteth me, and receiveth not my words, hath one that judgeth him: the word that I have spoken, the same shall judge him in the last day."}, {"s": 327867, "e": 335733, "t": "For I have not spoken of myself; but the Father which sent me, he gave me a commandment, what I should say, and what I should speak."}, {"s": 335733, "e": 343067, "t": "And I know that his commandment is life everlasting: whatsoever I speak therefore, even as the Father said unto me, so I speak."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
