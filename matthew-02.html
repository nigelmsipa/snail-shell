<script>
const S=[{"s": 0, "e": 2133, "t": "Matthew, Chapter Two."}, {"s": 2133, "e": 13600, "t": "Now when Jesus was born in Bethlehem of Judaea in the days of Herod the king, behold, there came wise men from the east to Jerusalem, Saying, Where is he that is born King of the Jews?"}, {"s": 13600, "e": 17733, "t": "for we have seen his star in the east, and are come to worship him."}, {"s": 17733, "e": 22267, "t": "When Herod the king had heard these things, he was troubled, and all Jerusalem with him."}, {"s": 22267, "e": 28667, "t": "And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born."}, {"s": 28667, "e": 44000, "t": "And they said unto him, In Bethlehem of Judaea: for thus it is written by the prophet, And thou Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel."}, {"s": 44000, "e": 50267, "t": "Then Herod, when he had privily called the wise men, inquired of them diligently what time the star appeared."}, {"s": 50267, "e": 60533, "t": "And he sent them to Bethlehem, and said, Go and search diligently for the young child; and when ye have found him, bring me word again, that I may come and worship him also."}, {"s": 60533, "e": 69867, "t": "When they had heard the king, they departed; and, lo, the star, which they saw in the east, went before them, till it came and stood over where the young child was."}, {"s": 69867, "e": 73733, "t": "When they saw the star, they rejoiced with exceeding great joy."}, {"s": 73733, "e": 86667, "t": "And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh."}, {"s": 86667, "e": 93600, "t": "And being warned of God in a dream that they should not return to Herod, they departed into their own country another way."}, {"s": 93600, "e": 108267, "t": "And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him."}, {"s": 108267, "e": 121600, "t": "When he arose, he took the young child and his mother by night, and departed into Egypt: And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son."}, {"s": 121600, "e": 136000, "t": "Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently inquired of the wise men."}, {"s": 136000, "e": 150667, "t": "Then was fulfilled that which was spoken by Jeremy the prophet, saying, In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping for her children, and would not be comforted, because they are not."}, {"s": 150667, "e": 165200, "t": "But when Herod was dead, behold, an angel of the Lord appeareth in a dream to Joseph in Egypt, Saying, Arise, and take the young child and his mother, and go into the land of Israel: for they are dead which sought the young child's life."}, {"s": 165200, "e": 170133, "t": "And he arose, and took the young child and his mother, and came into the land of Israel."}, {"s": 170133, "e": 185600, "t": "But when he heard that Archelaus did reign in Judaea in the room of his father Herod, he was afraid to go thither: notwithstanding, being warned of God in a dream, he turned aside into the parts of Galilee: And he came and dwelt in a city called Nazareth:"}, {"s": 185600, "e": 191067, "t": "that it might be fulfilled which was spoken by the prophets, He shall be called a Nazarene."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
