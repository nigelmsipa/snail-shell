<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>hebrews-12</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
   line-height:1.7;font-size:1.15rem}
 header{position:sticky;top:0;background:var(--bg);padding:.6rem 1rem;
   border-bottom:1px solid #ddd5c7;box-shadow:0 2px 8px rgba(0,0,0,.05)}
 audio{width:100%}
 main{max-width:42rem;margin:0 auto;padding:1.2rem 1.1rem 40vh}
 h1{font-size:1.1rem;color:var(--dim);font-weight:600;margin:.2rem 0 1rem}
 .s{cursor:pointer;border-radius:.25rem;padding:.02em 0;transition:background .12s}
 .s:hover{background:#eadfc8}
 .s.active{background:var(--hi);box-shadow:0 0 0 .15em var(--hi)}
 .spd{margin-top:.45rem;font-size:.85rem;color:var(--dim)}
 .spd button{font:inherit;margin:0 .12rem;padding:.18rem .55rem;border:1px solid #ccc3b2;
   background:#fbf7ee;color:var(--fg);border-radius:.4rem;cursor:pointer}
 .spd button.on{background:var(--hi);border-color:#e0c050}
</style></head><body>
<header><audio id="a" src="hebrews-12.opus" controls preload="metadata"></audio>
<div class="spd">Speed:
 <button data-r="1" class="on">1&times;</button><button data-r="1.25">1.25&times;</button>
 <button data-r="1.5">1.5&times;</button><button data-r="2">2&times;</button></div></header>
<main><h1>hebrews-12</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1733, "t": "Hebrews, Chapter Twelve."}, {"s": 1733, "e": 18933, "t": "Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us, Looking unto Jesus the author and finisher of our faith;"}, {"s": 18933, "e": 26400, "t": "who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God."}, {"s": 26400, "e": 33733, "t": "For consider him that endured such contradiction of sinners against himself, lest ye be wearied and faint in your minds."}, {"s": 33733, "e": 37600, "t": "Ye have not yet resisted unto blood, striving against sin."}, {"s": 37600, "e": 53867, "t": "And ye have forgotten the exhortation which speaketh unto you as unto children, My son, despise not thou the chastening of the Lord, nor faint when thou art rebuked of him: For whom the Lord loveth he chasteneth, and scourgeth every son whom he receiveth."}, {"s": 53867, "e": 61600, "t": "If ye endure chastening, God dealeth with you as with sons; for what son is he whom the father chasteneth not?"}, {"s": 61600, "e": 69067, "t": "But if ye be without chastisement, whereof all are partakers, then are ye bastards, and not sons."}, {"s": 69067, "e": 78667, "t": "Furthermore we have had fathers of our flesh which corrected us, and we gave them reverence: shall we not much rather be in subjection unto the Father of spirits, and live?"}, {"s": 78667, "e": 86800, "t": "For they verily for a few days chastened us after their own pleasure; but he for our profit, that we might be partakers of his holiness."}, {"s": 86800, "e": 96267, "t": "Now no chastening for the present seemeth to be joyous, but grievous: nevertheless afterward it yieldeth the peaceable fruit of righteousness unto them which are exercised thereby."}, {"s": 96267, "e": 106667, "t": "Wherefore lift up the hands which hang down, and the feeble knees; And make straight paths for your feet, lest that which is lame be turned out of the way; but let it rather be healed."}, {"s": 106667, "e": 124400, "t": "Follow peace with all men, and holiness, without which no man shall see the Lord: Looking diligently lest any man fail of the grace of God; lest any root of bitterness springing up trouble you, and thereby many be defiled; Lest there be any fornicator, or profane person, as Esau,"}, {"s": 124400, "e": 127733, "t": "who for one morsel of meat sold his birthright."}, {"s": 127733, "e": 137733, "t": "For ye know how that afterward, when he would have inherited the blessing, he was rejected: for he found no place of repentance, though he sought it carefully with tears."}, {"s": 137733, "e": 153200, "t": "For ye are not come unto the mount that might be touched, and that burned with fire, nor unto blackness, and darkness, and tempest, And the sound of a trumpet, and the voice of words; which voice they that heard intreated that the word should not be spoken to them any more:"}, {"s": 153200, "e": 172667, "t": "(For they could not endure that which was commanded, And if so much as a beast touch the mountain, it shall be stoned, or thrust through with a dart: And so terrible was the sight, that Moses said, I exceedingly fear and quake:) But ye are come unto mount Sion, and unto the city of the living God,"}, {"s": 172667, "e": 189600, "t": "the heavenly Jerusalem, and to an innumerable company of angels, To the general assembly and church of the firstborn, which are written in heaven, and to God the Judge of all, and to the spirits of just men made perfect, And to Jesus the mediator of the new covenant, and to the blood of sprinkling,"}, {"s": 189600, "e": 192533, "t": "that speaketh better things than that of Abel."}, {"s": 192533, "e": 195467, "t": "See that ye refuse not him that speaketh."}, {"s": 195467, "e": 213600, "t": "For if they escaped not who refused him that spake on earth, much more shall not we escape, if we turn away from him that speaketh from heaven: Whose voice then shook the earth: but now he hath promised, saying, Yet once more I shake not the earth only, but also heaven."}, {"s": 213600, "e": 224533, "t": "And this word, Yet once more, signifieth the removing of those things that are shaken, as of things that are made, that those things which cannot be shaken may remain."}, {"s": 224533, "e": 235200, "t": "Wherefore we receiving a kingdom which cannot be moved, let us have grace, whereby we may serve God acceptably with reverence and godly fear: For our God is a consuming fire."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
