th, he went in, and took her by the hand, and the maid arose."}, {"s": 193733, "e": 197067, "t": "And the fame hereof went abroad into all that land."}, {"s": 197067, "e": 203867, "t": "And when Jesus departed thence, two blind men followed him, crying, and saying, Thou Son of David, have mercy on us."}, {"s": 203867, "e": 211200, "t": "And when he was come into the house, the blind men came to him: and Jesus saith unto them, Believe ye that I am able to do this?"}, {"s": 211200, "e": 213733, "t": "They said unto him, Yea, Lord."}, {"s": 213733, "e": 217733, "t": "Then touched he their eyes, saying, According to your faith be it unto you."}, {"s": 217733, "e": 223867, "t": "And their eyes were opened; and Jesus straitly charged them, saying, See that no man know it."}, {"s": 223867, "e": 228667, "t": "But they, when they were departed, spread abroad his fame in all that country."}, {"s": 228667, "e": 232933, "t": "As they went out, behold, they brought to him a dumb man possessed with a devil."}, {"s": 232933, "e": 239600, "t": "And when the devil was cast out, the dumb spake: and the multitudes marvelled, saying, It was never so seen in Israel."}, {"s": 239600, "e": 244133, "t": "But the Pharisees said, He casteth out devils through the prince of the devils."}, {"s": 244133, "e": 252800, "t": "And Jesus went about all the cities and villages, teaching in their synagogues, and preaching the gospel of the kingdom, and healing every sickness and every disease among the people."}, {"s": 252800, "e": 260933, "t": "But when he saw the multitudes, he was moved with compassion on them, because they fainted, and were scattered abroad, as sheep having no shepherd."}, {"s": 260933, "e": 272667, "t": "Then saith he unto his disciples, The harvest truly is plenteous, but the labourers are few; Pray ye therefore the Lord of the harvest, that he will send forth labourers into his harvest."}],a=document.getElementById('a'),t=document.getElementById('t');
