<script>
const S=[{"s": 0, "e": 2000, "t": "Luke, Chapter Thirteen."}, {"s": 2000, "e": 9200, "t": "There were present at that season some that told him of the Galilaeans, whose blood Pilate had mingled with their sacrifices."}, {"s": 9200, "e": 16533, "t": "And Jesus answering said unto them, Suppose ye that these Galilaeans were sinners above all the Galilaeans, because they suffered such things?"}, {"s": 16533, "e": 21067, "t": "I tell you, Nay: but, except ye repent, ye shall all likewise perish."}, {"s": 21067, "e": 30133, "t": "Or those eighteen, upon whom the tower in Siloam fell, and slew them, think ye that they were sinners above all men that dwelt in Jerusalem?"}, {"s": 30133, "e": 35467, "t": "I tell you, Nay: but, except ye repent, ye shall all likewise perish."}, {"s": 35467, "e": 43600, "t": "He spake also this parable; A certain man had a fig tree planted in his vineyard; and he came and sought fruit thereon, and found none."}, {"s": 43600, "e": 55067, "t": "Then said he unto the dresser of his vineyard, Behold, these three years I come seeking fruit on this fig tree, and find none: cut it down; why cumbereth it the ground?"}, {"s": 55067, "e": 67067, "t": "And he answering said unto him, Lord, let it alone this year also, till I shall dig about it, and dung it: And if it bear fruit, well: and if not, then after that thou shalt cut it down."}, {"s": 67067, "e": 70533, "t": "And he was teaching in one of the synagogues on the sabbath."}, {"s": 70533, "e": 78533, "t": "And, behold, there was a woman which had a spirit of infirmity eighteen years, and was bowed together, and could in no wise lift up herself."}, {"s": 78533, "e": 86133, "t": "And when Jesus saw her, he called her to him, and said unto her, Woman, thou art loosed from thine infirmity."}, {"s": 86133, "e": 92133, "t": "And he laid his hands on her: and immediately she was made straight, and glorified God."}, {"s": 92133, "e": 106400, "t": "And the ruler of the synagogue answered with indignation, because that Jesus had healed on the sabbath day, and said unto the people, There are six days in which men ought to work: in them therefore come and be healed, and not on the sabbath day."}, {"s": 106400, "e": 116533, "t": "The Lord then answered him, and said, Thou hypocrite, doth not each one of you on the sabbath loose his ox or his ass from the stall, and lead him away to watering?"}, {"s": 116533, "e": 126000, "t": "And ought not this woman, being a daughter of Abraham, whom Satan hath bound, lo, these eighteen years, be loosed from this bond on the sabbath day?"}, {"s": 126000, "e": 134000, "t": "And when he had said these things, all his adversaries were ashamed: and all the people rejoiced for all the glorious things that were done by him."}, {"s": 134000, "e": 137600, "t": "Then said he, Unto what is the kingdom of God like?"}, {"s": 137600, "e": 139867, "t": "and whereunto shall I resemble it?"}, {"s": 139867, "e": 150000, "t": "It is like a grain of mustard seed, which a man took, and cast into his garden; and it grew, and waxed a great tree; and the fowls of the air lodged in the branches of it."}, {"s": 150000, "e": 153600, "t": "And again he said, Whereunto shall I liken the kingdom of God?"}, {"s": 153600, "e": 159733, "t": "It is like leaven, which a woman took and hid in three measures of meal, till the whole was leavened."}, {"s": 159733, "e": 164533, "t": "And he went through the cities and villages, teaching, and journeying toward Jerusalem."}, {"s": 164533, "e": 168267, "t": "Then said one unto him, Lord, are there few that be saved?"}, {"s": 168267, "e": 176267, "t": "And he said unto them, Strive to enter in at the strait gate: for many, I say unto you, will seek to enter in, and shall not be able."}, {"s": 176267, "e": 192667, "t": "When once the master of the house is risen up, and hath shut to the door, and ye begin to stand without, and to knock at the door, saying, Lord, Lord, open unto us; and he shall answer and say unto you, I know you not whence ye are: Then shall ye begin to say,"}, {"s": 192667, "e": 196400, "t": "We have eaten and drunk in thy presence, and thou hast taught in our streets."}, {"s": 196400, "e": 203467, "t": "But he shall say, I tell you, I know you not whence ye are; depart from me, all ye workers of iniquity."}, {"s": 203467, "e": 212133, "t": "There shall be weeping and gnashing of teeth, when ye shall see Abraham, and Isaac, and Jacob, and all the prophets, in the kingdom of God, and you yourselves thrust out."}, {"s": 212133, "e": 219067, "t": "And they shall come from the east, and from the west, and from the north, and from the south, and shall sit down in the kingdom of God."}, {"s": 219067, "e": 224400, "t": "And, behold, there are last which shall be first, and there are first which shall be last."}, {"s": 224400, "e": 231467, "t": "The same day there came certain of the Pharisees, saying unto him, Get thee out, and depart hence: for Herod will kill thee."}, {"s": 231467, "e": 241067, "t": "And he said unto them, Go ye, and tell that fox, Behold, I cast out devils, and I do cures to day and to morrow, and the third day I shall be perfected."}, {"s": 241067, "e": 249467, "t": "Nevertheless I must walk to day, and to morrow, and the day following: for it cannot be that a prophet perish out of Jerusalem."}, {"s": 249467, "e": 261733, "t": "O Jerusalem, Jerusalem, which killest the prophets, and stonest them that are sent unto thee; how often would I have gathered thy children together, as a hen doth gather her brood under her wings, and ye would not!"}, {"s": 261733, "e": 272400, "t": "Behold, your house is left unto you desolate: and verily I say unto you, Ye shall not see me, until the time come when ye shall say, Blessed is he that cometh in the name of the Lord."}],a=document.getElementById('a'),t=document.getElementById('t');
