<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>john-20</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;

<header><audio id="a" src="john-20.opus" controls preload="metadata"></audio>
<div class="spd">Speed:

<main><h1>john-20</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 2400, "t": "John, Chapter Twenty."}, {"s": 2400, "e": 10800, "t": "The first day of the week cometh Mary Magdalene early, when it was yet dark, unto the sepulchre, and seeth the stone taken away from the sepulchre."}, {"s": 10800, "e": 22400, "t": "Then she runneth, and cometh to Simon Peter, and to the other disciple, whom Jesus loved, and saith unto them, They have taken away the Lord out of the sepulchre, and we know not where they have laid him."}, {"s": 22400, "e": 26800, "t": "Peter therefore went forth, and that other disciple, and came to the sepulchre."}, {"s": 26800, "e": 32933, "t": "So they ran both together: and the other disciple did outrun Peter, and came first to the sepulchre."}, {"s": 32933, "e": 38800, "t": "And he stooping down, and looking in, saw the linen clothes lying; yet went he not in."}, {"s": 38800, "e": 52267, "t": "Then cometh Simon Peter following him, and went into the sepulchre, and seeth the linen clothes lie, And the napkin, that was about his head, not lying with the linen clothes, but wrapped together in a place by itself."}, {"s": 52267, "e": 59067, "t": "Then went in also that other disciple, which came first to the sepulchre, and he saw, and believed."}, {"s": 59067, "e": 63333, "t": "For as yet they knew not the scripture, that he must rise again from the dead."}, {"s": 63333, "e": 67333, "t": "Then the disciples went away again unto their own home."}, {"s": 67333, "e": 82000, "t": "But Mary stood without at the sepulchre weeping: and as she wept, she stooped down, and looked into the sepulchre, And seeth two angels in white sitting, the one at the head, and the other at the feet, where the body of Jesus had lain."}, {"s": 82000, "e": 85600, "t": "And they say unto her, Woman, why weepest thou?"}, {"s": 85600, "e": 91200, "t": "She saith unto them, Because they have taken away my Lord, and I know not where they have laid him."}, {"s": 91200, "e": 98000, "t": "And when she had thus said, she turned herself back, and saw Jesus standing, and knew not that it was Jesus."}, {"s": 98000, "e": 101867, "t": "Jesus saith unto her, Woman, why weepest thou?"}, {"s": 101867, "e": 103067, "t": "whom seekest thou?"}, {"s": 103067, "e": 112400, "t": "She, supposing him to be the gardener, saith unto him, Sir, if thou have borne him hence, tell me where thou hast laid him, and I will take him away."}, {"s": 112400, "e": 114533, "t": "Jesus saith unto her, Mary."}, {"s": 114533, "e": 119067, "t": "She turned herself, and saith unto him, Rabboni; which is to say, Master."}, {"s": 119067, "e": 130533, "t": "Jesus saith unto her, Touch me not; for I am not yet ascended to my Father: but go to my brethren, and say unto them, I ascend unto my Father, and your Father; and to my God, and your God."}, {"s": 130533, "e": 136800, "t": "Mary Magdalene came and told the disciples that she had seen the Lord, and that he had spoken these things unto her."}, {"s": 136800, "e": 148933, "t": "Then the same day at evening, being the first day of the week, when the doors were shut where the disciples were assembled for fear of the Jews, came Jesus and stood in the midst, and saith unto them, Peace be unto you."}, {"s": 148933, "e": 153200, "t": "And when he had so said, he shewed unto them his hands and his side."}, {"s": 153200, "e": 156000, "t": "Then were the disciples glad, when they saw the Lord."}, {"s": 156000, "e": 162667, "t": "Then said Jesus to them again, Peace be unto you: as my Father hath sent me, even so send I you."}, {"s": 162667, "e": 177200, "t": "And when he had said this, he breathed on them, and saith unto them, Receive ye the Holy Ghost: Whose soever sins ye remit, they are remitted unto them; and whose soever sins ye retain, they are retained."}, {"s": 177200, "e": 181600, "t": "But Thomas, one of the twelve, called Didymus, was not with them when Jesus came."}, {"s": 181600, "e": 186533, "t": "The other disciples therefore said unto him, We have seen the Lord."}, {"s": 186533, "e": 197733, "t": "But he said unto them, Except I shall see in his hands the print of the nails, and put my finger into the print of the nails, and thrust my hand into his side, I will not believe."}, {"s": 197733, "e": 207733, "t": "And after eight days again his disciples were within, and Thomas with them: then came Jesus, the doors being shut, and stood in the midst, and said, Peace be unto you."}, {"s": 207733, "e": 219600, "t": "Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust it into my side: and be not faithless, but believing."}, {"s": 219600, "e": 224000, "t": "And Thomas answered and said unto him, My Lord and my God."}, {"s": 224000, "e": 231600, "t": "Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed."}, {"s": 231600, "e": 245600, "t": "And many other signs truly did Jesus in the presence of his disciples, which are not written in this book: But these are written, that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
