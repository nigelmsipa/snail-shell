<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>john-17</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
   line-height:1.7;font-size:1.15rem}
 header{position:sticky;top:0;background:var(--bg);padding:.6rem 1rem;
   border-bottom:1px solid #ddd5c7;box-shadow:0 2px 8px rgba(0,0,0,.05)}
 audio{width:100%}
 main{max-width:42rem;margin:0 auto;padding:1.2rem 1.1rem 40vh}
 h1{font-size:1.1rem;color:var(--dim);font-weight:600;margin:.2rem 0 1rem}
 .s{cursor:pointer;border-radius:.25rem;padding:.02em 0;transition:background .12s}
 .s:hover{background:#eadfc8}
 .s.active{background:var(--hi);box-shadow:0 0 0 .15em var(--hi)}
 .spd{margin-top:.45rem;font-size:.85rem;color:var(--dim)}
 .spd button{font:inherit;margin:0 .12rem;padding:.18rem .55rem;border:1px solid #ccc3b2;
   background:#fbf7ee;color:var(--fg);border-radius:.4rem;cursor:pointer}
 .spd button.on{background:var(--hi);border-color:#e0c050}
</style></head><body>
<header><audio id="a" src="john-17.opus" controls preload="metadata"></audio>
<div class="spd">Speed:
 <button data-r="1" class="on">1&times;</button><button data-r="1.25">1.25&times;</button>
 <button data-r="1.5">1.5&times;</button><button data-r="2">2&times;</button></div></header>
<main><h1>john-17</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 2000, "t": "John, Chapter Seventeen."}, {"s": 2000, "e": 18133, "t": "These words spake Jesus, and lifted up his eyes to heaven, and said, Father, the hour is come; glorify thy Son, that thy Son also may glorify thee: As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him."}, {"s": 18133, "e": 25867, "t": "And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent."}, {"s": 25867, "e": 31467, "t": "I have glorified thee on the earth: I have finished the work which thou gavest me to do."}, {"s": 31467, "e": 38933, "t": "And now, O Father, glorify thou me with thine own self with the glory which I had with thee before the world was."}, {"s": 38933, "e": 48133, "t": "I have manifested thy name unto the men which thou gavest me out of the world: thine they were, and thou gavest them me; and they have kept thy word."}, {"s": 48133, "e": 52267, "t": "Now they have known that all things whatsoever thou hast given me are of thee."}, {"s": 52267, "e": 61467, "t": "For I have given unto them the words which thou gavest me; and they have received them, and have known surely that I came out from thee, and they have believed that thou didst send me."}, {"s": 61467, "e": 67867, "t": "I pray for them: I pray not for the world, but for them which thou hast given me; for they are thine."}, {"s": 67867, "e": 72533, "t": "And all mine are thine, and thine are mine; and I am glorified in them."}, {"s": 72533, "e": 78267, "t": "And now I am no more in the world, but these are in the world, and I come to thee."}, {"s": 78267, "e": 84800, "t": "Holy Father, keep through thine own name those whom thou hast given me, that they may be one, as we are."}, {"s": 84800, "e": 96267, "t": "While I was with them in the world, I kept them in thy name: those that thou gavest me I have kept, and none of them is lost, but the son of perdition; that the scripture might be fulfilled."}, {"s": 96267, "e": 103733, "t": "And now come I to thee; and these things I speak in the world, that they might have my joy fulfilled in themselves."}, {"s": 103733, "e": 110933, "t": "I have given them thy word; and the world hath hated them, because they are not of the world, even as I am not of the world."}, {"s": 110933, "e": 116267, "t": "I pray not that thou shouldest take them out of the world, but that thou shouldest keep them from the evil."}, {"s": 116267, "e": 119467, "t": "They are not of the world, even as I am not of the world."}, {"s": 119467, "e": 122800, "t": "Sanctify them through thy truth: thy word is truth."}, {"s": 122800, "e": 128000, "t": "As thou hast sent me into the world, even so have I also sent them into the world."}, {"s": 128000, "e": 133867, "t": "And for their sakes I sanctify myself, that they also might be sanctified through the truth."}, {"s": 133867, "e": 150400, "t": "Neither pray I for these alone, but for them also which shall believe on me through their word; That they all may be one; as thou, Father, art in me, and I in thee, that they also may be one in us: that the world may believe that thou hast sent me."}, {"s": 150400, "e": 167867, "t": "And the glory which thou gavest me I have given them; that they may be one, even as we are one: I in them, and thou in me, that they may be made perfect in one; and that the world may know that thou hast sent me, and hast loved them, as thou hast loved me."}, {"s": 167867, "e": 178667, "t": "Father, I will that they also, whom thou hast given me, be with me where I am; that they may behold my glory, which thou hast given me: for thou lovedst me before the foundation of the world."}, {"s": 178667, "e": 185867, "t": "O righteous Father, the world hath not known thee: but I have known thee, and these have known that thou hast sent me."}, {"s": 185867, "e": 194000, "t": "And I have declared unto them thy name, and will declare it: that the love wherewith thou hast loved me may be in them, and I in them."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
