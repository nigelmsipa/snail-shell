const S=[{"s": 0, "e": 2533, "t": "Luke, Chapter Two."}, {"s": 2533, "e": 9600, "t": "And it came to pass in those days, that there went out a decree from Caesar Augustus, that all the world should be taxed."}, {"s": 9600, "e": 18000, "t": "(And this taxing was first made when Cyrenius was governor of Syria.) And all went to be taxed, every one into his own city."}, {"s": 18000, "e": 33600, "t": "And Joseph also went up from Galilee, out of the city of Nazareth, into Judaea, unto the city of David, which is called Bethlehem; (because he was of the house and lineage of David:) To be taxed with Mary his espoused wife, being great with child."}, {"s": 33600, "e": 39067, "t": "And so it was, that, while they were there, the days were accomplished that she should be delivered."}, {"s": 39067, "e": 47467, "t": "And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn."}, {"s": 47467, "e": 53600, "t": "And there were in the same country shepherds abiding in the field, keeping watch over their flock by night."}, {"s": 53600, "e": 60800, "t": "And, lo, the angel of the Lord came upon them, and the glory of the Lord shone round about them: and they were sore afraid."}, {"s": 60800, "e": 67333, "t": "And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people."}, {"s": 67333, "e": 72533, "t": "For unto you is born this day in the city of David a Saviour, which is Christ the Lord."}, {"s": 72533, "e": 79333, "t": "And this shall be a sign unto you; Ye shall find the babe wrapped in swaddling clothes, lying in a manger."}, {"s": 79333, "e": 89200, "t": "And suddenly there was with the angel a multitude of the heavenly host praising God, and saying, Glory to God in the highest, and on earth peace, good will toward men."}, {"s": 89200, "e": 102000, "t": "And it came to pass, as the angels were gone away from them into heaven, the shepherds said one to another, Let us now go even unto Bethlehem, and see this thing which is come to pass, which the Lord hath made known unto us."}, {"s": 102000, "e": 107467, "t": "And they came with haste, and found Mary, and Joseph, and the babe lying in a manger."}, {"s": 107467, "e": 112933, "t": "And when they had seen it, they made known abroad the saying which was told them concerning this child."}, {"s": 112933, "e": 118000, "t": "And all they that heard it wondered at those things which were told them by the shepherds."}, {"s": 118000, "e": 121467, "t": "But Mary kept all these things, and pondered them in her heart."}, {"s": 121467, "e": 128400, "t": "And the shepherds returned, glorifying and praising God for all the things that they had heard and seen, as it was told unto them."}, {"s": 128400, "e": 136933, "t": "And when eight days were accomplished for the circumcising of the child, his name was called JESUS, which was so named of the angel before he was conceived in the womb."}, {"s": 136933, "e": 147333, "t": "And when the days of her purification according to the law of Moses were accomplished, they brought him to Jerusalem, to present him to the Lord; (As it is written in the law of the Lord,"}, {"s": 147333, "e": 158400, "t": "Every male that openeth the womb shall be called holy to the Lord;) And to offer a sacrifice according to that which is said in the law of the Lord, A pair of turtledoves, or two young pigeons."}, {"s": 158400, "e": 168267, "t": "And, behold, there was a man in Jerusalem, whose name was Simeon; and the same man was just and devout, waiting for the consolation of Israel: and the Holy Ghost was upon him."}, {"s": 168267, "e": 175333, "t": "And it was revealed unto him by the Holy Ghost, that he should not see death, before he had seen the Lord's Christ."}, {"s": 175333, "e": 190133, "t": "And he came by the Spirit into the temple: and when the parents brought in the child Jesus, to do for him after the custom of the law, Then took he him up in his arms, and blessed God, and said, Lord, now lettest thou thy servant depart in peace, according to thy word:"}, {"s": 190133, "e": 200933, "t": "For mine eyes have seen thy salvation, Which thou hast prepared before the face of all people; A light to lighten the Gentiles, and the glory of thy people Israel."}, {"s": 200933, "e": 204933, "t": "And Joseph and his mother marvelled at those things which were spoken of him."}, {"s": 204933, "e": 222667, "t": "And Simeon blessed them, and said unto Mary his mother, Behold, this child is set for the fall and rising again of many in Israel; and for a sign which shall be spoken against; (Yea, a sword shall pierce through thy own soul also,) that the thoughts of many hearts may be revealed."}, {"s": 222667, "e": 237067, "t": "And there was one Anna, a prophetess, the daughter of Phanuel, of the tribe of Aser: she was of a great age, and had lived with an husband seven years from her virginity; And she was a widow of about fourscore and four years, which departed not from the temple,"}, {"s": 237067, "e": 240933, "t": "but served God with fastings and prayers night and day."}, {"s": 240933, "e": 248533, "t": "And she coming in that instant gave thanks likewise unto the Lord, and spake of him to all them that looked for redemption in Jerusalem."}, {"s": 248533, "e": 255067, "t": "And when they had performed all things according to the law of the Lord, they returned into Galilee, to their own city Nazareth."}, {"s": 255067, "e": 260667, "t": "And the child grew, and waxed strong in spirit, filled with wisdom: and the grace of God was upon him."}, {"s": 260667, "e": 264800, "t": "Now his parents went to Jerusalem every year at the feast of the passover."}, {"s": 264800, "e": 269600, "t": "And when he was twelve years old, they went up to Jerusalem after the custom of the feast."}, {"s": 269600, "e": 278133, "t": "And when they had fulfilled the days, as they returned, the child Jesus tarried behind in Jerusalem; and Joseph and his mother knew not of it."}, {"s": 278133, "e": 285733, "t": "But they, supposing him to have been in the company, went a day's journey; and they sought him among their kinsfolk and acquaintance."}, {"s": 285733, "e": 290000, "t": "And when they found him not, they turned back again to Jerusalem, seeking him."}, {"s": 290000, "e": 297867, "t": "And it came to pass, that after three days they found him in the temple, sitting in the midst of the doctors, both hearing them, and asking them questions."}, {"s": 297867, "e": 302667, "t": "And all that heard him were astonished at his understanding and answers."}, {"s": 302667, "e": 309600, "t": "And when they saw him, they were amazed: and his mother said unto him, Son, why hast thou thus dealt with us?"}, {"s": 309600, "e": 312800, "t": "behold, thy father and I have sought thee sorrowing."}, {"s": 312800, "e": 316933, "t": "And he said unto them, How is it that ye sought me?"}, {"s": 316933, "e": 319867, "t": "wist ye not that I must be about my Father's business?"}, {"s": 319867, "e": 323467, "t": "And they understood not the saying which he spake unto them."}, {"s": 323467, "e": 330133, "t": "And he went down with them, and came to Nazareth, and was subject unto them: but his mother kept all these sayings in her heart."}, {"s": 330133, "e": 335067, "t": "And Jesus increased in wisdom and stature, and in favour with God and man."}],a=document.getElementById('a'),t=document.getElementById('t');
