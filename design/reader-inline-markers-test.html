<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<title>Reader test — inline scene/story markers in the scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
 :root{
   --paper:#fcfcfc; --ink:#3a3120; --read:#a39b8b; --metadata:#9a9388; --faint:#c9c3b7;
   --gold:hsl(42 40% 50%); --gold-wash:#e9d2a2; --marker:#b7ad9c;
   --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif;
 }
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{height:100%;background:#12100c;overflow:hidden}
 body{display:grid;place-items:center;font-family:var(--sans)}
 #scaler{width:1920px;height:1080px;transform-origin:center center}
 .board{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--paper);border-radius:5px}
 .board::before{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.42;
   background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/></svg>")}

 /* fixed anchor top-left (book+chapter rarely change; story+scene now live inline) */
 .rID{position:absolute;top:58px;left:132px;z-index:4}
 .rID .bk{font-family:var(--sans);font-size:26px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:var(--ink)}
 .rID .ver{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--metadata);margin-top:6px}

 .viewport{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:1360px;overflow:hidden;z-index:2}
 #col{position:absolute;left:0;right:0;text-align:left;will-change:transform}
 .w{font-family:var(--serif);font-size:56px;line-height:1.42;color:var(--ink)}
 .v{font-family:var(--sans);font-size:.36em;font-weight:600;color:var(--gold);vertical-align:.9em;margin-right:.12em}
 .w.read{color:var(--read)}
 .w.read .v{color:#cabfa6}
 .w.active{color:#2c2722;background:linear-gradient(var(--gold-wash),var(--gold-wash));
   background-size:100% 62%;background-position:0 82%;background-repeat:no-repeat;
   box-decoration-break:clone;border-radius:4px;padding:0 .12em}

 /* INLINE MARKERS — grayed apparatus that scrolls with the text, never scripture, never gold/red */
 .mark{color:var(--marker);text-align:center}
 .mark.scene{font-family:var(--sans);font-size:25px;font-weight:600;letter-spacing:.22em;
   text-transform:uppercase;padding:60px 0 46px}
 .mark.story{font-family:var(--serif);font-style:italic;font-size:44px;letter-spacing:.01em;
   color:#a79c8a;padding:96px 0 70px}
 .mark.story::before{content:"";display:block;width:80px;height:2px;background:var(--faint);
   margin:0 auto 34px}

 .fade-top{position:absolute;top:0;left:0;right:0;height:300px;z-index:3;
   background:linear-gradient(var(--paper),var(--paper) 40%,rgba(252,252,252,0))}
 .brand{position:absolute;right:132px;bottom:72px;z-index:4;font-family:var(--sans);font-size:20px;font-weight:600;letter-spacing:.08em;color:var(--metadata)}
 .cap{position:absolute;left:20px;bottom:14px;z-index:5;font-family:var(--sans);font-size:13px;color:var(--faint)}
</style></head>
<body>
<div id="scaler"><div class="board">
  <div class="rID"><div class="bk">Genesis 1</div><div class="ver">King James Version</div></div>
  <div class="fade-top"></div>
  <div class="viewport"><div id="col"></div></div>
  <div class="brand">W &amp; W</div>
  <div class="cap">experiment · inline scene + story markers scroll in the body (grayed, not gold)</div>
</div></div>

<script>
const SCENES = [
  {story:"I · Primordial Dawn", name:"The Primal State", verses:[
    [1,"In the beginning God created the heaven and the earth."],
    [2,"And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters."],
  ]},
  {name:"Day One · Light", verses:[
    [3,"And God said, Let there be light: and there was light."],
    [4,"And God saw the light, that it was good: and God divided the light from the darkness."],
    [5,"And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day."],
  ]},
  {name:"Day Two · The Firmament", verses:[
    [6,"And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters."],
    [7,"And God made the firmament, and divided the waters which were under the firmament from the waters which were above the firmament: and it was so."],
    [8,"And God called the firmament Heaven. And the evening and the morning were the second day."],
  ]},
  {name:"Day Three · Land & Sea", verses:[
    [9,"And God said, Let the waters under the heaven be gathered together unto one place, and let the dry land appear: and it was so."],
    [10,"And God called the dry land Earth; and the gathering together of the waters called he Seas: and God saw that it was good."],
  ]},
  {name:"Day Three · Vegetation", verses:[
    [11,"And God said, Let the earth bring forth grass, the herb yielding seed, and the fruit tree yielding fruit after his kind, whose seed is in itself, upon the earth: and it was so."],
    [12,"And the earth brought forth grass, and herb yielding seed after his kind, and the tree yielding fruit, whose seed was in itself, after his kind: and God saw that it was good."],
  ]},
];

const col=document.getElementById('col');
const words=[];
function mark(cls,html){ const d=document.createElement('div'); d.className='mark '+cls; d.innerHTML=html; col.appendChild(d); }
SCENES.forEach(sc=>{
  if(sc.story) mark('story', sc.story);
  mark('scene', sc.name);
  sc.verses.forEach(([vn,text])=>{
    text.split(' ').forEach((tok,ti)=>{
      const span=document.createElement('span'); span.className='w';
      if(ti===0){ const v=document.createElement('span'); v.className='v'; v.textContent=vn; span.appendChild(v); }
      span.appendChild(document.createTextNode(tok+' '));
      col.appendChild(span);
      words.push({el:span, dur:200 + tok.replace(/[^A-Za-z]/g,'').length*44});
    });
  });
});

const READING_Y=600; let start=null, scrollY=0;
let acc=0; words.forEach(w=>{ w.t=acc; acc+=w.dur; }); const TOTAL=acc+1600;
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); document.getElementById('scaler').style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit();
function frame(ts){
  if(start===null) start=ts;
  const e=(ts-start)%TOTAL;
  let ai=0; for(let i=0;i<words.length;i++){ if(words[i].t<=e) ai=i; else break; }
  words.forEach((w,i)=>{ w.el.classList.toggle('read',i<ai); w.el.classList.toggle('active',i===ai); });
  const a=words[ai].el;
  const target=READING_Y-(a.offsetTop+a.offsetHeight/2);
  scrollY+=(target-scrollY)*0.08;
  col.style.transform=`translateY(${scrollY}px)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
