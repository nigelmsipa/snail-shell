<script>
const S=[{"s": 0, "e": 1467, "t": "Mark, Chapter Ten."}, {"s": 1467, "e": 12000, "t": "And he arose from thence, and cometh into the coasts of Judaea by the farther side of Jordan: and the people resort unto him again; and, as he was wont, he taught them again."}, {"s": 12000, "e": 16667, "t": "And the Pharisees came to him, and asked him, Is it lawful for a man to put away his wife?"}, {"s": 16667, "e": 17600, "t": "tempting him."}, {"s": 17600, "e": 22133, "t": "And he answered and said unto them, What did Moses command you?"}, {"s": 22133, "e": 26800, "t": "And they said, Moses suffered to write a bill of divorcement, and to put her away."}, {"s": 26800, "e": 32267, "t": "And Jesus answered and said unto them, For the hardness of your heart he wrote you this precept."}, {"s": 32267, "e": 36267, "t": "But from the beginning of the creation God made them male and female."}, {"s": 36267, "e": 45600, "t": "For this cause shall a man leave his father and mother, and cleave to his wife; And they twain shall be one flesh: so then they are no more twain, but one flesh."}, {"s": 45600, "e": 49867, "t": "What therefore God hath joined together, let not man put asunder."}, {"s": 49867, "e": 53600, "t": "And in the house his disciples asked him again of the same matter."}, {"s": 53600, "e": 61067, "t": "And he saith unto them, Whosoever shall put away his wife, and marry another, committeth adultery against her."}, {"s": 61067, "e": 66000, "t": "And if a woman shall put away her husband, and be married to another, she committeth adultery."}, {"s": 66000, "e": 72267, "t": "And they brought young children to him, that he should touch them: and his disciples rebuked those that brought them."}, {"s": 72267, "e": 82533, "t": "But when Jesus saw it, he was much displeased, and said unto them, Suffer the little children to come unto me, and forbid them not: for of such is the kingdom of God."}, {"s": 82533, "e": 90000, "t": "Verily I say unto you, Whosoever shall not receive the kingdom of God as a little child, he shall not enter therein."}, {"s": 90000, "e": 94267, "t": "And he took them up in his arms, put his hands upon them, and blessed them."}, {"s": 94267, "e": 103600, "t": "And when he was gone forth into the way, there came one running, and kneeled to him, and asked him, Good Master, what shall I do that I may inherit eternal life?"}, {"s": 103600, "e": 106800, "t": "And Jesus said unto him, Why callest thou me good?"}, {"s": 106800, "e": 109600, "t": "there is none good but one, that is, God."}, {"s": 109600, "e": 119867, "t": "Thou knowest the commandments, Do not commit adultery, Do not kill, Do not steal, Do not bear false witness, Defraud not, Honour thy father and mother."}, {"s": 119867, "e": 125600, "t": "And he answered and said unto him, Master, all these have I observed from my youth."}, {"s": 125600, "e": 140667, "t": "Then Jesus beholding him loved him, and said unto him, One thing thou lackest: go thy way, sell whatsoever thou hast, and give to the poor, and thou shalt have treasure in heaven: and come, take up the cross, and follow me."}, {"s": 140667, "e": 144800, "t": "And he was sad at that saying, and went away grieved: for he had great possessions."}, {"s": 144800, "e": 152800, "t": "And Jesus looked round about, and saith unto his disciples, How hardly shall they that have riches enter into the kingdom of God!"}, {"s": 152800, "e": 155600, "t": "And the disciples were astonished at his words."}, {"s": 155600, "e": 164133, "t": "But Jesus answereth again, and saith unto them, Children, how hard is it for them that trust in riches to enter into the kingdom of God!"}, {"s": 164133, "e": 170533, "t": "It is easier for a camel to go through the eye of a needle, than for a rich man to enter into the kingdom of God."}, {"s": 170533, "e": 176000, "t": "And they were astonished out of measure, saying among themselves, Who then can be saved?"}, {"s": 176000, "e": 183200, "t": "And Jesus looking upon them saith, With men it is impossible, but not with God: for with God all things are possible."}, {"s": 183200, "e": 189333, "t": "Then Peter began to say unto him, Lo, we have left all, and have followed thee."}, {"s": 189333, "e": 205867, "t": "And Jesus answered and said, Verily I say unto you, There is no man that hath left house, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for my sake, and the gospel's, But he shall receive an hundredfold now in this time, houses, and brethren, and sisters,"}, {"s": 205867, "e": 211067, "t": "and mothers, and children, and lands, with persecutions; and in the world to come eternal life."}, {"s": 211067, "e": 214933, "t": "But many that are first shall be last; and the last first."}, {"s": 214933, "e": 223600, "t": "And they were in the way going up to Jerusalem; and Jesus went before them: and they were amazed; and as they followed, they were afraid."}, {"s": 223600, "e": 237600, "t": "And he took again the twelve, and began to tell them what things should happen unto him, Saying, Behold, we go up to Jerusalem; and the Son of man shall be delivered unto the chief priests, and unto the scribes; and they shall condemn him to death, and shall deliver him to the Gentiles:"}, {"s": 237600, "e": 244933, "t": "And they shall mock him, and shall scourge him, and shall spit upon him, and shall kill him: and the third day he shall rise again."}, {"s": 244933, "e": 253333, "t": "And James and John, the sons of Zebedee, come unto him, saying, Master, we would that thou shouldest do for us whatsoever we shall desire."}, {"s": 253333, "e": 257333, "t": "And he said unto them, What would ye that I should do for you?"}, {"s": 257333, "e": 264400, "t": "They said unto him, Grant unto us that we may sit, one on thy right hand, and the other on thy left hand, in thy glory."}, {"s": 264400, "e": 271200, "t": "But Jesus said unto them, Ye know not what ye ask: can ye drink of the cup that I drink of?"}, {"s": 271200, "e": 274533, "t": "and be baptized with the baptism that I am baptized with?"}, {"s": 274533, "e": 277333, "t": "And they said unto him, We can."}, {"s": 277333, "e": 293067, "t": "And Jesus said unto them, Ye shall indeed drink of the cup that I drink of; and with the baptism that I am baptized withal shall ye be baptized: But to sit on my right hand and on my left hand is not mine to give; but it shall be given to them for whom it is prepared."}, {"s": 293067, "e": 297600, "t": "And when the ten heard it, they began to be much displeased with James and John."}, {"s": 297600, "e": 309467, "t": "But Jesus called them to him, and saith unto them, Ye know that they which are accounted to rule over the Gentiles exercise lordship over them; and their great ones exercise authority upon them."}, {"s": 309467, "e": 319200, "t": "But so shall it not be among you: but whosoever will be great among you, shall be your minister: And whosoever of you will be the chiefest, shall be servant of all."}, {"s": 319200, "e": 326133, "t": "For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many."}, {"s": 326133, "e": 336267, "t": "And they came to Jericho: and as he went out of Jericho with his disciples and a great number of people, blind Bartimaeus, the son of Timaeus, sat by the highway side begging."}, {"s": 336267, "e": 344133, "t": "And when he heard that it was Jesus of Nazareth, he began to cry out, and say, Jesus, thou Son of David, have mercy on me."}, {"s": 344133, "e": 352400, "t": "And many charged him that he should hold his peace: but he cried the more a great deal, Thou Son of David, have mercy on me."}, {"s": 352400, "e": 356000, "t": "And Jesus stood still, and commanded him to be called."}, {"s": 356000, "e": 361467, "t": "And they call the blind man, saying unto him, Be of good comfort, rise; he calleth thee."}, {"s": 361467, "e": 365867, "t": "And he, casting away his garment, rose, and came to Jesus."}, {"s": 365867, "e": 370400, "t": "And Jesus answered and said unto him, What wilt thou that I should do unto thee?"}, {"s": 370400, "e": 374667, "t": "The blind man said unto him, Lord, that I might receive my sight."}, {"s": 374667, "e": 378933, "t": "And Jesus said unto him, Go thy way; thy faith hath made thee whole."}, {"s": 378933, "e": 383067, "t": "And immediately he received his sight, and followed Jesus in the way."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);

 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});

</script></body></html>
