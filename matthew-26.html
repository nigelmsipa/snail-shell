const S=[{"s": 0, "e": 2400, "t": "Matthew, Chapter Twenty-Six."}, {"s": 2400, "e": 13867, "t": "And it came to pass, when Jesus had finished all these sayings, he said unto his disciples, Ye know that after two days is the feast of the passover, and the Son of man is betrayed to be crucified."}, {"s": 13867, "e": 24933, "t": "Then assembled together the chief priests, and the scribes, and the elders of the people, unto the palace of the high priest, who was called Caiaphas, And consulted that they might take Jesus by subtilty, and kill him."}, {"s": 24933, "e": 29733, "t": "But they said, Not on the feast day, lest there be an uproar among the people."}, {"s": 29733, "e": 41867, "t": "Now when Jesus was in Bethany, in the house of Simon the leper, There came unto him a woman having an alabaster box of very precious ointment, and poured it on his head, as he sat at meat."}, {"s": 41867, "e": 48000, "t": "But when his disciples saw it, they had indignation, saying, To what purpose is this waste?"}, {"s": 48000, "e": 52533, "t": "For this ointment might have been sold for much, and given to the poor."}, {"s": 52533, "e": 56800, "t": "When Jesus understood it, he said unto them, Why trouble ye the woman?"}, {"s": 56800, "e": 59333, "t": "for she hath wrought a good work upon me."}, {"s": 59333, "e": 63600, "t": "For ye have the poor always with you; but me ye have not always."}, {"s": 63600, "e": 69067, "t": "For in that she hath poured this ointment on my body, she did it for my burial."}, {"s": 69067, "e": 77733, "t": "Verily I say unto you, Wheresoever this gospel shall be preached in the whole world, there shall also this, that this woman hath done, be told for a memorial of her."}, {"s": 77733, "e": 88000, "t": "Then one of the twelve, called Judas Iscariot, went unto the chief priests, And said unto them, What will ye give me, and I will deliver him unto you?"}, {"s": 88000, "e": 90933, "t": "And they covenanted with him for thirty pieces of silver."}, {"s": 90933, "e": 94533, "t": "And from that time he sought opportunity to betray him."}, {"s": 94533, "e": 103867, "t": "Now the first day of the feast of unleavened bread the disciples came to Jesus, saying unto him, Where wilt thou that we prepare for thee to eat the passover?"}, {"s": 103867, "e": 113733, "t": "And he said, Go into the city to such a man, and say unto him, The Master saith, My time is at hand; I will keep the passover at thy house with my disciples."}, {"s": 113733, "e": 118400, "t": "And the disciples did as Jesus had appointed them; and they made ready the passover."}, {"s": 118400, "e": 122267, "t": "Now when the even was come, he sat down with the twelve."}, {"s": 122267, "e": 128133, "t": "And as they did eat, he said, Verily I say unto you, that one of you shall betray me."}, {"s": 128133, "e": 134267, "t": "And they were exceeding sorrowful, and began every one of them to say unto him, Lord, is it I?"}, {"s": 134267, "e": 140133, "t": "And he answered and said, He that dippeth his hand with me in the dish, the same shall betray me."}, {"s": 140133, "e": 147333, "t": "The Son of man goeth as it is written of him: but woe unto that man by whom the Son of man is betrayed!"}, {"s": 147333, "e": 150267, "t": "it had been good for that man if he had not been born."}, {"s": 150267, "e": 156000, "t": "Then Judas, which betrayed him, answered and said, Master, is it I?"}, {"s": 156000, "e": 158800, "t": "He said unto him, Thou hast said."}, {"s": 158800, "e": 168933, "t": "And as they were eating, Jesus took bread, and blessed it, and brake it, and gave it to the disciples, and said, Take, eat; this is my body."}, {"s": 168933, "e": 178533, "t": "And he took the cup, and gave thanks, and gave it to them, saying, Drink ye all of it; For this is my blood of the new testament, which is shed for many for the remission of sins."}, {"s": 178533, "e": 186533, "t": "But I say unto you, I will not drink henceforth of this fruit of the vine, until that day when I drink it new with you in my Father's kingdom."}, {"s": 186533, "e": 190267, "t": "And when they had sung an hymn, they went out into the mount of Olives."}, {"s": 190267, "e": 200400, "t": "Then saith Jesus unto them, All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep of the flock shall be scattered abroad."}, {"s": 200400, "e": 204267, "t": "But after I am risen again, I will go before you into Galilee."}, {"s": 204267, "e": 210933, "t": "Peter answered and said unto him, Though all men shall be offended because of thee, yet will I never be offended."}, {"s": 210933, "e": 217867, "t": "Jesus said unto him, Verily I say unto thee, That this night, before the cock crow, thou shalt deny me thrice."}, {"s": 217867, "e": 223067, "t": "Peter said unto him, Though I should die with thee, yet will I not deny thee."}, {"s": 223067, "e": 226000, "t": "Likewise also said all the disciples."}, {"s": 226000, "e": 234533, "t": "Then cometh Jesus with them unto a place called Gethsemane, and saith unto the disciples, Sit ye here, while I go and pray yonder."}, {"s": 234533, "e": 240533, "t": "And he took with him Peter and the two sons of Zebedee, and began to be sorrowful and very heavy."}, {"s": 240533, "e": 247867, "t": "Then saith he unto them, My soul is exceeding sorrowful, even unto death: tarry ye here, and watch with me."}, {"s": 247867, "e": 258667, "t": "And he went a little further, and fell on his face, and prayed, saying, O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt."}, {"s": 258667, "e": 266400, "t": "And he cometh unto the disciples, and findeth them asleep, and saith unto Peter, What, could ye not watch with me one hour?"}, {"s": 266400, "e": 272667, "t": "Watch and pray, that ye enter not into temptation: the spirit indeed is willing, but the flesh is weak."}, {"s": 272667, "e": 282667, "t": "He went away again the second time, and prayed, saying, O my Father, if this cup may not pass away from me, except I drink it, thy will be done."}, {"s": 282667, "e": 286667, "t": "And he came and found them asleep again: for their eyes were heavy."}, {"s": 286667, "e": 292400, "t": "And he left them, and went away again, and prayed the third time, saying the same words."}, {"s": 292400, "e": 304533, "t": "Then cometh he to his disciples, and saith unto them, Sleep on now, and take your rest: behold, the hour is at hand, and the Son of man is betrayed into the hands of sinners."}, {"s": 304533, "e": 308800, "t": "Rise, let us be going: behold, he is at hand that doth betray me."}, {"s": 308800, "e": 318133, "t": "And while he yet spake, lo, Judas, one of the twelve, came, and with him a great multitude with swords and staves, from the chief priests and elders of the people."}, {"s": 318133, "e": 326667, "t": "Now he that betrayed him gave them a sign, saying, Whomsoever I shall kiss, that same is he: hold him fast."}, {"s": 326667, "e": 331200, "t": "And forthwith he came to Jesus, and said, Hail, master; and kissed him."}, {"s": 331200, "e": 335333, "t": "And Jesus said unto him, Friend, wherefore art thou come?"}, {"s": 335333, "e": 339200, "t": "Then came they, and laid hands on Jesus, and took him."}, {"s": 339200, "e": 347333, "t": "And, behold, one of them which were with Jesus stretched out his hand, and drew his sword, and struck a servant of the high priest's, and smote off his ear."}, {"s": 347333, "e": 355200, "t": "Then said Jesus unto him, Put up again thy sword into his place: for all they that take the sword shall perish with the sword."}, {"s": 355200, "e": 361600, "t": "Thinkest thou that I cannot now pray to my Father, and he shall presently give me more than twelve legions of angels?"}, {"s": 361600, "e": 366267, "t": "But how then shall the scriptures be fulfilled, that thus it must be?"}, {"s": 366267, "e": 374133, "t": "In that same hour said Jesus to the multitudes, Are ye come out as against a thief with swords and staves for to take me?"}, {"s": 374133, "e": 378667, "t": "I sat daily with you teaching in the temple, and ye laid no hold on me."}, {"s": 378667, "e": 382800, "t": "But all this was done, that the scriptures of the prophets might be fulfilled."}, {"s": 382800, "e": 386000, "t": "Then all the disciples forsook him, and fled."}, {"s": 386000, "e": 392400, "t": "And they that had laid hold on Jesus led him away to Caiaphas the high priest, where the scribes and the elders were assembled."}, {"s": 392400, "e": 399733, "t": "But Peter followed him afar off unto the high priest's palace, and went in, and sat with the servants, to see the end."}, {"s": 399733, "e": 412133, "t": "Now the chief priests, and elders, and all the council, sought false witness against Jesus, to put him to death; But found none: yea, though many false witnesses came, yet found they none."}, {"s": 412133, "e": 421733, "t": "At the last came two false witnesses, And said, This fellow said, I am able to destroy the temple of God, and to build it in three days."}, {"s": 421733, "e": 425867, "t": "And the high priest arose, and said unto him, Answerest thou nothing?"}, {"s": 425867, "e": 428933, "t": "what is it which these witness against thee?"}, {"s": 428933, "e": 430933, "t": "But Jesus held his peace."}, {"s": 430933, "e": 438933, "t": "And the high priest answered and said unto him, I adjure thee by the living God, that thou tell us whether thou be the Christ, the Son of God."}, {"s": 438933, "e": 451333, "t": "Jesus saith unto him, Thou hast said: nevertheless I say unto you, Hereafter shall ye see the Son of man sitting on the right hand of power, and coming in the clouds of heaven."}, {"s": 451333, "e": 457600, "t": "Then the high priest rent his clothes, saying, He hath spoken blasphemy; what further need have we of witnesses?"}, {"s": 457600, "e": 463867, "t": "behold, now ye have heard his blasphemy."}, {"s": 463867, "e": 465067, "t": "What think ye?"}, {"s": 465067, "e": 468000, "t": "They answered and said, He is guilty of death."}, {"s": 468000, "e": 477733, "t": "Then did they spit in his face, and buffeted him; and others smote him with the palms of their hands, Saying, Prophesy unto us, thou Christ, Who is he that smote thee?"}, {"s": 477733, "e": 486267, "t": "Now Peter sat without in the palace: and a damsel came unto him, saying, Thou also wast with Jesus of Galilee."}, {"s": 486267, "e": 490400, "t": "But he denied before them all, saying, I know not what thou sayest."}, {"s": 490400, "e": 498800, "t": "And when he was gone out into the porch, another maid saw him, and said unto them that were there, This fellow was also with Jesus of Nazareth."}, {"s": 498800, "e": 502267, "t": "And again he denied with an oath, I do not know the man."}, {"s": 502267, "e": 510800, "t": "And after a while came unto him they that stood by, and said to Peter, Surely thou also art one of them; for thy speech bewrayeth thee."}, {"s": 510800, "e": 515867, "t": "Then began he to curse and to swear, saying, I know not the man."}, {"s": 515867, "e": 517467, "t": "And immediately the cock crew."}, {"s": 517467, "e": 523467, "t": "And Peter remembered the word of Jesus, which said unto him, Before the cock crow, thou shalt deny me thrice."}, {"s": 523467, "e": 525600, "t": "And he went out, and wept bitterly."}],a=document.getElementById('a'),t=document.getElementById('t');
