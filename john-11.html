<script>
const S=[{"s": 0, "e": 3333, "t": "John, Chapter Eleven."}, {"s": 3333, "e": 9333, "t": "Now a certain man was sick, named Lazarus, of Bethany, the town of Mary and her sister Martha."}, {"s": 9333, "e": 22267, "t": "(It was that Mary which anointed the Lord with ointment, and wiped his feet with her hair, whose brother Lazarus was sick.) Therefore his sisters sent unto him, saying, Lord, behold, he whom thou lovest is sick."}, {"s": 22267, "e": 31200, "t": "When Jesus heard that, he said, This sickness is not unto death, but for the glory of God, that the Son of God might be glorified thereby."}, {"s": 31200, "e": 36000, "t": "Now Jesus loved Martha, and her sister, and Lazarus."}, {"s": 36000, "e": 41067, "t": "When he had heard therefore that he was sick, he abode two days still in the same place where he was."}, {"s": 41067, "e": 46267, "t": "Then after that saith he to his disciples, Let us go into Judaea again."}, {"s": 46267, "e": 53467, "t": "His disciples say unto him, Master, the Jews of late sought to stone thee; and goest thou thither again?"}, {"s": 53467, "e": 56933, "t": "Jesus answered, Are there not twelve hours in the day?"}, {"s": 56933, "e": 61733, "t": "If any man walk in the day, he stumbleth not, because he seeth the light of this world."}, {"s": 61733, "e": 66400, "t": "But if a man walk in the night, he stumbleth, because there is no light in him."}, {"s": 66400, "e": 74000, "t": "These things said he: and after that he saith unto them, Our friend Lazarus sleepeth; but I go, that I may awake him out of sleep."}, {"s": 74000, "e": 78800, "t": "Then said his disciples, Lord, if he sleep, he shall do well."}, {"s": 78800, "e": 84133, "t": "Howbeit Jesus spake of his death: but they thought that he had spoken of taking of rest in sleep."}, {"s": 84133, "e": 88400, "t": "Then said Jesus unto them plainly, Lazarus is dead."}, {"s": 88400, "e": 95467, "t": "And I am glad for your sakes that I was not there, to the intent ye may believe; nevertheless let us go unto him."}, {"s": 95467, "e": 102667, "t": "Then said Thomas, which is called Didymus, unto his fellowdisciples, Let us also go, that we may die with him."}, {"s": 102667, "e": 107467, "t": "Then when Jesus came, he found that he had lain in the grave four days already."}, {"s": 107467, "e": 116933, "t": "Now Bethany was nigh unto Jerusalem, about fifteen furlongs off: And many of the Jews came to Martha and Mary, to comfort them concerning their brother."}, {"s": 116933, "e": 124133, "t": "Then Martha, as soon as she heard that Jesus was coming, went and met him: but Mary sat still in the house."}, {"s": 124133, "e": 129867, "t": "Then said Martha unto Jesus, Lord, if thou hadst been here, my brother had not died."}, {"s": 129867, "e": 136000, "t": "But I know, that even now, whatsoever thou wilt ask of God, God will give it thee."}, {"s": 136000, "e": 140000, "t": "Jesus saith unto her, Thy brother shall rise again."}, {"s": 140000, "e": 145067, "t": "Martha saith unto him, I know that he shall rise again in the resurrection at the last day."}, {"s": 145067, "e": 155467, "t": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die."}, {"s": 155467, "e": 157067, "t": "Believest thou this?"}, {"s": 157067, "e": 163467, "t": "She saith unto him, Yea, Lord: I believe that thou art the Christ, the Son of God, which should come into the world."}, {"s": 163467, "e": 171200, "t": "And when she had so said, she went her way, and called Mary her sister secretly, saying, The Master is come, and calleth for thee."}, {"s": 171200, "e": 175067, "t": "As soon as she heard that, she arose quickly, and came unto him."}, {"s": 175067, "e": 180267, "t": "Now Jesus was not yet come into the town, but was in that place where Martha met him."}, {"s": 180267, "e": 191333, "t": "The Jews then which were with her in the house, and comforted her, when they saw Mary, that she rose up hastily and went out, followed her, saying, She goeth unto the grave to weep there."}, {"s": 191333, "e": 200400, "t": "Then when Mary was come where Jesus was, and saw him, she fell down at his feet, saying unto him, Lord, if thou hadst been here, my brother had not died."}, {"s": 200400, "e": 211067, "t": "When Jesus therefore saw her weeping, and the Jews also weeping which came with her, he groaned in the spirit, and was troubled, And said, Where have ye laid him?"}, {"s": 211067, "e": 213733, "t": "They said unto him, Lord, come and see."}, {"s": 213733, "e": 214800, "t": "Jesus wept."}, {"s": 214800, "e": 218000, "t": "Then said the Jews, Behold how he loved him!"}, {"s": 218000, "e": 226800, "t": "And some of them said, Could not this man, which opened the eyes of the blind, have caused that even this man should not have died?"}, {"s": 226800, "e": 230133, "t": "Jesus therefore again groaning in himself cometh to the grave."}, {"s": 230133, "e": 233200, "t": "It was a cave, and a stone lay upon it."}, {"s": 233200, "e": 236267, "t": "Jesus said, Take ye away the stone."}, {"s": 236267, "e": 243867, "t": "Martha, the sister of him that was dead, saith unto him, Lord, by this time he stinketh: for he hath been dead four days."}, {"s": 243867, "e": 251733, "t": "Jesus saith unto her, Said I not unto thee, that, if thou wouldest believe, thou shouldest see the glory of God?"}, {"s": 251733, "e": 255733, "t": "Then they took away the stone from the place where the dead was laid."}, {"s": 255733, "e": 261200, "t": "And Jesus lifted up his eyes, and said, Father, I thank thee that thou hast heard me."}, {"s": 261200, "e": 269200, "t": "And I knew that thou hearest me always: but because of the people which stand by I said it, that they may believe that thou hast sent me."}, {"s": 269200, "e": 274667, "t": "And when he thus had spoken, he cried with a loud voice, Lazarus, come forth."}, {"s": 274667, "e": 282133, "t": "And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin."}, {"s": 282133, "e": 285867, "t": "Jesus saith unto them, Loose him, and let him go."}, {"s": 285867, "e": 291600, "t": "Then many of the Jews which came to Mary, and had seen the things which Jesus did, believed on him."}, {"s": 291600, "e": 296800, "t": "But some of them went their ways to the Pharisees, and told them what things Jesus had done."}, {"s": 296800, "e": 301867, "t": "Then gathered the chief priests and the Pharisees a council, and said, What do we?"}, {"s": 301867, "e": 304133, "t": "for this man doeth many miracles."}, {"s": 304133, "e": 311333, "t": "If we let him thus alone, all men will believe on him: and the Romans shall come and take away both our place and nation."}, {"s": 311333, "e": 326000, "t": "And one of them, named Caiaphas, being the high priest that same year, said unto them, Ye know nothing at all, Nor consider that it is expedient for us, that one man should die for the people, and that the whole nation perish not."}, {"s": 326000, "e": 339067, "t": "And this spake he not of himself: but being high priest that year, he prophesied that Jesus should die for that nation; And not for that nation only, but that also he should gather together in one the children of God that were scattered abroad."}, {"s": 339067, "e": 343333, "t": "Then from that day forth they took counsel together for to put him to death."}, {"s": 343333, "e": 353200, "t": "Jesus therefore walked no more openly among the Jews; but went thence unto a country near to the wilderness, into a city called Ephraim, and there continued with his disciples."}, {"s": 353200, "e": 361333, "t": "And the Jews' passover was nigh at hand: and many went out of the country up to Jerusalem before the passover, to purify themselves."}, {"s": 361333, "e": 369333, "t": "Then sought they for Jesus, and spake among themselves, as they stood in the temple, What think ye, that he will not come to the feast?"}, {"s": 369333, "e": 377867, "t": "Now both the chief priests and the Pharisees had given a commandment, that, if any man knew where he were, he should shew it, that they might take him."}],a=document.getElementById('a'),t=document.getElementById('t');
