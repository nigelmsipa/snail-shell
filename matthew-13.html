<main><h1>matthew-13</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1733, "t": "Matthew, Chapter Thirteen."}, {"s": 1733, "e": 6533, "t": "The same day went Jesus out of the house, and sat by the sea side."}, {"s": 6533, "e": 14267, "t": "And great multitudes were gathered together unto him, so that he went into a ship, and sat; and the whole multitude stood on the shore."}, {"s": 14267, "e": 30400, "t": "And he spake many things unto them in parables, saying, Behold, a sower went forth to sow; And when he sowed, some seeds fell by the way side, and the fowls came and devoured them up: Some fell upon stony places, where they had not much earth: and forthwith they sprung up,"}, {"s": 30400, "e": 38267, "t": "because they had no deepness of earth: And when the sun was up, they were scorched; and because they had no root, they withered away."}, {"s": 38267, "e": 49867, "t": "And some fell among thorns; and the thorns sprung up, and choked them: But other fell into good ground, and brought forth fruit, some an hundredfold, some sixtyfold, some thirtyfold."}, {"s": 49867, "e": 52667, "t": "Who hath ears to hear, let him hear."}, {"s": 52667, "e": 58267, "t": "And the disciples came, and said unto him, Why speakest thou unto them in parables?"}, {"s": 58267, "e": 66400, "t": "He answered and said unto them, Because it is given unto you to know the mysteries of the kingdom of heaven, but to them it is not given."}, {"s": 66400, "e": 76800, "t": "For whosoever hath, to him shall be given, and he shall have more abundance: but whosoever hath not, from him shall be taken away even that he hath."}, {"s": 76800, "e": 84933, "t": "Therefore speak I to them in parables: because they seeing see not; and hearing they hear not, neither do they understand."}, {"s": 84933, "e": 103200, "t": "And in them is fulfilled the prophecy of Esaias, which saith, By hearing ye shall hear, and shall not understand; and seeing ye shall see, and shall not perceive: For this people's heart is waxed gross, and their ears are dull of hearing, and their eyes they have closed;"}, {"s": 103200, "e": 111867, "t": "lest at any time they should see with their eyes, and hear with their ears, and should understand with their heart, and should be converted, and I should heal them."}, {"s": 111867, "e": 116400, "t": "But blessed are your eyes, for they see: and your ears, for they hear."}, {"s": 116400, "e": 128667, "t": "For verily I say unto you, That many prophets and righteous men have desired to see those things which ye see, and have not seen them; and to hear those things which ye hear, and have not heard them."}, {"s": 128667, "e": 131467, "t": "Hear ye therefore the parable of the sower."}, {"s": 131467, "e": 139733, "t": "When any one heareth the word of the kingdom, and understandeth it not, then cometh the wicked one, and catcheth away that which was sown in his heart."}, {"s": 139733, "e": 142667, "t": "This is he which received seed by the way side."}, {"s": 142667, "e": 159733, "t": "But he that received the seed into stony places, the same is he that heareth the word, and anon with joy receiveth it; Yet hath he not root in himself, but dureth for a while: for when tribulation or persecution ariseth because of the word, by and by he is offended."}, {"s": 159733, "e": 170000, "t": "He also that received seed among the thorns is he that heareth the word; and the care of this world, and the deceitfulness of riches, choke the word, and he becometh unfruitful."}, {"s": 170000, "e": 180667, "t": "But he that received seed into the good ground is he that heareth the word, and understandeth it; which also beareth fruit, and bringeth forth, some an hundredfold, some sixty, some thirty."}, {"s": 180667, "e": 193333, "t": "Another parable put he forth unto them, saying, The kingdom of heaven is likened unto a man which sowed good seed in his field: But while men slept, his enemy came and sowed tares among the wheat, and went his way."}, {"s": 193333, "e": 198533, "t": "But when the blade was sprung up, and brought forth fruit, then appeared the tares also."}, {"s": 198533, "e": 205333, "t": "So the servants of the householder came and said unto him, Sir, didst not thou sow good seed in thy field?"}, {"s": 205333, "e": 207067, "t": "from whence then hath it tares?"}, {"s": 207067, "e": 210667, "t": "He said unto them, An enemy hath done this."}, {"s": 210667, "e": 215067, "t": "The servants said unto him, Wilt thou then that we go and gather them up?"}, {"s": 215067, "e": 220667, "t": "But he said, Nay; lest while ye gather up the tares, ye root up also the wheat with them."}, {"s": 220667, "e": 232800, "t": "Let both grow together until the harvest: and in the time of harvest I will say to the reapers, Gather ye together first the tares, and bind them in bundles to burn them: but gather the wheat into my barn."}, {"s": 232800, "e": 249200, "t": "Another parable put he forth unto them, saying, The kingdom of heaven is like to a grain of mustard seed, which a man took, and sowed in his field: Which indeed is the least of all seeds: but when it is grown, it is the greatest among herbs, and becometh a tree,"}, {"s": 249200, "e": 253200, "t": "so that the birds of the air come and lodge in the branches thereof."}, {"s": 253200, "e": 263200, "t": "Another parable spake he unto them; The kingdom of heaven is like unto leaven, which a woman took, and hid in three measures of meal, till the whole was leavened."}, {"s": 263200, "e": 278933, "t": "All these things spake Jesus unto the multitude in parables; and without a parable spake he not unto them: That it might be fulfilled which was spoken by the prophet, saying, I will open my mouth in parables; I will utter things which have been kept secret from the foundation of the world."}, {"s": 278933, "e": 288000, "t": "Then Jesus sent the multitude away, and went into the house: and his disciples came unto him, saying, Declare unto us the parable of the tares of the field."}, {"s": 288000, "e": 303867, "t": "He answered and said unto them, He that soweth the good seed is the Son of man; The field is the world; the good seed are the children of the kingdom; but the tares are the children of the wicked one; The enemy that sowed them is the devil; the harvest is the end of the world;"}, {"s": 303867, "e": 305733, "t": "and the reapers are the angels."}, {"s": 305733, "e": 311733, "t": "As therefore the tares are gathered and burned in the fire; so shall it be in the end of this world."}, {"s": 311733, "e": 324000, "t": "The Son of man shall send forth his angels, and they shall gather out of his kingdom all things that offend, and them which do iniquity; And shall cast them into a furnace of fire: there shall be wailing and gnashing of teeth."}, {"s": 324000, "e": 328133, "t": "Then shall the righteous shine forth as the sun in the kingdom of their Father."}, {"s": 328133, "e": 331067, "t": "Who hath ears to hear, let him hear."}, {"s": 331067, "e": 341467, "t": "Again, the kingdom of heaven is like unto treasure hid in a field; the which when a man hath found, he hideth, and for joy thereof goeth and selleth all that he hath, and buyeth that field."}, {"s": 341467, "e": 351600, "t": "Again, the kingdom of heaven is like unto a merchant man, seeking goodly pearls: Who, when he had found one pearl of great price, went and sold all that he had, and bought it."}, {"s": 351600, "e": 365467, "t": "Again, the kingdom of heaven is like unto a net, that was cast into the sea, and gathered of every kind: Which, when it was full, they drew to shore, and sat down, and gathered the good into vessels, but cast the bad away."}, {"s": 365467, "e": 376933, "t": "So shall it be at the end of the world: the angels shall come forth, and sever the wicked from among the just, And shall cast them into the furnace of fire: there shall be wailing and gnashing of teeth."}, {"s": 376933, "e": 381333, "t": "Jesus saith unto them, Have ye understood all these things?"}, {"s": 381333, "e": 384133, "t": "They say unto him, Yea, Lord."}, {"s": 384133, "e": 396533, "t": "Then said he unto them, Therefore every scribe which is instructed unto the kingdom of heaven is like unto a man that is an householder, which bringeth forth out of his treasure things new and old."}, {"s": 396533, "e": 402400, "t": "And it came to pass, that when Jesus had finished these parables, he departed thence."}, {"s": 402400, "e": 412933, "t": "And when he was come into his own country, he taught them in their synagogue, insomuch that they were astonished, and said, Whence hath this man this wisdom, and these mighty works?"}, {"s": 412933, "e": 415067, "t": "Is not this the carpenter's son?"}, {"s": 415067, "e": 417067, "t": "is not his mother called Mary?"}, {"s": 417067, "e": 420533, "t": "and his brethren, James, and Joses, and Simon, and Judas?"}, {"s": 420533, "e": 422933, "t": "And his sisters, are they not all with us?"}, {"s": 422933, "e": 425733, "t": "Whence then hath this man all these things?"}, {"s": 425733, "e": 427467, "t": "And they were offended in him."}, {"s": 427467, "e": 434000, "t": "But Jesus said unto them, A prophet is not without honour, save in his own country, and in his own house."}, {"s": 434000, "e": 437600, "t": "And he did not many mighty works there because of their unbelief."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});

 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;

</script></body></html>
