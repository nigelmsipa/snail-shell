<script>
const S=[{"s": 0, "e": 1600, "t": "Mark, Chapter Nine."}, {"s": 1600, "e": 11867, "t": "And he said unto them, Verily I say unto you, That there be some of them that stand here, which shall not taste of death, till they have seen the kingdom of God come with power."}, {"s": 11867, "e": 22800, "t": "And after six days Jesus taketh with him Peter, and James, and John, and leadeth them up into an high mountain apart by themselves: and he was transfigured before them."}, {"s": 22800, "e": 29333, "t": "And his raiment became shining, exceeding white as snow; so as no fuller on earth can white them."}, {"s": 29333, "e": 34667, "t": "And there appeared unto them Elias with Moses: and they were talking with Jesus."}, {"s": 34667, "e": 45467, "t": "And Peter answered and said to Jesus, Master, it is good for us to be here: and let us make three tabernacles; one for thee, and one for Moses, and one for Elias."}, {"s": 45467, "e": 49867, "t": "For he wist not what to say; for they were sore afraid."}, {"s": 49867, "e": 57867, "t": "And there was a cloud that overshadowed them: and a voice came out of the cloud, saying, This is my beloved Son: hear him."}, {"s": 57867, "e": 64933, "t": "And suddenly, when they had looked round about, they saw no man any more, save Jesus only with themselves."}, {"s": 64933, "e": 72667, "t": "And as they came down from the mountain, he charged them that they should tell no man what things they had seen, till the Son of man were risen from the dead."}, {"s": 72667, "e": 78667, "t": "And they kept that saying with themselves, questioning one with another what the rising from the dead should mean."}, {"s": 78667, "e": 82667, "t": "And they asked him, saying, Why say the scribes that Elias must first come?"}, {"s": 82667, "e": 93867, "t": "And he answered and told them, Elias verily cometh first, and restoreth all things; and how it is written of the Son of man, that he must suffer many things, and be set at nought."}, {"s": 93867, "e": 102000, "t": "But I say unto you, That Elias is indeed come, and they have done unto him whatsoever they listed, as it is written of him."}, {"s": 102000, "e": 108400, "t": "And when he came to his disciples, he saw a great multitude about them, and the scribes questioning with them."}, {"s": 108400, "e": 114933, "t": "And straightway all the people, when they beheld him, were greatly amazed, and running to him saluted him."}, {"s": 114933, "e": 117867, "t": "And he asked the scribes, What question ye with them?"}, {"s": 117867, "e": 135733, "t": "And one of the multitude answered and said, Master, I have brought unto thee my son, which hath a dumb spirit; And wheresoever he taketh him, he teareth him: and he foameth, and gnasheth with his teeth, and pineth away: and I spake to thy disciples that they should cast him out; and they could not."}, {"s": 135733, "e": 141733, "t": "He answereth him, and saith, O faithless generation, how long shall I be with you?"}, {"s": 141733, "e": 143867, "t": "how long shall I suffer you?"}, {"s": 143867, "e": 145067, "t": "bring him unto me."}, {"s": 145067, "e": 152400, "t": "And they brought him unto him: and when he saw him, straightway the spirit tare him; and he fell on the ground, and wallowed foaming."}, {"s": 152400, "e": 156533, "t": "And he asked his father, How long is it ago since this came unto him?"}, {"s": 156533, "e": 158267, "t": "And he said, Of a child."}, {"s": 158267, "e": 167067, "t": "And ofttimes it hath cast him into the fire, and into the waters, to destroy him: but if thou canst do any thing, have compassion on us, and help us."}, {"s": 167067, "e": 173067, "t": "Jesus said unto him, If thou canst believe, all things are possible to him that believeth."}, {"s": 173067, "e": 181333, "t": "And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief."}, {"s": 181333, "e": 192400, "t": "When Jesus saw that the people came running together, he rebuked the foul spirit, saying unto him, Thou dumb and deaf spirit, I charge thee, come out of him, and enter no more into him."}, {"s": 192400, "e": 201867, "t": "And the spirit cried, and rent him sore, and came out of him: and he was as one dead; insomuch that many said, He is dead."}, {"s": 201867, "e": 206667, "t": "But Jesus took him by the hand, and lifted him up; and he arose."}, {"s": 206667, "e": 212667, "t": "And when he was come into the house, his disciples asked him privately, Why could not we cast him out?"}, {"s": 212667, "e": 217867, "t": "And he said unto them, This kind can come forth by nothing, but by prayer and fasting."}, {"s": 217867, "e": 223467, "t": "And they departed thence, and passed through Galilee; and he would not that any man should know it."}, {"s": 223467, "e": 233200, "t": "For he taught his disciples, and said unto them, The Son of man is delivered into the hands of men, and they shall kill him; and after that he is killed, he shall rise the third day."}, {"s": 233200, "e": 237200, "t": "But they understood not that saying, and were afraid to ask him."}, {"s": 237200, "e": 244933, "t": "And he came to Capernaum: and being in the house he asked them, What was it that ye disputed among yourselves by the way?"}, {"s": 244933, "e": 250400, "t": "But they held their peace: for by the way they had disputed among themselves, who should be the greatest."}, {"s": 250400, "e": 259733, "t": "And he sat down, and called the twelve, and saith unto them, If any man desire to be first, the same shall be last of all, and servant of all."}, {"s": 259733, "e": 274933, "t": "And he took a child, and set him in the midst of them: and when he had taken him in his arms, he said unto them, Whosoever shall receive one of such children in my name, receiveth me: and whosoever shall receive me, receiveth not me, but him that sent me."}, {"s": 274933, "e": 285867, "t": "And John answered him, saying, Master, we saw one casting out devils in thy name, and he followeth not us: and we forbad him, because he followeth not us."}, {"s": 285867, "e": 294800, "t": "But Jesus said, Forbid him not: for there is no man which shall do a miracle in my name, that can lightly speak evil of me."}, {"s": 294800, "e": 298000, "t": "For he that is not against us is on our part."}, {"s": 298000, "e": 307333, "t": "For whosoever shall give you a cup of water to drink in my name, because ye belong to Christ, verily I say unto you, he shall not lose his reward."}, {"s": 307333, "e": 316133, "t": "And whosoever shall offend one of these little ones that believe in me, it is better for him that a millstone were hanged about his neck, and he were cast into the sea."}, {"s": 316133, "e": 329333, "t": "And if thy hand offend thee, cut it off: it is better for thee to enter into life maimed, than having two hands to go into hell, into the fire that never shall be quenched: Where their worm dieth not, and the fire is not quenched."}, {"s": 329333, "e": 342800, "t": "And if thy foot offend thee, cut it off: it is better for thee to enter halt into life, than having two feet to be cast into hell, into the fire that never shall be quenched: Where their worm dieth not, and the fire is not quenched."}, {"s": 342800, "e": 355467, "t": "And if thine eye offend thee, pluck it out: it is better for thee to enter into the kingdom of God with one eye, than having two eyes to be cast into hell fire: Where their worm dieth not, and the fire is not quenched."}, {"s": 355467, "e": 361200, "t": "For every one shall be salted with fire, and every sacrifice shall be salted with salt."}, {"s": 361200, "e": 366400, "t": "Salt is good: but if the salt have lost his saltness, wherewith will ye season it?"}, {"s": 366400, "e": 369867, "t": "Have salt in yourselves, and have peace one with another."}],a=document.getElementById('a'),t=document.getElementById('t');
