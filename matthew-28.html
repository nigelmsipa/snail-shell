<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>matthew-28</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
   line-height:1.7;font-size:1.15rem}
 header{position:sticky;top:0;background:var(--bg);padding:.6rem 1rem;
   border-bottom:1px solid #ddd5c7;box-shadow:0 2px 8px rgba(0,0,0,.05)}
 audio{width:100%}
 main{max-width:42rem;margin:0 auto;padding:1.2rem 1.1rem 40vh}
 h1{font-size:1.1rem;color:var(--dim);font-weight:600;margin:.2rem 0 1rem}
 .s{cursor:pointer;border-radius:.25rem;padding:.02em 0;transition:background .12s}
 .s:hover{background:#eadfc8}
 .s.active{background:var(--hi);box-shadow:0 0 0 .15em var(--hi)}
 .spd{margin-top:.45rem;font-size:.85rem;color:var(--dim)}
 .spd button{font:inherit;margin:0 .12rem;padding:.18rem .55rem;border:1px solid #ccc3b2;
   background:#fbf7ee;color:var(--fg);border-radius:.4rem;cursor:pointer}
 .spd button.on{background:var(--hi);border-color:#e0c050}
</style></head><body>
<header><audio id="a" src="matthew-28.opus" controls preload="metadata"></audio>
<div class="spd">Speed:
 <button data-r="1" class="on">1&times;</button><button data-r="1.25">1.25&times;</button>
 <button data-r="1.5">1.5&times;</button><button data-r="2">2&times;</button></div></header>
<main><h1>matthew-28</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 2667, "t": "Matthew, Chapter Twenty-Eight."}, {"s": 2667, "e": 10667, "t": "In the end of the sabbath, as it began to dawn toward the first day of the week, came Mary Magdalene and the other Mary to see the sepulchre."}, {"s": 10667, "e": 19733, "t": "And, behold, there was a great earthquake: for the angel of the Lord descended from heaven, and came and rolled back the stone from the door, and sat upon it."}, {"s": 19733, "e": 27600, "t": "His countenance was like lightning, and his raiment white as snow: And for fear of him the keepers did shake, and became as dead men."}, {"s": 27600, "e": 34533, "t": "And the angel answered and said unto the women, Fear not ye: for I know that ye seek Jesus, which was crucified."}, {"s": 34533, "e": 38000, "t": "He is not here: for he is risen, as he said."}, {"s": 38000, "e": 40800, "t": "Come, see the place where the Lord lay."}, {"s": 40800, "e": 50933, "t": "And go quickly, and tell his disciples that he is risen from the dead; and, behold, he goeth before you into Galilee; there shall ye see him: lo, I have told you."}, {"s": 50933, "e": 57600, "t": "And they departed quickly from the sepulchre with fear and great joy; and did run to bring his disciples word."}, {"s": 57600, "e": 62667, "t": "And as they went to tell his disciples, behold, Jesus met them, saying, All hail."}, {"s": 62667, "e": 66267, "t": "And they came and held him by the feet, and worshipped him."}, {"s": 66267, "e": 74000, "t": "Then said Jesus unto them, Be not afraid: go tell my brethren that they go into Galilee, and there shall they see me."}, {"s": 74000, "e": 80933, "t": "Now when they were going, behold, some of the watch came into the city, and shewed unto the chief priests all the things that were done."}, {"s": 80933, "e": 92000, "t": "And when they were assembled with the elders, and had taken counsel, they gave large money unto the soldiers, Saying, Say ye, His disciples came by night, and stole him away while we slept."}, {"s": 92000, "e": 96800, "t": "And if this come to the governor's ears, we will persuade him, and secure you."}, {"s": 96800, "e": 103200, "t": "So they took the money, and did as they were taught: and this saying is commonly reported among the Jews until this day."}, {"s": 103200, "e": 108800, "t": "Then the eleven disciples went away into Galilee, into a mountain where Jesus had appointed them."}, {"s": 108800, "e": 112667, "t": "And when they saw him, they worshipped him: but some doubted."}, {"s": 112667, "e": 118400, "t": "And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth."}, {"s": 118400, "e": 134267, "t": "Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world."}, {"s": 134267, "e": 135067, "t": "Amen."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
