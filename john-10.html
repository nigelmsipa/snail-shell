<style>

<main><h1>john-10</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1600, "t": "John, Chapter Ten."}, {"s": 1600, "e": 11200, "t": "Verily, verily, I say unto you, He that entereth not by the door into the sheepfold, but climbeth up some other way, the same is a thief and a robber."}, {"s": 11200, "e": 14800, "t": "But he that entereth in by the door is the shepherd of the sheep."}, {"s": 14800, "e": 21333, "t": "To him the porter openeth; and the sheep hear his voice: and he calleth his own sheep by name, and leadeth them out."}, {"s": 21333, "e": 28133, "t": "And when he putteth forth his own sheep, he goeth before them, and the sheep follow him: for they know his voice."}, {"s": 28133, "e": 33600, "t": "And a stranger will they not follow, but will flee from him: for they know not the voice of strangers."}, {"s": 33600, "e": 39733, "t": "This parable spake Jesus unto them: but they understood not what things they were which he spake unto them."}, {"s": 39733, "e": 46133, "t": "Then said Jesus unto them again, Verily, verily, I say unto you, I am the door of the sheep."}, {"s": 46133, "e": 51467, "t": "All that ever came before me are thieves and robbers: but the sheep did not hear them."}, {"s": 51467, "e": 57467, "t": "I am the door: by me if any man enter in, he shall be saved, and shall go in and out, and find pasture."}, {"s": 57467, "e": 67200, "t": "The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly."}, {"s": 67200, "e": 70800, "t": "I am the good shepherd: the good shepherd giveth his life for the sheep."}, {"s": 70800, "e": 81600, "t": "But he that is an hireling, and not the shepherd, whose own the sheep are not, seeth the wolf coming, and leaveth the sheep, and fleeth: and the wolf catcheth them, and scattereth the sheep."}, {"s": 81600, "e": 85733, "t": "The hireling fleeth, because he is an hireling, and careth not for the sheep."}, {"s": 85733, "e": 89467, "t": "I am the good shepherd, and know my sheep, and am known of mine."}, {"s": 89467, "e": 95333, "t": "As the Father knoweth me, even so know I the Father: and I lay down my life for the sheep."}, {"s": 95333, "e": 102933, "t": "And other sheep I have, which are not of this fold: them also I must bring, and they shall hear my voice; and there shall be one fold, and one shepherd."}, {"s": 102933, "e": 108533, "t": "Therefore doth my Father love me, because I lay down my life, that I might take it again."}, {"s": 108533, "e": 111867, "t": "No man taketh it from me, but I lay it down of myself."}, {"s": 111867, "e": 115467, "t": "I have power to lay it down, and I have power to take it again."}, {"s": 115467, "e": 118667, "t": "This commandment have I received of my Father."}, {"s": 118667, "e": 122533, "t": "There was a division therefore again among the Jews for these sayings."}, {"s": 122533, "e": 127733, "t": "And many of them said, He hath a devil, and is mad; why hear ye him?"}, {"s": 127733, "e": 131600, "t": "Others said, These are not the words of him that hath a devil."}, {"s": 131600, "e": 134133, "t": "Can a devil open the eyes of the blind?"}, {"s": 134133, "e": 138133, "t": "And it was at Jerusalem the feast of the dedication, and it was winter."}, {"s": 138133, "e": 141067, "t": "And Jesus walked in the temple in Solomon's porch."}, {"s": 141067, "e": 147067, "t": "Then came the Jews round about him, and said unto him, How long dost thou make us to doubt?"}, {"s": 147067, "e": 150000, "t": "If thou be the Christ, tell us plainly."}, {"s": 150000, "e": 158000, "t": "Jesus answered them, I told you, and ye believed not: the works that I do in my Father's name, they bear witness of me."}, {"s": 158000, "e": 162133, "t": "But ye believe not, because ye are not of my sheep, as I said unto you."}, {"s": 162133, "e": 172000, "t": "My sheep hear my voice, and I know them, and they follow me: And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand."}, {"s": 172000, "e": 178400, "t": "My Father, which gave them me, is greater than all; and no man is able to pluck them out of my Father's hand."}, {"s": 178400, "e": 180667, "t": "I and my Father are one."}, {"s": 180667, "e": 183733, "t": "Then the Jews took up stones again to stone him."}, {"s": 183733, "e": 190800, "t": "Jesus answered them, Many good works have I shewed you from my Father; for which of those works do ye stone me?"}, {"s": 190800, "e": 199867, "t": "The Jews answered him, saying, For a good work we stone thee not; but for blasphemy; and because that thou, being a man, makest thyself God."}, {"s": 199867, "e": 204267, "t": "Jesus answered them, Is it not written in your law, I said, Ye are gods?"}, {"s": 204267, "e": 218667, "t": "If he called them gods, unto whom the word of God came, and the scripture cannot be broken; Say ye of him, whom the Father hath sanctified, and sent into the world, Thou blasphemest; because I said, I am the Son of God?"}, {"s": 218667, "e": 222133, "t": "If I do not the works of my Father, believe me not."}, {"s": 222133, "e": 230800, "t": "But if I do, though ye believe not me, believe the works: that ye may know, and believe, that the Father is in me, and I in him."}, {"s": 230800, "e": 241200, "t": "Therefore they sought again to take him: but he escaped out of their hand, And went away again beyond Jordan into the place where John at first baptized; and there he abode."}, {"s": 241200, "e": 248933, "t": "And many resorted unto him, and said, John did no miracle: but all things that John spake of this man were true."}, {"s": 248933, "e": 250533, "t": "And many believed on him there."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
