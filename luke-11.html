<script>
const S=[{"s": 0, "e": 1333, "t": "Luke, Chapter Eleven."}, {"s": 1333, "e": 12133, "t": "And it came to pass, that, as he was praying in a certain place, when he ceased, one of his disciples said unto him, Lord, teach us to pray, as John also taught his disciples."}, {"s": 12133, "e": 18800, "t": "And he said unto them, When ye pray, say, Our Father which art in heaven, Hallowed be thy name."}, {"s": 18800, "e": 20533, "t": "Thy kingdom come."}, {"s": 20533, "e": 23733, "t": "Thy will be done, as in heaven, so in earth."}, {"s": 23733, "e": 26533, "t": "Give us day by day our daily bread."}, {"s": 26533, "e": 30933, "t": "And forgive us our sins; for we also forgive every one that is indebted to us."}, {"s": 30933, "e": 34800, "t": "And lead us not into temptation; but deliver us from evil."}, {"s": 34800, "e": 48000, "t": "And he said unto them, Which of you shall have a friend, and shall go unto him at midnight, and say unto him, Friend, lend me three loaves; For a friend of mine in his journey is come to me, and I have nothing to set before him?"}, {"s": 48000, "e": 56133, "t": "And he from within shall answer and say, Trouble me not: the door is now shut, and my children are with me in bed; I cannot rise and give thee."}, {"s": 56133, "e": 66000, "t": "I say unto you, Though he will not rise and give him, because he is his friend, yet because of his importunity he will rise and give him as many as he needeth."}, {"s": 66000, "e": 74000, "t": "And I say unto you, Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you."}, {"s": 74000, "e": 80400, "t": "For every one that asketh receiveth; and he that seeketh findeth; and to him that knocketh it shall be opened."}, {"s": 80400, "e": 85867, "t": "If a son shall ask bread of any of you that is a father, will he give him a stone?"}, {"s": 85867, "e": 89333, "t": "or if he ask a fish, will he for a fish give him a serpent?"}, {"s": 89333, "e": 92267, "t": "Or if he shall ask an egg, will he offer him a scorpion?"}, {"s": 92267, "e": 101467, "t": "If ye then, being evil, know how to give good gifts unto your children: how much more shall your heavenly Father give the Holy Spirit to them that ask him?"}, {"s": 101467, "e": 104533, "t": "And he was casting out a devil, and it was dumb."}, {"s": 104533, "e": 109867, "t": "And it came to pass, when the devil was gone out, the dumb spake; and the people wondered."}, {"s": 109867, "e": 114533, "t": "But some of them said, He casteth out devils through Beelzebub the chief of the devils."}, {"s": 114533, "e": 118000, "t": "And others, tempting him, sought of him a sign from heaven."}, {"s": 118000, "e": 128133, "t": "But he, knowing their thoughts, said unto them, Every kingdom divided against itself is brought to desolation; and a house divided against a house falleth."}, {"s": 128133, "e": 132800, "t": "If Satan also be divided against himself, how shall his kingdom stand?"}, {"s": 132800, "e": 136133, "t": "because ye say that I cast out devils through Beelzebub."}, {"s": 136133, "e": 141333, "t": "And if I by Beelzebub cast out devils, by whom do your sons cast them out?"}, {"s": 141333, "e": 143733, "t": "therefore shall they be your judges."}, {"s": 143733, "e": 148667, "t": "But if I with the finger of God cast out devils, no doubt the kingdom of God is come upon you."}, {"s": 148667, "e": 162400, "t": "When a strong man armed keepeth his palace, his goods are in peace: But when a stronger than he shall come upon him, and overcome him, he taketh from him all his armour wherein he trusted, and divideth his spoils."}, {"s": 162400, "e": 166800, "t": "He that is not with me is against me: and he that gathereth not with me scattereth."}, {"s": 166800, "e": 175867, "t": "When the unclean spirit is gone out of a man, he walketh through dry places, seeking rest; and finding none, he saith, I will return unto my house whence I came out."}, {"s": 175867, "e": 179067, "t": "And when he cometh, he findeth it swept and garnished."}, {"s": 179067, "e": 189733, "t": "Then goeth he, and taketh to him seven other spirits more wicked than himself; and they enter in, and dwell there: and the last state of that man is worse than the first."}, {"s": 189733, "e": 200800, "t": "And it came to pass, as he spake these things, a certain woman of the company lifted up her voice, and said unto him, Blessed is the womb that bare thee, and the paps which thou hast sucked."}, {"s": 200800, "e": 206000, "t": "But he said, Yea rather, blessed are they that hear the word of God, and keep it."}, {"s": 206000, "e": 216933, "t": "And when the people were gathered thick together, he began to say, This is an evil generation: they seek a sign; and there shall no sign be given it, but the sign of Jonas the prophet."}, {"s": 216933, "e": 223067, "t": "For as Jonas was a sign unto the Ninevites, so shall also the Son of man be to this generation."}, {"s": 223067, "e": 236400, "t": "The queen of the south shall rise up in the judgment with the men of this generation, and condemn them: for she came from the utmost parts of the earth to hear the wisdom of Solomon; and, behold, a greater than Solomon is here."}, {"s": 236400, "e": 247467, "t": "The men of Nineve shall rise up in the judgment with this generation, and shall condemn it: for they repented at the preaching of Jonas; and, behold, a greater than Jonas is here."}, {"s": 247467, "e": 257333, "t": "No man, when he hath lighted a candle, putteth it in a secret place, neither under a bushel, but on a candlestick, that they which come in may see the light."}, {"s": 257333, "e": 268533, "t": "The light of the body is the eye: therefore when thine eye is single, thy whole body also is full of light; but when thine eye is evil, thy body also is full of darkness."}, {"s": 268533, "e": 272667, "t": "Take heed therefore that the light which is in thee be not darkness."}, {"s": 272667, "e": 281867, "t": "If thy whole body therefore be full of light, having no part dark, the whole shall be full of light, as when the bright shining of a candle doth give thee light."}, {"s": 281867, "e": 288133, "t": "And as he spake, a certain Pharisee besought him to dine with him: and he went in, and sat down to meat."}, {"s": 288133, "e": 292533, "t": "And when the Pharisee saw it, he marvelled that he had not first washed before dinner."}, {"s": 292533, "e": 301467, "t": "And the Lord said unto him, Now do ye Pharisees make clean the outside of the cup and the platter; but your inward part is full of ravening and wickedness."}, {"s": 301467, "e": 306800, "t": "Ye fools, did not he that made that which is without make that which is within also?"}, {"s": 306800, "e": 312133, "t": "But rather give alms of such things as ye have; and, behold, all things are clean unto you."}, {"s": 312133, "e": 314533, "t": "But woe unto you, Pharisees!"}, {"s": 314533, "e": 323600, "t": "for ye tithe mint and rue and all manner of herbs, and pass over judgment and the love of God: these ought ye to have done, and not to leave the other undone."}, {"s": 323600, "e": 325600, "t": "Woe unto you, Pharisees!"}, {"s": 325600, "e": 330000, "t": "for ye love the uppermost seats in the synagogues, and greetings in the markets."}, {"s": 330000, "e": 333733, "t": "Woe unto you, scribes and Pharisees, hypocrites!"}, {"s": 333733, "e": 339467, "t": "for ye are as graves which appear not, and the men that walk over them are not aware of them."}, {"s": 339467, "e": 346133, "t": "Then answered one of the lawyers, and said unto him, Master, thus saying thou reproachest us also."}, {"s": 346133, "e": 349867, "t": "And he said, Woe unto you also, ye lawyers!"}, {"s": 349867, "e": 356800, "t": "for ye lade men with burdens grievous to be borne, and ye yourselves touch not the burdens with one of your fingers."}, {"s": 356800, "e": 358267, "t": "Woe unto you!"}, {"s": 358267, "e": 362400, "t": "for ye build the sepulchres of the prophets, and your fathers killed them."}, {"s": 362400, "e": 369200, "t": "Truly ye bear witness that ye allow the deeds of your fathers: for they indeed killed them, and ye build their sepulchres."}, {"s": 369200, "e": 386000, "t": "Therefore also said the wisdom of God, I will send them prophets and apostles, and some of them they shall slay and persecute: That the blood of all the prophets, which was shed from the foundation of the world, may be required of this generation; From the blood of Abel unto the blood of Zacharias,"}, {"s": 386000, "e": 393200, "t": "which perished between the altar and the temple: verily I say unto you, It shall be required of this generation."}, {"s": 393200, "e": 394933, "t": "Woe unto you, lawyers!"}, {"s": 394933, "e": 402000, "t": "for ye have taken away the key of knowledge: ye entered not in yourselves, and them that were entering in ye hindered."}, {"s": 402000, "e": 416133, "t": "And as he said these things unto them, the scribes and the Pharisees began to urge him vehemently, and to provoke him to speak of many things: Laying wait for him, and seeking to catch something out of his mouth, that they might accuse him."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});

 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
