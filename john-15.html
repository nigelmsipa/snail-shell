<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>john-15</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
   line-height:1.7;font-size:1.15rem}
 header{position:sticky;top:0;background:var(--bg);padding:.6rem 1rem;
   border-bottom:1px solid #ddd5c7;box-shadow:0 2px 8px rgba(0,0,0,.05)}
 audio{width:100%}
 main{max-width:42rem;margin:0 auto;padding:1.2rem 1.1rem 40vh}
 h1{font-size:1.1rem;color:var(--dim);font-weight:600;margin:.2rem 0 1rem}
 .s{cursor:pointer;border-radius:.25rem;padding:.02em 0;transition:background .12s}
 .s:hover{background:#eadfc8}
 .s.active{background:var(--hi);box-shadow:0 0 0 .15em var(--hi)}
 .spd{margin-top:.45rem;font-size:.85rem;color:var(--dim)}
 .spd button{font:inherit;margin:0 .12rem;padding:.18rem .55rem;border:1px solid #ccc3b2;
   background:#fbf7ee;color:var(--fg);border-radius:.4rem;cursor:pointer}
 .spd button.on{background:var(--hi);border-color:#e0c050}
</style></head><body>
<header><audio id="a" src="john-15.opus" controls preload="metadata"></audio>
<div class="spd">Speed:
 <button data-r="1" class="on">1&times;</button><button data-r="1.25">1.25&times;</button>
 <button data-r="1.5">1.5&times;</button><button data-r="2">2&times;</button></div></header>
<main><h1>john-15</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 2533, "t": "John, Chapter Fifteen."}, {"s": 2533, "e": 5600, "t": "I am the true vine, and my Father is the husbandman."}, {"s": 5600, "e": 13867, "t": "Every branch in me that beareth not fruit he taketh away: and every branch that beareth fruit, he purgeth it, that it may bring forth more fruit."}, {"s": 13867, "e": 17733, "t": "Now ye are clean through the word which I have spoken unto you."}, {"s": 17733, "e": 20000, "t": "Abide in me, and I in you."}, {"s": 20000, "e": 27333, "t": "As the branch cannot bear fruit of itself, except it abide in the vine; no more can ye, except ye abide in me."}, {"s": 27333, "e": 36533, "t": "I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing."}, {"s": 36533, "e": 44400, "t": "If a man abide not in me, he is cast forth as a branch, and is withered; and men gather them, and cast them into the fire, and they are burned."}, {"s": 44400, "e": 51467, "t": "If ye abide in me, and my words abide in you, ye shall ask what ye will, and it shall be done unto you."}, {"s": 51467, "e": 57200, "t": "Herein is my Father glorified, that ye bear much fruit; so shall ye be my disciples."}, {"s": 57200, "e": 62533, "t": "As the Father hath loved me, so have I loved you: continue ye in my love."}, {"s": 62533, "e": 70933, "t": "If ye keep my commandments, ye shall abide in my love; even as I have kept my Father's commandments, and abide in his love."}, {"s": 70933, "e": 76800, "t": "These things have I spoken unto you, that my joy might remain in you, and that your joy might be full."}, {"s": 76800, "e": 81200, "t": "This is my commandment, That ye love one another, as I have loved you."}, {"s": 81200, "e": 86133, "t": "Greater love hath no man than this, that a man lay down his life for his friends."}, {"s": 86133, "e": 89467, "t": "Ye are my friends, if ye do whatsoever I command you."}, {"s": 89467, "e": 100000, "t": "Henceforth I call you not servants; for the servant knoweth not what his lord doeth: but I have called you friends; for all things that I have heard of my Father I have made known unto you."}, {"s": 100000, "e": 112267, "t": "Ye have not chosen me, but I have chosen you, and ordained you, that ye should go and bring forth fruit, and that your fruit should remain: that whatsoever ye shall ask of the Father in my name, he may give it you."}, {"s": 112267, "e": 116133, "t": "These things I command you, that ye love one another."}, {"s": 116133, "e": 121067, "t": "If the world hate you, ye know that it hated me before it hated you."}, {"s": 121067, "e": 130000, "t": "If ye were of the world, the world would love his own: but because ye are not of the world, but I have chosen you out of the world, therefore the world hateth you."}, {"s": 130000, "e": 134933, "t": "Remember the word that I said unto you, The servant is not greater than his lord."}, {"s": 134933, "e": 141467, "t": "If they have persecuted me, they will also persecute you; if they have kept my saying, they will keep yours also."}, {"s": 141467, "e": 147333, "t": "But all these things will they do unto you for my name's sake, because they know not him that sent me."}, {"s": 147333, "e": 154933, "t": "If I had not come and spoken unto them, they had not had sin: but now they have no cloke for their sin."}, {"s": 154933, "e": 157867, "t": "He that hateth me hateth my Father also."}, {"s": 157867, "e": 167200, "t": "If I had not done among them the works which none other man did, they had not had sin: but now have they both seen and hated both me and my Father."}, {"s": 167200, "e": 173867, "t": "But this cometh to pass, that the word might be fulfilled that is written in their law, They hated me without a cause."}, {"s": 173867, "e": 187333, "t": "But when the Comforter is come, whom I will send unto you from the Father, even the Spirit of truth, which proceedeth from the Father, he shall testify of me: And ye also shall bear witness, because ye have been with me from the beginning."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
