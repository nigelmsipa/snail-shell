hey were come to the multitude, there came to him a certain man, kneeling down to him, and saying, Lord, have mercy on my son: for he is lunatick, and sore vexed: for ofttimes he falleth into the fire, and oft into the water."}, {"s": 104400, "e": 108000, "t": "And I brought him to thy disciples, and they could not cure him."}, {"s": 108000, "e": 114133, "t": "Then Jesus answered and said, O faithless and perverse generation, how long shall I be with you?"}, {"s": 114133, "e": 116133, "t": "how long shall I suffer you?"}, {"s": 116133, "e": 117867, "t": "bring him hither to me."}, {"s": 117867, "e": 123733, "t": "And Jesus rebuked the devil; and he departed out of him: and the child was cured from that very hour."}, {"s": 123733, "e": 129600, "t": "Then came the disciples to Jesus apart, and said, Why could not we cast him out?"}, {"s": 129600, "e": 144000, "t": "And Jesus said unto them, Because of your unbelief: for verily I say unto you, If ye have faith as a grain of mustard seed, ye shall say unto this mountain, Remove hence to yonder place; and it shall remove; and nothing shall be impossible unto you."}, {"s": 144000, "e": 147733, "t": "Howbeit this kind goeth not out but by prayer and fasting."}, {"s": 147733, "e": 158933, "t": "And while they abode in Galilee, Jesus said unto them, The Son of man shall be betrayed into the hands of men: And they shall kill him, and the third day he shall be raised again."}, {"s": 158933, "e": 160267, "t": "And they were exceeding sorry."}, {"s": 160267, "e": 168267, "t": "And when they were come to Capernaum, they that received tribute money came to Peter, and said, Doth not your master pay tribute?"}, {"s": 168267, "e": 170667, "t": "He saith, Yes."}, {"s": 170667, "e": 176267, "t": "And when he was come into the house, Jesus prevented him, saying, What thinkest thou, Simon?"}, {"s": 176267, "e": 179067, "t": "of whom do the kings of the earth take custom or tribute?"}, {"s": 179067, "e": 181733, "t": "of their own children, or of strangers?"}, {"s": 181733, "e": 184533, "t": "Peter saith unto him, Of strangers."}, {"s": 184533, "e": 188667, "t": "Jesus saith unto him, Then are the children free."}, {"s": 188667, "e": 204400, "t": "Notwithstanding, lest we should offend them, go thou to the sea, and cast an hook, and take up the fish that first cometh up; and when thou hast opened his mouth, thou shalt find a piece of money: that take, and give unto them for me and thee."}],a=document.getElementById('a'),t=document.getElementById('t');
