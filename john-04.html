<main><h1>john-04</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1467, "t": "John, Chapter Four."}, {"s": 1467, "e": 14533, "t": "When therefore the Lord knew how the Pharisees had heard that Jesus made and baptized more disciples than John, (Though Jesus himself baptized not, but his disciples,) He left Judaea, and departed again into Galilee."}, {"s": 14533, "e": 17067, "t": "And he must needs go through Samaria."}, {"s": 17067, "e": 24533, "t": "Then cometh he to a city of Samaria, which is called Sychar, near to the parcel of ground that Jacob gave to his son Joseph."}, {"s": 24533, "e": 26800, "t": "Now Jacob's well was there."}, {"s": 26800, "e": 33333, "t": "Jesus therefore, being wearied with his journey, sat thus on the well: and it was about the sixth hour."}, {"s": 33333, "e": 39600, "t": "There cometh a woman of Samaria to draw water: Jesus saith unto her, Give me to drink."}, {"s": 39600, "e": 50667, "t": "(For his disciples were gone away unto the city to buy meat.) Then saith the woman of Samaria unto him, How is it that thou, being a Jew, askest drink of me, which am a woman of Samaria?"}, {"s": 50667, "e": 53733, "t": "for the Jews have no dealings with the Samaritans."}, {"s": 53733, "e": 65467, "t": "Jesus answered and said unto her, If thou knewest the gift of God, and who it is that saith to thee, Give me to drink; thou wouldest have asked of him, and he would have given thee living water."}, {"s": 65467, "e": 72667, "t": "The woman saith unto him, Sir, thou hast nothing to draw with, and the well is deep: from whence then hast thou that living water?"}, {"s": 72667, "e": 80000, "t": "Art thou greater than our father Jacob, which gave us the well, and drank thereof himself, and his children, and his cattle?"}, {"s": 80000, "e": 95200, "t": "Jesus answered and said unto her, Whosoever drinketh of this water shall thirst again: But whosoever drinketh of the water that I shall give him shall never thirst; but the water that I shall give him shall be in him a well of water springing up into everlasting life."}, {"s": 95200, "e": 101867, "t": "The woman saith unto him, Sir, give me this water, that I thirst not, neither come hither to draw."}, {"s": 101867, "e": 107067, "t": "Jesus saith unto her, Go, call thy husband, and come hither."}, {"s": 107067, "e": 110400, "t": "The woman answered and said, I have no husband."}, {"s": 110400, "e": 121867, "t": "Jesus said unto her, Thou hast well said, I have no husband: For thou hast had five husbands; and he whom thou now hast is not thy husband: in that saidst thou truly."}, {"s": 121867, "e": 126933, "t": "The woman saith unto him, Sir, I perceive that thou art a prophet."}, {"s": 126933, "e": 133867, "t": "Our fathers worshipped in this mountain; and ye say, that in Jerusalem is the place where men ought to worship."}, {"s": 133867, "e": 143467, "t": "Jesus saith unto her, Woman, believe me, the hour cometh, when ye shall neither in this mountain, nor yet at Jerusalem, worship the Father."}, {"s": 143467, "e": 149733, "t": "Ye worship ye know not what: we know what we worship: for salvation is of the Jews."}, {"s": 149733, "e": 158933, "t": "But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth: for the Father seeketh such to worship him."}, {"s": 158933, "e": 164133, "t": "God is a Spirit: and they that worship him must worship him in spirit and in truth."}, {"s": 164133, "e": 171333, "t": "The woman saith unto him, I know that Messias cometh, which is called Christ: when he is come, he will tell us all things."}, {"s": 171333, "e": 176133, "t": "Jesus saith unto her, I that speak unto thee am he."}, {"s": 176133, "e": 183333, "t": "And upon this came his disciples, and marvelled that he talked with the woman: yet no man said, What seekest thou?"}, {"s": 183333, "e": 185333, "t": "or, Why talkest thou with her?"}, {"s": 185333, "e": 196667, "t": "The woman then left her waterpot, and went her way into the city, and saith to the men, Come, see a man, which told me all things that ever I did: is not this the Christ?"}, {"s": 196667, "e": 199867, "t": "Then they went out of the city, and came unto him."}, {"s": 199867, "e": 203733, "t": "In the mean while his disciples prayed him, saying, Master, eat."}, {"s": 203733, "e": 207333, "t": "But he said unto them, I have meat to eat that ye know not of."}, {"s": 207333, "e": 212133, "t": "Therefore said the disciples one to another, Hath any man brought him ought to eat?"}, {"s": 212133, "e": 218533, "t": "Jesus saith unto them, My meat is to do the will of him that sent me, and to finish his work."}, {"s": 218533, "e": 222933, "t": "Say not ye, There are yet four months, and then cometh harvest?"}, {"s": 222933, "e": 229733, "t": "behold, I say unto you, Lift up your eyes, and look on the fields; for they are white already to harvest."}, {"s": 229733, "e": 237733, "t": "And he that reapeth receiveth wages, and gathereth fruit unto life eternal: that both he that soweth and he that reapeth may rejoice together."}, {"s": 237733, "e": 242800, "t": "And herein is that saying true, One soweth, and another reapeth."}, {"s": 242800, "e": 249467, "t": "I sent you to reap that whereon ye bestowed no labour: other men laboured, and ye are entered into their labours."}, {"s": 249467, "e": 257200, "t": "And many of the Samaritans of that city believed on him for the saying of the woman, which testified, He told me all that ever I did."}, {"s": 257200, "e": 264000, "t": "So when the Samaritans were come unto him, they besought him that he would tarry with them: and he abode there two days."}, {"s": 264000, "e": 277200, "t": "And many more believed because of his own word; And said unto the woman, Now we believe, not because of thy saying: for we have heard him ourselves, and know that this is indeed the Christ, the Saviour of the world."}, {"s": 277200, "e": 281067, "t": "Now after two days he departed thence, and went into Galilee."}, {"s": 281067, "e": 285467, "t": "For Jesus himself testified, that a prophet hath no honour in his own country."}, {"s": 285467, "e": 294933, "t": "Then when he was come into Galilee, the Galilaeans received him, having seen all the things that he did at Jerusalem at the feast: for they also went unto the feast."}, {"s": 294933, "e": 299333, "t": "So Jesus came again into Cana of Galilee, where he made the water wine."}, {"s": 299333, "e": 303333, "t": "And there was a certain nobleman, whose son was sick at Capernaum."}, {"s": 303333, "e": 313600, "t": "When he heard that Jesus was come out of Judaea into Galilee, he went unto him, and besought him that he would come down, and heal his son: for he was at the point of death."}, {"s": 313600, "e": 319733, "t": "Then said Jesus unto him, Except ye see signs and wonders, ye will not believe."}, {"s": 319733, "e": 325333, "t": "The nobleman saith unto him, Sir, come down ere my child die."}, {"s": 325333, "e": 329333, "t": "Jesus saith unto him, Go thy way; thy son liveth."}, {"s": 329333, "e": 334267, "t": "And the man believed the word that Jesus had spoken unto him, and he went his way."}, {"s": 334267, "e": 340667, "t": "And as he was now going down, his servants met him, and told him, saying, Thy son liveth."}, {"s": 340667, "e": 344400, "t": "Then inquired he of them the hour when he began to amend."}, {"s": 344400, "e": 349067, "t": "And they said unto him, Yesterday at the seventh hour the fever left him."}, {"s": 349067, "e": 357067, "t": "So the father knew that it was at the same hour, in the which Jesus said unto him, Thy son liveth: and himself believed, and his whole house."}, {"s": 357067, "e": 362533, "t": "This is again the second miracle that Jesus did, when he was come out of Judaea into Galilee."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
