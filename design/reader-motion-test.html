<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<title>Reader motion test — seam-breath + rail cross-fade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Sans:wght@600&display=swap" rel="stylesheet">
<style>
 :root{
   --paper:#fcfcfc; --ink:#3a3120; --read:#a39b8b; --metadata:#9a9388; --faint:#c9c3b7;
   --gold:hsl(42 40% 50%); --gold-wash:#e9d2a2;
   --display:"DM Serif Display",Georgia,serif; --serif:"Source Serif 4",Georgia,serif;
   --sans:"IBM Plex Sans",system-ui,sans-serif;
 }
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{height:100%;background:#12100c;overflow:hidden}
 body{display:grid;place-items:center;font-family:var(--sans)}
 #scaler{width:1920px;height:1080px;transform-origin:center center}

 .board{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--paper);border-radius:5px}
 .board::before{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.42;
   background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/></svg>")}

 /* left rail */
 .rail{position:absolute;top:80px;bottom:80px;left:100px;width:210px;z-index:4;
   border-right:1px solid #e6e2d8;display:flex;flex-direction:column;justify-content:space-between;
   padding-right:35px;text-align:right}
 .rail .bk{font-family:var(--display);font-weight:400;font-size:70px;line-height:.92;color:var(--ink)}
 .rail .scene .kick{display:block;font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.17em;
   text-transform:uppercase;color:var(--metadata)}
 .rail .scene .name{display:block;font-family:var(--serif);font-size:32px;color:var(--ink);margin-top:8px;
   transition:opacity .5s ease}      /* soft cross-fade */
 .rail .scene .name.fading{opacity:0}

 /* offset scripture column */
 .viewport{position:absolute;top:0;bottom:0;left:410px;width:1220px;overflow:hidden;z-index:2}
 #col{position:absolute;left:0;right:0;will-change:transform}
 .w{font-family:var(--serif);font-size:54px;line-height:1.42;color:var(--ink)}
 .v{font-family:var(--sans);font-size:.38em;font-weight:600;color:var(--gold);vertical-align:.85em;margin-right:.1em}
 .w.read{color:var(--read)}
 .w.read .v{color:var(--faint)}
 .w.active{color:#2c2722;background:linear-gradient(var(--gold-wash),var(--gold-wash));
   background-size:100% 62%;background-position:0 82%;background-repeat:no-repeat;
   box-decoration-break:clone;border-radius:3px;padding:0 .05em}
 .seam{height:150px}                 /* the "breath" between pericopes */

 /* top fade — finished text vanishes before the rail's top */
 .fade-top{position:absolute;top:0;left:330px;right:0;height:270px;z-index:3;
   background:linear-gradient(var(--paper),var(--paper) 48%,rgba(252,252,252,0))}

 .cap{position:absolute;left:20px;bottom:14px;z-index:5;font-family:var(--sans);font-size:13px;
   letter-spacing:.04em;color:var(--faint)}
</style></head>
<body>
<div id="scaler"><div class="board">
  <div class="rail">
    <div class="bk">Gen.<br>1</div>
    <div class="scene"><span class="kick">Scene · now</span><span class="name" id="sceneName">The Primal State</span></div>
  </div>
  <div class="fade-top"></div>
  <div class="viewport"><div id="col"></div></div>
  <div class="cap">motion test · seam-breath + rail cross-fade · loops</div>
</div></div>

<script>
// scenes → verses → words. Seams between scenes get a breath of whitespace.
const SCENES = [
  {name:"The Primal State", verses:[
    [1,"In the beginning God created the heaven and the earth."],
    [2,"And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters."],
  ]},
  {name:"Day One · Light", verses:[
    [3,"And God said, Let there be light: and there was light."],
    [4,"And God saw the light, that it was good: and God divided the light from the darkness."],
    [5,"And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day."],
  ]},
  {name:"Day Two · The Firmament", verses:[
    [6,"And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters."],
    [7,"And God made the firmament, and divided the waters which were under the firmament from the waters which were above the firmament: and it was so."],
    [8,"And God called the firmament Heaven. And the evening and the morning were the second day."],
  ]},
];

// Build word stream + DOM
const col = document.getElementById('col');
const words = [];   // {el, scene, dur}
SCENES.forEach((sc, si)=>{
  if(si>0){ const seam=document.createElement('div'); seam.className='seam'; col.appendChild(seam); }
  sc.verses.forEach(([vn, text])=>{
    const toks = text.split(' ');
    toks.forEach((tok, ti)=>{
      const span=document.createElement('span'); span.className='w';
      if(ti===0){ const v=document.createElement('span'); v.className='v'; v.textContent=vn; span.appendChild(v); }
      span.appendChild(document.createTextNode(tok+' '));
      col.appendChild(span);
      words.push({el:span, scene:si, dur:220 + tok.replace(/[^A-Za-z]/g,'').length*46});
    });
  });
});

const READING_Y = 620;           // active word parks here
let start=null, scrollY=0, curScene=-1;
const nameEl=document.getElementById('sceneName');

// precompute cumulative start times
let acc=0; words.forEach(w=>{ w.t=acc; acc+=w.dur; });
const TOTAL = acc + 1400;        // small tail before loop

function fit(){
  const s=Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById('scaler').style.transform=`scale(${s})`;
}
addEventListener('resize', fit); fit();

function frame(ts){
  if(start===null) start=ts;
  let e=(ts-start)%TOTAL;

  // active word = last word whose start time <= e
  let ai=0; for(let i=0;i<words.length;i++){ if(words[i].t<=e) ai=i; else break; }

  words.forEach((w,i)=>{
    w.el.classList.toggle('read', i<ai);
    w.el.classList.toggle('active', i===ai);
  });

  // scene cross-fade
  const sc=words[ai].scene;
  if(sc!==curScene){
    curScene=sc;
    nameEl.classList.add('fading');
    setTimeout(()=>{ nameEl.textContent=SCENES[sc].name; nameEl.classList.remove('fading'); },260);
  }

  // teleprompter scroll: keep active word at READING_Y, smoothed (EMA)
  const a=words[ai].el;
  const target = READING_Y - (a.offsetTop + a.offsetHeight/2);
  scrollY += (target - scrollY) * 0.08;
  col.style.transform=`translateY(${scrollY}px)`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
