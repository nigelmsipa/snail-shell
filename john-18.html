igh priest that same year."}, {"s": 93333, "e": 100267, "t": "Now Caiaphas was he, which gave counsel to the Jews, that it was expedient that one man should die for the people."}, {"s": 100267, "e": 110400, "t": "And Simon Peter followed Jesus, and so did another disciple: that disciple was known unto the high priest, and went in with Jesus into the palace of the high priest."}, {"s": 110400, "e": 112533, "t": "But Peter stood at the door without."}, {"s": 112533, "e": 120133, "t": "Then went out that other disciple, which was known unto the high priest, and spake unto her that kept the door, and brought in Peter."}, {"s": 120133, "e": 126267, "t": "Then saith the damsel that kept the door unto Peter, Art not thou also one of this man's disciples?"}, {"s": 126267, "e": 127867, "t": "He saith, I am not."}, {"s": 127867, "e": 137867, "t": "And the servants and officers stood there, who had made a fire of coals; for it was cold: and they warmed themselves: and Peter stood with them, and warmed himself."}, {"s": 137867, "e": 141733, "t": "The high priest then asked Jesus of his disciples, and of his doctrine."}, {"s": 141733, "e": 152400, "t": "Jesus answered him, I spake openly to the world; I ever taught in the synagogue, and in the temple, whither the Jews always resort; and in secret have I said nothing."}, {"s": 152400, "e": 154400, "t": "Why askest thou me?"}, {"s": 154400, "e": 160000, "t": "ask them which heard me, what I have said unto them: behold, they know what I said."}, {"s": 160000, "e": 168667, "t": "And when he had thus spoken, one of the officers which stood by struck Jesus with the palm of his hand, saying, Answerest thou the high priest so?"}, {"s": 168667, "e": 174667, "t": "Jesus answered him, If I have spoken evil, bear witness of the evil: but if well, why smitest thou me?"}, {"s": 174667, "e": 178533, "t": "Now Annas had sent him bound unto Caiaphas the high priest."}, {"s": 178533, "e": 180800, "t": "And Simon Peter stood and warmed himself."}, {"s": 180800, "e": 185600, "t": "They said therefore unto him, Art not thou also one of his disciples?"}, {"s": 185600, "e": 188400, "t": "He denied it, and said, I am not."}, {"s": 188400, "e": 196800, "t": "One of the servants of the high priest, being his kinsman whose ear Peter cut off, saith, Did not I see thee in the garden with him?"}, {"s": 196800, "e": 201200, "t": "Peter then denied again: and immediately the cock crew."}, {"s": 201200, "e": 212667, "t": "Then led they Jesus from Caiaphas unto the hall of judgment: and it was early; and they themselves went not into the judgment hall, lest they should be defiled; but that they might eat the passover."}, {"s": 212667, "e": 217867, "t": "Pilate then went out unto them, and said, What accusation bring ye against this man?"}, {"s": 217867, "e": 224667, "t": "They answered and said unto him, If he were not a malefactor, we would not have delivered him up unto thee."}, {"s": 224667, "e": 229600, "t": "Then said Pilate unto them, Take ye him, and judge him according to your law."}, {"s": 229600, "e": 240133, "t": "The Jews therefore said unto him, It is not lawful for us to put any man to death: That the saying of Jesus might be fulfilled, which he spake, signifying what death he should die."}, {"s": 240133, "e": 247333, "t": "Then Pilate entered into the judgment hall again, and called Jesus, and said unto him, Art thou the King of the Jews?"}, {"s": 247333, "e": 252933, "t": "Jesus answered him, Sayest thou this thing of thyself, or did others tell it thee of me?"}, {"s": 252933, "e": 256000, "t": "Pilate answered, Am I a Jew?"}, {"s": 256000, "e": 261200, "t": "Thine own nation and the chief priests have delivered thee unto me: what hast thou done?"}, {"s": 261200, "e": 274267, "t": "Jesus answered, My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews: but now is my kingdom not from hence."}, {"s": 274267, "e": 277733, "t": "Pilate therefore said unto him, Art thou a king then?"}, {"s": 277733, "e": 280933, "t": "Jesus answered, Thou sayest that I am a king."}, {"s": 280933, "e": 287600, "t": "To this end was I born, and for this cause came I into the world, that I should bear witness unto the truth."}, {"s": 287600, "e": 290533, "t": "Every one that is of the truth heareth my voice."}, {"s": 290533, "e": 293333, "t": "Pilate saith unto him, What is truth?"}, {"s": 293333, "e": 299733, "t": "And when he had said this, he went out again unto the Jews, and saith unto them, I find in him no fault at all."}, {"s": 299733, "e": 308533, "t": "But ye have a custom, that I should release unto you one at the passover: will ye therefore that I release unto you the King of the Jews?"}, {"s": 308533, "e": 312933, "t": "Then cried they all again, saying, Not this man, but Barabbas."}, {"s": 312933, "e": 314533, "t": "Now Barabbas was a robber."}],a=document.getElementById('a'),t=document.getElementById('t');
