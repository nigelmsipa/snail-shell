<script>
const S=[{"s": 0, "e": 1467, "t": "Mark, Chapter Eleven."}, {"s": 1467, "e": 20400, "t": "And when they came nigh to Jerusalem, unto Bethphage and Bethany, at the mount of Olives, he sendeth forth two of his disciples, And saith unto them, Go your way into the village over against you: and as soon as ye be entered into it, ye shall find a colt tied, whereon never man sat; loose him,"}, {"s": 20400, "e": 21333, "t": "and bring him."}, {"s": 21333, "e": 25067, "t": "And if any man say unto you, Why do ye this?"}, {"s": 25067, "e": 30400, "t": "say ye that the Lord hath need of him; and straightway he will send him hither."}, {"s": 30400, "e": 36933, "t": "And they went their way, and found the colt tied by the door without in a place where two ways met; and they loose him."}, {"s": 36933, "e": 41467, "t": "And certain of them that stood there said unto them, What do ye, loosing the colt?"}, {"s": 41467, "e": 45867, "t": "And they said unto them even as Jesus had commanded: and they let them go."}, {"s": 45867, "e": 51467, "t": "And they brought the colt to Jesus, and cast their garments on him; and he sat upon him."}, {"s": 51467, "e": 58800, "t": "And many spread their garments in the way: and others cut down branches off the trees, and strawed them in the way."}, {"s": 58800, "e": 72800, "t": "And they that went before, and they that followed, cried, saying, Hosanna; Blessed is he that cometh in the name of the Lord: Blessed be the kingdom of our father David, that cometh in the name of the Lord: Hosanna in the highest."}, {"s": 72800, "e": 84400, "t": "And Jesus entered into Jerusalem, and into the temple: and when he had looked round about upon all things, and now the eventide was come, he went out unto Bethany with the twelve."}, {"s": 84400, "e": 100400, "t": "And on the morrow, when they were come from Bethany, he was hungry: And seeing a fig tree afar off having leaves, he came, if haply he might find any thing thereon: and when he came to it, he found nothing but leaves; for the time of figs was not yet."}, {"s": 100400, "e": 105867, "t": "And Jesus answered and said unto it, No man eat fruit of thee hereafter for ever."}, {"s": 105867, "e": 107467, "t": "And his disciples heard it."}, {"s": 107467, "e": 122533, "t": "And they come to Jerusalem: and Jesus went into the temple, and began to cast out them that sold and bought in the temple, and overthrew the tables of the moneychangers, and the seats of them that sold doves; And would not suffer that any man should carry any vessel through the temple."}, {"s": 122533, "e": 129200, "t": "And he taught, saying unto them, Is it not written, My house shall be called of all nations the house of prayer?"}, {"s": 129200, "e": 131600, "t": "but ye have made it a den of thieves."}, {"s": 131600, "e": 139600, "t": "And the scribes and chief priests heard it, and sought how they might destroy him: for they feared him, because all the people was astonished at his doctrine."}, {"s": 139600, "e": 142800, "t": "And when even was come, he went out of the city."}, {"s": 142800, "e": 148133, "t": "And in the morning, as they passed by, they saw the fig tree dried up from the roots."}, {"s": 148133, "e": 155333, "t": "And Peter calling to remembrance saith unto him, Master, behold, the fig tree which thou cursedst is withered away."}, {"s": 155333, "e": 158933, "t": "And Jesus answering saith unto them, Have faith in God."}, {"s": 158933, "e": 175467, "t": "For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed, and be thou cast into the sea; and shall not doubt in his heart, but shall believe that those things which he saith shall come to pass; he shall have whatsoever he saith."}, {"s": 175467, "e": 183600, "t": "Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them."}, {"s": 183600, "e": 192533, "t": "And when ye stand praying, forgive, if ye have ought against any: that your Father also which is in heaven may forgive you your trespasses."}, {"s": 192533, "e": 198133, "t": "But if ye do not forgive, neither will your Father which is in heaven forgive your trespasses."}, {"s": 198133, "e": 210000, "t": "And they come again to Jerusalem: and as he was walking in the temple, there come to him the chief priests, and the scribes, and the elders, And say unto him, By what authority doest thou these things?"}, {"s": 210000, "e": 213200, "t": "and who gave thee this authority to do these things?"}, {"s": 213200, "e": 223467, "t": "And Jesus answered and said unto them, I will also ask of you one question, and answer me, and I will tell you by what authority I do these things."}, {"s": 223467, "e": 226800, "t": "The baptism of John, was it from heaven, or of men?"}, {"s": 226800, "e": 227467, "t": "answer me."}, {"s": 227467, "e": 234533, "t": "And they reasoned with themselves, saying, If we shall say, From heaven; he will say, Why then did ye not believe him?"}, {"s": 234533, "e": 242267, "t": "But if we shall say, Of men; they feared the people: for all men counted John, that he was a prophet indeed."}, {"s": 242267, "e": 245867, "t": "And they answered and said unto Jesus, We cannot tell."}, {"s": 245867, "e": 252000, "t": "And Jesus answering saith unto them, Neither do I tell you by what authority I do these things."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
