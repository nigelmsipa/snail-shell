<script>
const S=[{"s": 0, "e": 2400, "t": "Matthew, Chapter Nineteen."}, {"s": 2400, "e": 14000, "t": "And it came to pass, that when Jesus had finished these sayings, he departed from Galilee, and came into the coasts of Judaea beyond Jordan; And great multitudes followed him; and he healed them there."}, {"s": 14000, "e": 21467, "t": "The Pharisees also came unto him, tempting him, and saying unto him, Is it lawful for a man to put away his wife for every cause?"}, {"s": 21467, "e": 35867, "t": "And he answered and said unto them, Have ye not read, that he which made them at the beginning made them male and female, And said, For this cause shall a man leave father and mother, and shall cleave to his wife: and they twain shall be one flesh?"}, {"s": 35867, "e": 38933, "t": "Wherefore they are no more twain, but one flesh."}, {"s": 38933, "e": 42933, "t": "What therefore God hath joined together, let not man put asunder."}, {"s": 42933, "e": 48667, "t": "They say unto him, Why did Moses then command to give a writing of divorcement, and to put her away?"}, {"s": 48667, "e": 56267, "t": "He saith unto them, Moses because of the hardness of your hearts suffered you to put away your wives: but from the beginning it was not so."}, {"s": 56267, "e": 67467, "t": "And I say unto you, Whosoever shall put away his wife, except it be for fornication, and shall marry another, committeth adultery: and whoso marrieth her which is put away doth commit adultery."}, {"s": 67467, "e": 73733, "t": "His disciples say unto him, If the case of the man be so with his wife, it is not good to marry."}, {"s": 73733, "e": 79200, "t": "But he said unto them, All men cannot receive this saying, save they to whom it is given."}, {"s": 79200, "e": 90933, "t": "For there are some eunuchs, which were so born from their mother's womb: and there are some eunuchs, which were made eunuchs of men: and there be eunuchs, which have made themselves eunuchs for the kingdom of heaven's sake."}, {"s": 90933, "e": 94133, "t": "He that is able to receive it, let him receive it."}, {"s": 94133, "e": 100933, "t": "Then were there brought unto him little children, that he should put his hands on them, and pray: and the disciples rebuked them."}, {"s": 100933, "e": 107467, "t": "But Jesus said, Suffer little children, and forbid them not, to come unto me: for of such is the kingdom of heaven."}, {"s": 107467, "e": 110933, "t": "And he laid his hands on them, and departed thence."}, {"s": 110933, "e": 118000, "t": "And, behold, one came and said unto him, Good Master, what good thing shall I do, that I may have eternal life?"}, {"s": 118000, "e": 121600, "t": "And he said unto him, Why callest thou me good?"}, {"s": 121600, "e": 127867, "t": "there is none good but one, that is, God: but if thou wilt enter into life, keep the commandments."}, {"s": 127867, "e": 130000, "t": "He saith unto him, Which?"}, {"s": 130000, "e": 143600, "t": "Jesus said, Thou shalt do no murder, Thou shalt not commit adultery, Thou shalt not steal, Thou shalt not bear false witness, Honour thy father and thy mother: and, Thou shalt love thy neighbour as thyself."}, {"s": 143600, "e": 149733, "t": "The young man saith unto him, All these things have I kept from my youth up: what lack I yet?"}, {"s": 149733, "e": 159867, "t": "Jesus said unto him, If thou wilt be perfect, go and sell that thou hast, and give to the poor, and thou shalt have treasure in heaven: and come and follow me."}, {"s": 159867, "e": 165867, "t": "But when the young man heard that saying, he went away sorrowful: for he had great possessions."}, {"s": 165867, "e": 173467, "t": "Then said Jesus unto his disciples, Verily I say unto you, That a rich man shall hardly enter into the kingdom of heaven."}, {"s": 173467, "e": 181200, "t": "And again I say unto you, It is easier for a camel to go through the eye of a needle, than for a rich man to enter into the kingdom of God."}, {"s": 181200, "e": 187467, "t": "When his disciples heard it, they were exceedingly amazed, saying, Who then can be saved?"}, {"s": 187467, "e": 194667, "t": "But Jesus beheld them, and said unto them, With men this is impossible; but with God all things are possible."}, {"s": 194667, "e": 202800, "t": "Then answered Peter and said unto him, Behold, we have forsaken all, and followed thee; what shall we have therefore?"}, {"s": 202800, "e": 216533, "t": "And Jesus said unto them, Verily I say unto you, That ye which have followed me, in the regeneration when the Son of man shall sit in the throne of his glory, ye also shall sit upon twelve thrones, judging the twelve tribes of Israel."}, {"s": 216533, "e": 228667, "t": "And every one that hath forsaken houses, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for my name's sake, shall receive an hundredfold, and shall inherit everlasting life."}, {"s": 228667, "e": 233867, "t": "But many that are first shall be last; and the last shall be first."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
