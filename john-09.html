<script>
const S=[{"s": 0, "e": 1600, "t": "John, Chapter Nine."}, {"s": 1600, "e": 5867, "t": "And as Jesus passed by, he saw a man which was blind from his birth."}, {"s": 5867, "e": 11867, "t": "And his disciples asked him, saying, Master, who did sin, this man, or his parents, that he was born blind?"}, {"s": 11867, "e": 19333, "t": "Jesus answered, Neither hath this man sinned, nor his parents: but that the works of God should be made manifest in him."}, {"s": 19333, "e": 25067, "t": "I must work the works of him that sent me, while it is day: the night cometh, when no man can work."}, {"s": 25067, "e": 28400, "t": "As long as I am in the world, I am the light of the world."}, {"s": 28400, "e": 46800, "t": "When he had thus spoken, he spat on the ground, and made clay of the spittle, and he anointed the eyes of the blind man with the clay, And said unto him, Go, wash in the pool of Siloam, (which is by interpretation, Sent.) He went his way therefore, and washed, and came seeing."}, {"s": 46800, "e": 53733, "t": "The neighbours therefore, and they which before had seen him that he was blind, said, Is not this he that sat and begged?"}, {"s": 53733, "e": 59600, "t": "Some said, This is he: others said, He is like him: but he said, I am he."}, {"s": 59600, "e": 63200, "t": "Therefore said they unto him, How were thine eyes opened?"}, {"s": 63200, "e": 74267, "t": "He answered and said, A man that is called Jesus made clay, and anointed mine eyes, and said unto me, Go to the pool of Siloam, and wash: and I went and washed, and I received sight."}, {"s": 74267, "e": 77867, "t": "Then said they unto him, Where is he?"}, {"s": 77867, "e": 79467, "t": "He said, I know not."}, {"s": 79467, "e": 82933, "t": "They brought to the Pharisees him that aforetime was blind."}, {"s": 82933, "e": 87600, "t": "And it was the sabbath day when Jesus made the clay, and opened his eyes."}, {"s": 87600, "e": 91467, "t": "Then again the Pharisees also asked him how he had received his sight."}, {"s": 91467, "e": 97200, "t": "He said unto them, He put clay upon mine eyes, and I washed, and do see."}, {"s": 97200, "e": 103867, "t": "Therefore said some of the Pharisees, This man is not of God, because he keepeth not the sabbath day."}, {"s": 103867, "e": 107467, "t": "Others said, How can a man that is a sinner do such miracles?"}, {"s": 107467, "e": 109333, "t": "And there was a division among them."}, {"s": 109333, "e": 114133, "t": "They say unto the blind man again, What sayest thou of him, that he hath opened thine eyes?"}, {"s": 114133, "e": 116933, "t": "He said, He is a prophet."}, {"s": 116933, "e": 126267, "t": "But the Jews did not believe concerning him, that he had been blind, and received his sight, until they called the parents of him that had received his sight."}, {"s": 126267, "e": 130933, "t": "And they asked them, saying, Is this your son, who ye say was born blind?"}, {"s": 130933, "e": 132933, "t": "how then doth he now see?"}, {"s": 132933, "e": 148400, "t": "His parents answered them and said, We know that this is our son, and that he was born blind: But by what means he now seeth, we know not; or who hath opened his eyes, we know not: he is of age; ask him: he shall speak for himself."}, {"s": 148400, "e": 158533, "t": "These words spake his parents, because they feared the Jews: for the Jews had agreed already, that if any man did confess that he was Christ, he should be put out of the synagogue."}, {"s": 158533, "e": 161733, "t": "Therefore said his parents, He is of age; ask him."}, {"s": 161733, "e": 168667, "t": "Then again called they the man that was blind, and said unto him, Give God the praise: we know that this man is a sinner."}, {"s": 168667, "e": 177867, "t": "He answered and said, Whether he be a sinner or no, I know not: one thing I know, that, whereas I was blind, now I see."}, {"s": 177867, "e": 181600, "t": "Then said they to him again, What did he to thee?"}, {"s": 181600, "e": 183333, "t": "how opened he thine eyes?"}, {"s": 183333, "e": 188533, "t": "He answered them, I have told you already, and ye did not hear: wherefore would ye hear it again?"}, {"s": 188533, "e": 190533, "t": "will ye also be his disciples?"}, {"s": 190533, "e": 196533, "t": "Then they reviled him, and said, Thou art his disciple; but we are Moses' disciples."}, {"s": 196533, "e": 202133, "t": "We know that God spake unto Moses: as for this fellow, we know not from whence he is."}, {"s": 202133, "e": 210933, "t": "The man answered and said unto them, Why herein is a marvellous thing, that ye know not from whence he is, and yet he hath opened mine eyes."}, {"s": 210933, "e": 219067, "t": "Now we know that God heareth not sinners: but if any man be a worshipper of God, and doeth his will, him he heareth."}, {"s": 219067, "e": 224267, "t": "Since the world began was it not heard that any man opened the eyes of one that was born blind."}, {"s": 224267, "e": 227200, "t": "If this man were not of God, he could do nothing."}, {"s": 227200, "e": 232667, "t": "They answered and said unto him, Thou wast altogether born in sins, and dost thou teach us?"}, {"s": 232667, "e": 234267, "t": "And they cast him out."}, {"s": 234267, "e": 241333, "t": "Jesus heard that they had cast him out; and when he had found him, he said unto him, Dost thou believe on the Son of God?"}, {"s": 241333, "e": 245867, "t": "He answered and said, Who is he, Lord, that I might believe on him?"}, {"s": 245867, "e": 251200, "t": "And Jesus said unto him, Thou hast both seen him, and it is he that talketh with thee."}, {"s": 251200, "e": 253333, "t": "And he said, Lord, I believe."}, {"s": 253333, "e": 255067, "t": "And he worshipped him."}, {"s": 255067, "e": 263600, "t": "And Jesus said, For judgment I am come into this world, that they which see not might see; and that they which see might be made blind."}, {"s": 263600, "e": 269733, "t": "And some of the Pharisees which were with him heard these words, and said unto him, Are we blind also?"}, {"s": 269733, "e": 279200, "t": "Jesus said unto them, If ye were blind, ye should have no sin: but now ye say, We see; therefore your sin remaineth."}],a=document.getElementById('a'),t=document.getElementById('t');
