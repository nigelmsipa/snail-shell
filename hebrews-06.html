<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>hebrews-06</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
   line-height:1.7;font-size:1.15rem}
 header{position:sticky;top:0;background:var(--bg);padding:.6rem 1rem;
   border-bottom:1px solid #ddd5c7;box-shadow:0 2px 8px rgba(0,0,0,.05)}
 audio{width:100%}
 main{max-width:42rem;margin:0 auto;padding:1.2rem 1.1rem 40vh}
 h1{font-size:1.1rem;color:var(--dim);font-weight:600;margin:.2rem 0 1rem}
 .s{cursor:pointer;border-radius:.25rem;padding:.02em 0;transition:background .12s}
 .s:hover{background:#eadfc8}
 .s.active{background:var(--hi);box-shadow:0 0 0 .15em var(--hi)}
 .spd{margin-top:.45rem;font-size:.85rem;color:var(--dim)}
 .spd button{font:inherit;margin:0 .12rem;padding:.18rem .55rem;border:1px solid #ccc3b2;
   background:#fbf7ee;color:var(--fg);border-radius:.4rem;cursor:pointer}
 .spd button.on{background:var(--hi);border-color:#e0c050}
</style></head><body>
<header><audio id="a" src="hebrews-06.opus" controls preload="metadata"></audio>
<div class="spd">Speed:
 <button data-r="1" class="on">1&times;</button><button data-r="1.25">1.25&times;</button>
 <button data-r="1.5">1.5&times;</button><button data-r="2">2&times;</button></div></header>
<main><h1>hebrews-06</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1733, "t": "Hebrews, Chapter Six."}, {"s": 1733, "e": 20000, "t": "Therefore leaving the principles of the doctrine of Christ, let us go on unto perfection; not laying again the foundation of repentance from dead works, and of faith toward God, Of the doctrine of baptisms, and of laying on of hands, and of resurrection of the dead, and of eternal judgment."}, {"s": 20000, "e": 22133, "t": "And this will we do, if God permit."}, {"s": 22133, "e": 37867, "t": "For it is impossible for those who were once enlightened, and have tasted of the heavenly gift, and were made partakers of the Holy Ghost, And have tasted the good word of God, and the powers of the world to come, If they shall fall away, to renew them again unto repentance;"}, {"s": 37867, "e": 43600, "t": "seeing they crucify to themselves the Son of God afresh, and put him to an open shame."}, {"s": 43600, "e": 57467, "t": "For the earth which drinketh in the rain that cometh oft upon it, and bringeth forth herbs meet for them by whom it is dressed, receiveth blessing from God: But that which beareth thorns and briers is rejected, and is nigh unto cursing; whose end is to be burned."}, {"s": 57467, "e": 64133, "t": "But, beloved, we are persuaded better things of you, and things that accompany salvation, though we thus speak."}, {"s": 64133, "e": 74000, "t": "For God is not unrighteous to forget your work and labour of love, which ye have shewed toward his name, in that ye have ministered to the saints, and do minister."}, {"s": 74000, "e": 86400, "t": "And we desire that every one of you do shew the same diligence to the full assurance of hope unto the end: That ye be not slothful, but followers of them who through faith and patience inherit the promises."}, {"s": 86400, "e": 97467, "t": "For when God made promise to Abraham, because he could swear by no greater, he sware by himself, Saying, Surely blessing I will bless thee, and multiplying I will multiply thee."}, {"s": 97467, "e": 101467, "t": "And so, after he had patiently endured, he obtained the promise."}, {"s": 101467, "e": 107333, "t": "For men verily swear by the greater: and an oath for confirmation is to them an end of all strife."}, {"s": 107333, "e": 121467, "t": "Wherein God, willing more abundantly to shew unto the heirs of promise the immutability of his counsel, confirmed it by an oath: That by two immutable things, in which it was impossible for God to lie, we might have a strong consolation,"}, {"s": 121467, "e": 140400, "t": "who have fled for refuge to lay hold upon the hope set before us: Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil; Whither the forerunner is for us entered, even Jesus, made an high priest for ever after the order of Melchisedec."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
