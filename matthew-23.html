<script>
const S=[{"s": 0, "e": 2400, "t": "Matthew, Chapter Twenty-Three."}, {"s": 2400, "e": 18800, "t": "Then spake Jesus to the multitude, and to his disciples, Saying, The scribes and the Pharisees sit in Moses' seat: All therefore whatsoever they bid you observe, that observe and do; but do not ye after their works: for they say, and do not."}, {"s": 18800, "e": 26933, "t": "For they bind heavy burdens and grievous to be borne, and lay them on men's shoulders; but they themselves will not move them with one of their fingers."}, {"s": 26933, "e": 44133, "t": "But all their works they do for to be seen of men: they make broad their phylacteries, and enlarge the borders of their garments, And love the uppermost rooms at feasts, and the chief seats in the synagogues, And greetings in the markets, and to be called of men, Rabbi, Rabbi."}, {"s": 44133, "e": 50533, "t": "But be not ye called Rabbi: for one is your Master, even Christ; and all ye are brethren."}, {"s": 50533, "e": 55733, "t": "And call no man your father upon the earth: for one is your Father, which is in heaven."}, {"s": 55733, "e": 59867, "t": "Neither be ye called masters: for one is your Master, even Christ."}, {"s": 59867, "e": 63067, "t": "But he that is greatest among you shall be your servant."}, {"s": 63067, "e": 69333, "t": "And whosoever shall exalt himself shall be abased; and he that shall humble himself shall be exalted."}, {"s": 69333, "e": 73600, "t": "But woe unto you, scribes and Pharisees, hypocrites!"}, {"s": 73600, "e": 81333, "t": "for ye shut up the kingdom of heaven against men: for ye neither go in yourselves, neither suffer ye them that are entering to go in."}, {"s": 81333, "e": 84400, "t": "Woe unto you, scribes and Pharisees, hypocrites!"}, {"s": 84400, "e": 91333, "t": "for ye devour widows' houses, and for a pretence make long prayer: therefore ye shall receive the greater damnation."}, {"s": 91333, "e": 94800, "t": "Woe unto you, scribes and Pharisees, hypocrites!"}, {"s": 94800, "e": 102933, "t": "for ye compass sea and land to make one proselyte, and when he is made, ye make him twofold more the child of hell than yourselves."}, {"s": 102933, "e": 113333, "t": "Woe unto you, ye blind guides, which say, Whosoever shall swear by the temple, it is nothing; but whosoever shall swear by the gold of the temple, he is a debtor!"}, {"s": 113333, "e": 120533, "t": "Ye fools and blind: for whether is greater, the gold, or the temple that sanctifieth the gold?"}, {"s": 120533, "e": 128667, "t": "And, Whosoever shall swear by the altar, it is nothing; but whosoever sweareth by the gift that is upon it, he is guilty."}, {"s": 128667, "e": 135333, "t": "Ye fools and blind: for whether is greater, the gift, or the altar that sanctifieth the gift?"}, {"s": 135333, "e": 140933, "t": "Whoso therefore shall swear by the altar, sweareth by it, and by all things thereon."}, {"s": 140933, "e": 145600, "t": "And whoso shall swear by the temple, sweareth by it, and by him that dwelleth therein."}, {"s": 145600, "e": 151600, "t": "And he that shall swear by heaven, sweareth by the throne of God, and by him that sitteth thereon."}, {"s": 151600, "e": 155200, "t": "Woe unto you, scribes and Pharisees, hypocrites!"}, {"s": 155200, "e": 165733, "t": "for ye pay tithe of mint and anise and cummin, and have omitted the weightier matters of the law, judgment, mercy, and faith: these ought ye to have done, and not to leave the other undone."}, {"s": 165733, "e": 169067, "t": "Ye blind guides, which strain at a gnat, and swallow a camel."}, {"s": 169067, "e": 172000, "t": "Woe unto you, scribes and Pharisees, hypocrites!"}, {"s": 172000, "e": 178667, "t": "for ye make clean the outside of the cup and of the platter, but within they are full of extortion and excess."}, {"s": 178667, "e": 185333, "t": "Thou blind Pharisee, cleanse first that which is within the cup and platter, that the outside of them may be clean also."}, {"s": 185333, "e": 188533, "t": "Woe unto you, scribes and Pharisees, hypocrites!"}, {"s": 188533, "e": 197733, "t": "for ye are like unto whited sepulchres, which indeed appear beautiful outward, but are within full of dead men's bones, and of all uncleanness."}, {"s": 197733, "e": 205067, "t": "Even so ye also outwardly appear righteous unto men, but within ye are full of hypocrisy and iniquity."}, {"s": 205067, "e": 208400, "t": "Woe unto you, scribes and Pharisees, hypocrites!"}, {"s": 208400, "e": 220133, "t": "because ye build the tombs of the prophets, and garnish the sepulchres of the righteous, And say, If we had been in the days of our fathers, we would not have been partakers with them in the blood of the prophets."}, {"s": 220133, "e": 225467, "t": "Wherefore ye be witnesses unto yourselves, that ye are the children of them which killed the prophets."}, {"s": 225467, "e": 228267, "t": "Fill ye up then the measure of your fathers."}, {"s": 228267, "e": 233333, "t": "Ye serpents, ye generation of vipers, how can ye escape the damnation of hell?"}, {"s": 233333, "e": 249600, "t": "Wherefore, behold, I send unto you prophets, and wise men, and scribes: and some of them ye shall kill and crucify; and some of them shall ye scourge in your synagogues, and persecute them from city to city: That upon you may come all the righteous blood shed upon the earth,"}, {"s": 249600, "e": 256400, "t": "from the blood of righteous Abel unto the blood of Zacharias son of Barachias, whom ye slew between the temple and the altar."}, {"s": 256400, "e": 261200, "t": "Verily I say unto you, All these things shall come upon this generation."}, {"s": 261200, "e": 273733, "t": "O Jerusalem, Jerusalem, thou that killest the prophets, and stonest them which are sent unto thee, how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not!"}, {"s": 273733, "e": 276533, "t": "Behold, your house is left unto you desolate."}, {"s": 276533, "e": 283600, "t": "For I say unto you, Ye shall not see me henceforth, till ye shall say, Blessed is he that cometh in the name of the Lord."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
