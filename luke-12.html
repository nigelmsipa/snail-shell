<script>
const S=[{"s": 0, "e": 2000, "t": "Luke, Chapter Twelve."}, {"s": 2000, "e": 15600, "t": "In the mean time, when there were gathered together an innumerable multitude of people, insomuch that they trode one upon another, he began to say unto his disciples first of all, Beware ye of the leaven of the Pharisees, which is hypocrisy."}, {"s": 15600, "e": 22133, "t": "For there is nothing covered, that shall not be revealed; neither hid, that shall not be known."}, {"s": 22133, "e": 31867, "t": "Therefore whatsoever ye have spoken in darkness shall be heard in the light; and that which ye have spoken in the ear in closets shall be proclaimed upon the housetops."}, {"s": 31867, "e": 39200, "t": "And I say unto you my friends, Be not afraid of them that kill the body, and after that have no more that they can do."}, {"s": 39200, "e": 49333, "t": "But I will forewarn you whom ye shall fear: Fear him, which after he hath killed hath power to cast into hell; yea, I say unto you, Fear him."}, {"s": 49333, "e": 55067, "t": "Are not five sparrows sold for two farthings, and not one of them is forgotten before God?"}, {"s": 55067, "e": 58400, "t": "But even the very hairs of your head are all numbered."}, {"s": 58400, "e": 62933, "t": "Fear not therefore: ye are of more value than many sparrows."}, {"s": 62933, "e": 76400, "t": "Also I say unto you, Whosoever shall confess me before men, him shall the Son of man also confess before the angels of God: But he that denieth me before men shall be denied before the angels of God."}, {"s": 76400, "e": 85600, "t": "And whosoever shall speak a word against the Son of man, it shall be forgiven him: but unto him that blasphemeth against the Holy Ghost it shall not be forgiven."}, {"s": 85600, "e": 98533, "t": "And when they bring you unto the synagogues, and unto magistrates, and powers, take ye no thought how or what thing ye shall answer, or what ye shall say: For the Holy Ghost shall teach you in the same hour what ye ought to say."}, {"s": 98533, "e": 104267, "t": "And one of the company said unto him, Master, speak to my brother, that he divide the inheritance with me."}, {"s": 104267, "e": 109067, "t": "And he said unto him, Man, who made me a judge or a divider over you?"}, {"s": 109067, "e": 118000, "t": "And he said unto them, Take heed, and beware of covetousness: for a man's life consisteth not in the abundance of the things which he possesseth."}, {"s": 118000, "e": 129200, "t": "And he spake a parable unto them, saying, The ground of a certain rich man brought forth plentifully: And he thought within himself, saying, What shall I do, because I have no room where to bestow my fruits?"}, {"s": 129200, "e": 137733, "t": "And he said, This will I do: I will pull down my barns, and build greater; and there will I bestow all my fruits and my goods."}, {"s": 137733, "e": 144800, "t": "And I will say to my soul, Soul, thou hast much goods laid up for many years; take thine ease, eat, drink, and be merry."}, {"s": 144800, "e": 154267, "t": "But God said unto him, Thou fool, this night thy soul shall be required of thee: then whose shall those things be, which thou hast provided?"}, {"s": 154267, "e": 158933, "t": "So is he that layeth up treasure for himself, and is not rich toward God."}, {"s": 158933, "e": 167867, "t": "And he said unto his disciples, Therefore I say unto you, Take no thought for your life, what ye shall eat; neither for the body, what ye shall put on."}, {"s": 167867, "e": 171333, "t": "The life is more than meat, and the body is more than raiment."}, {"s": 171333, "e": 179733, "t": "Consider the ravens: for they neither sow nor reap; which neither have storehouse nor barn; and God feedeth them: how much more are ye better than the fowls?"}, {"s": 179733, "e": 184267, "t": "And which of you with taking thought can add to his stature one cubit?"}, {"s": 184267, "e": 190133, "t": "If ye then be not able to do that thing which is least, why take ye thought for the rest?"}, {"s": 190133, "e": 200267, "t": "Consider the lilies how they grow: they toil not, they spin not; and yet I say unto you, that Solomon in all his glory was not arrayed like one of these."}, {"s": 200267, "e": 210667, "t": "If then God so clothe the grass, which is to day in the field, and to morrow is cast into the oven; how much more will he clothe you, O ye of little faith?"}, {"s": 210667, "e": 216933, "t": "And seek not ye what ye shall eat, or what ye shall drink, neither be ye of doubtful mind."}, {"s": 216933, "e": 224000, "t": "For all these things do the nations of the world seek after: and your Father knoweth that ye have need of these things."}, {"s": 224000, "e": 229733, "t": "But rather seek ye the kingdom of God; and all these things shall be added unto you."}, {"s": 229733, "e": 233733, "t": "Fear not, little flock; for it is your Father's good pleasure to give you the kingdom."}, {"s": 233733, "e": 245467, "t": "Sell that ye have, and give alms; provide yourselves bags which wax not old, a treasure in the heavens that faileth not, where no thief approacheth, neither moth corrupteth."}, {"s": 245467, "e": 249067, "t": "For where your treasure is, there will your heart be also."}, {"s": 249067, "e": 262000, "t": "Let your loins be girded about, and your lights burning; And ye yourselves like unto men that wait for their lord, when he will return from the wedding; that when he cometh and knocketh, they may open unto him immediately."}, {"s": 262000, "e": 274667, "t": "Blessed are those servants, whom the lord when he cometh shall find watching: verily I say unto you, that he shall gird himself, and make them to sit down to meat, and will come forth and serve them."}, {"s": 274667, "e": 281600, "t": "And if he shall come in the second watch, or come in the third watch, and find them so, blessed are those servants."}, {"s": 281600, "e": 290533, "t": "And this know, that if the goodman of the house had known what hour the thief would come, he would have watched, and not have suffered his house to be broken through."}, {"s": 290533, "e": 296667, "t": "Be ye therefore ready also: for the Son of man cometh at an hour when ye think not."}, {"s": 296667, "e": 302000, "t": "Then Peter said unto him, Lord, speakest thou this parable unto us, or even to all?"}, {"s": 302000, "e": 311067, "t": "And the Lord said, Who then is that faithful and wise steward, whom his lord shall make ruler over his household, to give them their portion of meat in due season?"}, {"s": 311067, "e": 315867, "t": "Blessed is that servant, whom his lord when he cometh shall find so doing."}, {"s": 315867, "e": 320800, "t": "Of a truth I say unto you, that he will make him ruler over all that he hath."}, {"s": 320800, "e": 336933, "t": "But and if that servant say in his heart, My lord delayeth his coming; and shall begin to beat the menservants and maidens, and to eat and drink, and to be drunken; The lord of that servant will come in a day when he looketh not for him, and at an hour when he is not aware,"}, {"s": 336933, "e": 341600, "t": "and will cut him in sunder, and will appoint him his portion with the unbelievers."}, {"s": 341600, "e": 349600, "t": "And that servant, which knew his lord's will, and prepared not himself, neither did according to his will, shall be beaten with many stripes."}, {"s": 349600, "e": 355467, "t": "But he that knew not, and did commit things worthy of stripes, shall be beaten with few stripes."}, {"s": 355467, "e": 363867, "t": "For unto whomsoever much is given, of him shall be much required: and to whom men have committed much, of him they will ask the more."}, {"s": 363867, "e": 369200, "t": "I am come to send fire on the earth; and what will I, if it be already kindled?"}, {"s": 369200, "e": 374800, "t": "But I have a baptism to be baptized with; and how am I straitened till it be accomplished!"}, {"s": 374800, "e": 378133, "t": "Suppose ye that I am come to give peace on earth?"}, {"s": 378133, "e": 386667, "t": "I tell you, Nay; but rather division: For from henceforth there shall be five in one house divided, three against two, and two against three."}, {"s": 386667, "e": 398533, "t": "The father shall be divided against the son, and the son against the father; the mother against the daughter, and the daughter against the mother; the mother in law against her daughter in law, and the daughter in law against her mother in law."}, {"s": 398533, "e": 406400, "t": "And he said also to the people, When ye see a cloud rise out of the west, straightway ye say, There cometh a shower; and so it is."}, {"s": 406400, "e": 413333, "t": "And when ye see the south wind blow, ye say, There will be heat; and it cometh to pass."}, {"s": 413333, "e": 421067, "t": "Ye hypocrites, ye can discern the face of the sky and of the earth; but how is it that ye do not discern this time?"}, {"s": 421067, "e": 424667, "t": "Yea, and why even of yourselves judge ye not what is right?"}, {"s": 424667, "e": 438667, "t": "When thou goest with thine adversary to the magistrate, as thou art in the way, give diligence that thou mayest be delivered from him; lest he hale thee to the judge, and the judge deliver thee to the officer, and the officer cast thee into prison."}, {"s": 438667, "e": 444133, "t": "I tell thee, thou shalt not depart thence, till thou hast paid the very last mite."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});

 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
