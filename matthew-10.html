const S=[{"s": 0, "e": 1867, "t": "Matthew, Chapter Ten."}, {"s": 1867, "e": 12667, "t": "And when he had called unto him his twelve disciples, he gave them power against unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease."}, {"s": 12667, "e": 30133, "t": "Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother; Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"}, {"s": 30133, "e": 34800, "t": "Simon the Canaanite, and Judas Iscariot, who also betrayed him."}, {"s": 34800, "e": 46400, "t": "These twelve Jesus sent forth, and commanded them, saying, Go not into the way of the Gentiles, and into any city of the Samaritans enter ye not: But go rather to the lost sheep of the house of Israel."}, {"s": 46400, "e": 50933, "t": "And as ye go, preach, saying, The kingdom of heaven is at hand."}, {"s": 50933, "e": 58000, "t": "Heal the sick, cleanse the lepers, raise the dead, cast out devils: freely ye have received, freely give."}, {"s": 58000, "e": 68667, "t": "Provide neither gold, nor silver, nor brass in your purses, Nor scrip for your journey, neither two coats, neither shoes, nor yet staves: for the workman is worthy of his meat."}, {"s": 68667, "e": 76667, "t": "And into whatsoever city or town ye shall enter, inquire who in it is worthy; and there abide till ye go thence."}, {"s": 76667, "e": 79467, "t": "And when ye come into an house, salute it."}, {"s": 79467, "e": 86533, "t": "And if the house be worthy, let your peace come upon it: but if it be not worthy, let your peace return to you."}, {"s": 86533, "e": 95067, "t": "And whosoever shall not receive you, nor hear your words, when ye depart out of that house or city, shake off the dust of your feet."}, {"s": 95067, "e": 102933, "t": "Verily I say unto you, It shall be more tolerable for the land of Sodom and Gomorrha in the day of judgment, than for that city."}, {"s": 102933, "e": 110000, "t": "Behold, I send you forth as sheep in the midst of wolves: be ye therefore wise as serpents, and harmless as doves."}, {"s": 110000, "e": 122800, "t": "But beware of men: for they will deliver you up to the councils, and they will scourge you in their synagogues; And ye shall be brought before governors and kings for my sake, for a testimony against them and the Gentiles."}, {"s": 122800, "e": 130800, "t": "But when they deliver you up, take no thought how or what ye shall speak: for it shall be given you in that same hour what ye shall speak."}, {"s": 130800, "e": 135600, "t": "For it is not ye that speak, but the Spirit of your Father which speaketh in you."}, {"s": 135600, "e": 144400, "t": "And the brother shall deliver up the brother to death, and the father the child: and the children shall rise up against their parents, and cause them to be put to death."}, {"s": 144400, "e": 150800, "t": "And ye shall be hated of all men for my name's sake: but he that endureth to the end shall be saved."}, {"s": 150800, "e": 161467, "t": "But when they persecute you in this city, flee ye into another: for verily I say unto you, Ye shall not have gone over the cities of Israel, till the Son of man be come."}, {"s": 161467, "e": 166933, "t": "The disciple is not above his master, nor the servant above his lord."}, {"s": 166933, "e": 172000, "t": "It is enough for the disciple that he be as his master, and the servant as his lord."}, {"s": 172000, "e": 178533, "t": "If they have called the master of the house Beelzebub, how much more shall they call them of his household?"}, {"s": 178533, "e": 185333, "t": "Fear them not therefore: for there is nothing covered, that shall not be revealed; and hid, that shall not be known."}, {"s": 185333, "e": 192133, "t": "What I tell you in darkness, that speak ye in light: and what ye hear in the ear, that preach ye upon the housetops."}, {"s": 192133, "e": 201733, "t": "And fear not them which kill the body, but are not able to kill the soul: but rather fear him which is able to destroy both soul and body in hell."}, {"s": 201733, "e": 204400, "t": "Are not two sparrows sold for a farthing?"}, {"s": 204400, "e": 207600, "t": "and one of them shall not fall on the ground without your Father."}, {"s": 207600, "e": 210933, "t": "But the very hairs of your head are all numbered."}, {"s": 210933, "e": 216267, "t": "Fear ye not therefore, ye are of more value than many sparrows."}, {"s": 216267, "e": 222667, "t": "Whosoever therefore shall confess me before men, him will I confess also before my Father which is in heaven."}, {"s": 222667, "e": 229467, "t": "But whosoever shall deny me before men, him will I also deny before my Father which is in heaven."}, {"s": 229467, "e": 235333, "t": "Think not that I am come to send peace on earth: I came not to send peace, but a sword."}, {"s": 235333, "e": 243733, "t": "For I am come to set a man at variance against his father, and the daughter against her mother, and the daughter in law against her mother in law."}, {"s": 243733, "e": 246667, "t": "And a man's foes shall be they of his own household."}, {"s": 246667, "e": 255467, "t": "He that loveth father or mother more than me is not worthy of me: and he that loveth son or daughter more than me is not worthy of me."}, {"s": 255467, "e": 260800, "t": "And he that taketh not his cross, and followeth after me, is not worthy of me."}, {"s": 260800, "e": 266933, "t": "He that findeth his life shall lose it: and he that loseth his life for my sake shall find it."}, {"s": 266933, "e": 271867, "t": "He that receiveth you receiveth me, and he that receiveth me receiveth him that sent me."}, {"s": 271867, "e": 281600, "t": "He that receiveth a prophet in the name of a prophet shall receive a prophet's reward; and he that receiveth a righteous man in the name of a righteous man shall receive a righteous man's reward."}, {"s": 281600, "e": 292533, "t": "And whosoever shall give to drink unto one of these little ones a cup of cold water only in the name of a disciple, verily I say unto you, he shall in no wise lose his reward."}],a=document.getElementById('a'),t=document.getElementById('t');
