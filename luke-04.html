const S=[{"s": 0, "e": 2000, "t": "Luke, Chapter Four."}, {"s": 2000, "e": 10533, "t": "And Jesus being full of the Holy Ghost returned from Jordan, and was led by the Spirit into the wilderness, Being forty days tempted of the devil."}, {"s": 10533, "e": 16000, "t": "And in those days he did eat nothing: and when they were ended, he afterward hungered."}, {"s": 16000, "e": 20667, "t": "And the devil said unto him, If thou be the Son of God, command this stone that it be made bread."}, {"s": 20667, "e": 27467, "t": "And Jesus answered him, saying, It is written, That man shall not live by bread alone, but by every word of God."}, {"s": 27467, "e": 33733, "t": "And the devil, taking him up into an high mountain, shewed unto him all the kingdoms of the world in a moment of time."}, {"s": 33733, "e": 43867, "t": "And the devil said unto him, All this power will I give thee, and the glory of them: for that is delivered unto me; and to whomsoever I will I give it."}, {"s": 43867, "e": 47200, "t": "If thou therefore wilt worship me, all shall be thine."}, {"s": 47200, "e": 56133, "t": "And Jesus answered and said unto him, Get thee behind me, Satan: for it is written, Thou shalt worship the Lord thy God, and him only shalt thou serve."}, {"s": 56133, "e": 72000, "t": "And he brought him to Jerusalem, and set him on a pinnacle of the temple, and said unto him, If thou be the Son of God, cast thyself down from hence: For it is written, He shall give his angels charge over thee, to keep thee: And in their hands they shall bear thee up,"}, {"s": 72000, "e": 75067, "t": "lest at any time thou dash thy foot against a stone."}, {"s": 75067, "e": 80933, "t": "And Jesus answering said unto him, It is said, Thou shalt not tempt the Lord thy God."}, {"s": 80933, "e": 86000, "t": "And when the devil had ended all the temptation, he departed from him for a season."}, {"s": 86000, "e": 93867, "t": "And Jesus returned in the power of the Spirit into Galilee: and there went out a fame of him through all the region round about."}, {"s": 93867, "e": 98000, "t": "And he taught in their synagogues, being glorified of all."}, {"s": 98000, "e": 106667, "t": "And he came to Nazareth, where he had been brought up: and, as his custom was, he went into the synagogue on the sabbath day, and stood up for to read."}, {"s": 106667, "e": 110667, "t": "And there was delivered unto him the book of the prophet Esaias."}, {"s": 110667, "e": 125600, "t": "And when he had opened the book, he found the place where it was written, The Spirit of the Lord is upon me, because he hath anointed me to preach the gospel to the poor; he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind,"}, {"s": 125600, "e": 130800, "t": "to set at liberty them that are bruised, To preach the acceptable year of the Lord."}, {"s": 130800, "e": 134800, "t": "And he closed the book, and he gave it again to the minister, and sat down."}, {"s": 134800, "e": 138800, "t": "And the eyes of all them that were in the synagogue were fastened on him."}, {"s": 138800, "e": 144400, "t": "And he began to say unto them, This day is this scripture fulfilled in your ears."}, {"s": 144400, "e": 149867, "t": "And all bare him witness, and wondered at the gracious words which proceeded out of his mouth."}, {"s": 149867, "e": 152933, "t": "And they said, Is not this Joseph's son?"}, {"s": 152933, "e": 164000, "t": "And he said unto them, Ye will surely say unto me this proverb, Physician, heal thyself: whatsoever we have heard done in Capernaum, do also here in thy country."}, {"s": 164000, "e": 168800, "t": "And he said, Verily I say unto you, No prophet is accepted in his own country."}, {"s": 168800, "e": 186267, "t": "But I tell you of a truth, many widows were in Israel in the days of Elias, when the heaven was shut up three years and six months, when great famine was throughout all the land; But unto none of them was Elias sent, save unto Sarepta, a city of Sidon, unto a woman that was a widow."}, {"s": 186267, "e": 193600, "t": "And many lepers were in Israel in the time of Eliseus the prophet; and none of them was cleansed, saving Naaman the Syrian."}, {"s": 193600, "e": 206800, "t": "And all they in the synagogue, when they heard these things, were filled with wrath, And rose up, and thrust him out of the city, and led him unto the brow of the hill whereon their city was built, that they might cast him down headlong."}, {"s": 206800, "e": 215200, "t": "But he passing through the midst of them went his way, And came down to Capernaum, a city of Galilee, and taught them on the sabbath days."}, {"s": 215200, "e": 219200, "t": "And they were astonished at his doctrine: for his word was with power."}, {"s": 219200, "e": 231067, "t": "And in the synagogue there was a man, which had a spirit of an unclean devil, and cried out with a loud voice, Saying, Let us alone; what have we to do with thee, thou Jesus of Nazareth?"}, {"s": 231067, "e": 233067, "t": "art thou come to destroy us?"}, {"s": 233067, "e": 237067, "t": "I know thee who thou art; the Holy One of God."}, {"s": 237067, "e": 242400, "t": "And Jesus rebuked him, saying, Hold thy peace, and come out of him."}, {"s": 242400, "e": 247600, "t": "And when the devil had thrown him in the midst, he came out of him, and hurt him not."}, {"s": 247600, "e": 252533, "t": "And they were all amazed, and spake among themselves, saying, What a word is this!"}, {"s": 252533, "e": 257067, "t": "for with authority and power he commandeth the unclean spirits, and they come out."}, {"s": 257067, "e": 261333, "t": "And the fame of him went out into every place of the country round about."}, {"s": 261333, "e": 264800, "t": "And he arose out of the synagogue, and entered into Simon's house."}, {"s": 264800, "e": 269867, "t": "And Simon's wife's mother was taken with a great fever; and they besought him for her."}, {"s": 269867, "e": 276933, "t": "And he stood over her, and rebuked the fever; and it left her: and immediately she arose and ministered unto them."}, {"s": 276933, "e": 286000, "t": "Now when the sun was setting, all they that had any sick with divers diseases brought them unto him; and he laid his hands on every one of them, and healed them."}, {"s": 286000, "e": 291733, "t": "And devils also came out of many, crying out, and saying, Thou art Christ the Son of God."}, {"s": 291733, "e": 296667, "t": "And he rebuking them suffered them not to speak: for they knew that he was Christ."}, {"s": 296667, "e": 306133, "t": "And when it was day, he departed and went into a desert place: and the people sought him, and came unto him, and stayed him, that he should not depart from them."}, {"s": 306133, "e": 312400, "t": "And he said unto them, I must preach the kingdom of God to other cities also: for therefore am I sent."}, {"s": 312400, "e": 314800, "t": "And he preached in the synagogues of Galilee."}],a=document.getElementById('a'),t=document.getElementById('t');
