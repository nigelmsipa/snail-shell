<script>
const S=[{"s": 0, "e": 1333, "t": "John, Chapter Eight."}, {"s": 1333, "e": 3600, "t": "Jesus went unto the mount of Olives."}, {"s": 3600, "e": 10933, "t": "And early in the morning he came again into the temple, and all the people came unto him; and he sat down, and taught them."}, {"s": 10933, "e": 21867, "t": "And the scribes and Pharisees brought unto him a woman taken in adultery; and when they had set her in the midst, They say unto him, Master, this woman was taken in adultery, in the very act."}, {"s": 21867, "e": 27733, "t": "Now Moses in the law commanded us, that such should be stoned: but what sayest thou?"}, {"s": 27733, "e": 31333, "t": "This they said, tempting him, that they might have to accuse him."}, {"s": 31333, "e": 37067, "t": "But Jesus stooped down, and with his finger wrote on the ground, as though he heard them not."}, {"s": 37067, "e": 45200, "t": "So when they continued asking him, he lifted up himself, and said unto them, He that is without sin among you, let him first cast a stone at her."}, {"s": 45200, "e": 48133, "t": "And again he stooped down, and wrote on the ground."}, {"s": 48133, "e": 60800, "t": "And they which heard it, being convicted by their own conscience, went out one by one, beginning at the eldest, even unto the last: and Jesus was left alone, and the woman standing in the midst."}, {"s": 60800, "e": 68933, "t": "When Jesus had lifted up himself, and saw none but the woman, he said unto her, Woman, where are those thine accusers?"}, {"s": 68933, "e": 70800, "t": "hath no man condemned thee?"}, {"s": 70800, "e": 72800, "t": "She said, No man, Lord."}, {"s": 72800, "e": 78533, "t": "And Jesus said unto her, Neither do I condemn thee: go, and sin no more."}, {"s": 78533, "e": 87467, "t": "Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life."}, {"s": 87467, "e": 93867, "t": "The Pharisees therefore said unto him, Thou bearest record of thyself; thy record is not true."}, {"s": 93867, "e": 105200, "t": "Jesus answered and said unto them, Though I bear record of myself, yet my record is true: for I know whence I came, and whither I go; but ye cannot tell whence I come, and whither I go."}, {"s": 105200, "e": 108800, "t": "Ye judge after the flesh; I judge no man."}, {"s": 108800, "e": 114933, "t": "And yet if I judge, my judgment is true: for I am not alone, but I and the Father that sent me."}, {"s": 114933, "e": 119067, "t": "It is also written in your law, that the testimony of two men is true."}, {"s": 119067, "e": 124000, "t": "I am one that bear witness of myself, and the Father that sent me beareth witness of me."}, {"s": 124000, "e": 127200, "t": "Then said they unto him, Where is thy Father?"}, {"s": 127200, "e": 134800, "t": "Jesus answered, Ye neither know me, nor my Father: if ye had known me, ye should have known my Father also."}, {"s": 134800, "e": 143200, "t": "These words spake Jesus in the treasury, as he taught in the temple: and no man laid hands on him; for his hour was not yet come."}, {"s": 143200, "e": 152000, "t": "Then said Jesus again unto them, I go my way, and ye shall seek me, and shall die in your sins: whither I go, ye cannot come."}, {"s": 152000, "e": 154800, "t": "Then said the Jews, Will he kill himself?"}, {"s": 154800, "e": 158533, "t": "because he saith, Whither I go, ye cannot come."}, {"s": 158533, "e": 166133, "t": "And he said unto them, Ye are from beneath; I am from above: ye are of this world; I am not of this world."}, {"s": 166133, "e": 173867, "t": "I said therefore unto you, that ye shall die in your sins: for if ye believe not that I am he, ye shall die in your sins."}, {"s": 173867, "e": 176667, "t": "Then said they unto him, Who art thou?"}, {"s": 176667, "e": 181600, "t": "And Jesus saith unto them, Even the same that I said unto you from the beginning."}, {"s": 181600, "e": 189733, "t": "I have many things to say and to judge of you: but he that sent me is true; and I speak to the world those things which I have heard of him."}, {"s": 189733, "e": 192667, "t": "They understood not that he spake to them of the Father."}, {"s": 192667, "e": 203867, "t": "Then said Jesus unto them, When ye have lifted up the Son of man, then shall ye know that I am he, and that I do nothing of myself; but as my Father hath taught me, I speak these things."}, {"s": 203867, "e": 210933, "t": "And he that sent me is with me: the Father hath not left me alone; for I do always those things that please him."}, {"s": 210933, "e": 213867, "t": "As he spake these words, many believed on him."}, {"s": 213867, "e": 225333, "t": "Then said Jesus to those Jews which believed on him, If ye continue in my word, then are ye my disciples indeed; And ye shall know the truth, and the truth shall make you free."}, {"s": 225333, "e": 234133, "t": "They answered him, We be Abraham's seed, and were never in bondage to any man: how sayest thou, Ye shall be made free?"}, {"s": 234133, "e": 240133, "t": "Jesus answered them, Verily, verily, I say unto you, Whosoever committeth sin is the servant of sin."}, {"s": 240133, "e": 245600, "t": "And the servant abideth not in the house for ever: but the Son abideth ever."}, {"s": 245600, "e": 249867, "t": "If the Son therefore shall make you free, ye shall be free indeed."}, {"s": 249867, "e": 256533, "t": "I know that ye are Abraham's seed; but ye seek to kill me, because my word hath no place in you."}, {"s": 256533, "e": 262933, "t": "I speak that which I have seen with my Father: and ye do that which ye have seen with your father."}, {"s": 262933, "e": 266267, "t": "They answered and said unto him, Abraham is our father."}, {"s": 266267, "e": 270933, "t": "Jesus saith unto them, If ye were Abraham's children, ye would do the works of Abraham."}, {"s": 270933, "e": 278133, "t": "But now ye seek to kill me, a man that hath told you the truth, which I have heard of God: this did not Abraham."}, {"s": 278133, "e": 280267, "t": "Ye do the deeds of your father."}, {"s": 280267, "e": 286800, "t": "Then said they to him, We be not born of fornication; we have one Father, even God."}, {"s": 286800, "e": 297067, "t": "Jesus said unto them, If God were your Father, ye would love me: for I proceeded forth and came from God; neither came I of myself, but he sent me."}, {"s": 297067, "e": 299467, "t": "Why do ye not understand my speech?"}, {"s": 299467, "e": 304000, "t": "even because ye cannot hear my word."}, {"s": 304000, "e": 308400, "t": "Ye are of your father the devil, and the lusts of your father ye will do."}, {"s": 308400, "e": 314000, "t": "He was a murderer from the beginning, and abode not in the truth, because there is no truth in him."}, {"s": 314000, "e": 318933, "t": "When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it."}, {"s": 318933, "e": 322667, "t": "And because I tell you the truth, ye believe me not."}, {"s": 322667, "e": 324667, "t": "Which of you convinceth me of sin?"}, {"s": 324667, "e": 327333, "t": "And if I say the truth, why do ye not believe me?"}, {"s": 327333, "e": 334400, "t": "He that is of God heareth God's words: ye therefore hear them not, because ye are not of God."}, {"s": 334400, "e": 341200, "t": "Then answered the Jews, and said unto him, Say we not well that thou art a Samaritan, and hast a devil?"}, {"s": 341200, "e": 346933, "t": "Jesus answered, I have not a devil; but I honour my Father, and ye do dishonour me."}, {"s": 346933, "e": 351467, "t": "And I seek not mine own glory: there is one that seeketh and judgeth."}, {"s": 351467, "e": 356933, "t": "Verily, verily, I say unto you, If a man keep my saying, he shall never see death."}, {"s": 356933, "e": 361200, "t": "Then said the Jews unto him, Now we know that thou hast a devil."}, {"s": 361200, "e": 368667, "t": "Abraham is dead, and the prophets; and thou sayest, If a man keep my saying, he shall never taste of death."}, {"s": 368667, "e": 371733, "t": "Art thou greater than our father Abraham, which is dead?"}, {"s": 371733, "e": 375333, "t": "and the prophets are dead: whom makest thou thyself?"}, {"s": 375333, "e": 393733, "t": "Jesus answered, If I honour myself, my honour is nothing: it is my Father that honoureth me; of whom ye say, that he is your God: Yet ye have not known him; but I know him: and if I should say, I know him not, I shall be a liar like unto you: but I know him, and keep his saying."}, {"s": 393733, "e": 399200, "t": "Your father Abraham rejoiced to see my day: and he saw it, and was glad."}, {"s": 399200, "e": 405733, "t": "Then said the Jews unto him, Thou art not yet fifty years old, and hast thou seen Abraham?"}, {"s": 405733, "e": 411867, "t": "Jesus said unto them, Verily, verily, I say unto you, Before Abraham was, I am."}, {"s": 411867, "e": 420800, "t": "Then took they up stones to cast at him: but Jesus hid himself, and went out of the temple, going through the midst of them, and so passed by."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');

 t.appendChild(e);return e});
