const S=[{"s": 0, "e": 1600, "t": "Mark, Chapter Fourteen."}, {"s": 1600, "e": 11867, "t": "After two days was the feast of the passover, and of unleavened bread: and the chief priests and the scribes sought how they might take him by craft, and put him to death."}, {"s": 11867, "e": 16400, "t": "But they said, Not on the feast day, lest there be an uproar of the people."}, {"s": 16400, "e": 27600, "t": "And being in Bethany in the house of Simon the leper, as he sat at meat, there came a woman having an alabaster box of ointment of spikenard very precious; and she brake the box, and poured it on his head."}, {"s": 27600, "e": 33333, "t": "And there were some that had indignation within themselves, and said, Why was this waste of the ointment made?"}, {"s": 33333, "e": 38267, "t": "For it might have been sold for more than three hundred pence, and have been given to the poor."}, {"s": 38267, "e": 40667, "t": "And they murmured against her."}, {"s": 40667, "e": 44533, "t": "And Jesus said, Let her alone; why trouble ye her?"}, {"s": 44533, "e": 47067, "t": "she hath wrought a good work on me."}, {"s": 47067, "e": 53867, "t": "For ye have the poor with you always, and whensoever ye will ye may do them good: but me ye have not always."}, {"s": 53867, "e": 59333, "t": "She hath done what she could: she is come aforehand to anoint my body to the burying."}, {"s": 59333, "e": 69067, "t": "Verily I say unto you, Wheresoever this gospel shall be preached throughout the whole world, this also that she hath done shall be spoken of for a memorial of her."}, {"s": 69067, "e": 74400, "t": "And Judas Iscariot, one of the twelve, went unto the chief priests, to betray him unto them."}, {"s": 74400, "e": 78533, "t": "And when they heard it, they were glad, and promised to give him money."}, {"s": 78533, "e": 81600, "t": "And he sought how he might conveniently betray him."}, {"s": 81600, "e": 90667, "t": "And the first day of unleavened bread, when they killed the passover, his disciples said unto him, Where wilt thou that we go and prepare that thou mayest eat the passover?"}, {"s": 90667, "e": 99467, "t": "And he sendeth forth two of his disciples, and saith unto them, Go ye into the city, and there shall meet you a man bearing a pitcher of water: follow him."}, {"s": 99467, "e": 111200, "t": "And wheresoever he shall go in, say ye to the goodman of the house, The Master saith, Where is the guestchamber, where I shall eat the passover with my disciples?"}, {"s": 111200, "e": 116933, "t": "And he will shew you a large upper room furnished and prepared: there make ready for us."}, {"s": 116933, "e": 123467, "t": "And his disciples went forth, and came into the city, and found as he had said unto them: and they made ready the passover."}, {"s": 123467, "e": 126133, "t": "And in the evening he cometh with the twelve."}, {"s": 126133, "e": 134533, "t": "And as they sat and did eat, Jesus said, Verily I say unto you, One of you which eateth with me shall betray me."}, {"s": 134533, "e": 140000, "t": "And they began to be sorrowful, and to say unto him one by one, Is it I?"}, {"s": 140000, "e": 142000, "t": "and another said, Is it I?"}, {"s": 142000, "e": 147600, "t": "And he answered and said unto them, It is one of the twelve, that dippeth with me in the dish."}, {"s": 147600, "e": 154400, "t": "The Son of man indeed goeth, as it is written of him: but woe to that man by whom the Son of man is betrayed!"}, {"s": 154400, "e": 157733, "t": "good were it for that man if he had never been born."}, {"s": 157733, "e": 165200, "t": "And as they did eat, Jesus took bread, and blessed, and brake it, and gave to them, and said, Take, eat: this is my body."}, {"s": 165200, "e": 170267, "t": "And he took the cup, and when he had given thanks, he gave it to them: and they all drank of it."}, {"s": 170267, "e": 175200, "t": "And he said unto them, This is my blood of the new testament, which is shed for many."}, {"s": 175200, "e": 182400, "t": "Verily I say unto you, I will drink no more of the fruit of the vine, until that day that I drink it new in the kingdom of God."}, {"s": 182400, "e": 186133, "t": "And when they had sung an hymn, they went out into the mount of Olives."}, {"s": 186133, "e": 195067, "t": "And Jesus saith unto them, All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep shall be scattered."}, {"s": 195067, "e": 198667, "t": "But after that I am risen, I will go before you into Galilee."}, {"s": 198667, "e": 203733, "t": "But Peter said unto him, Although all shall be offended, yet will not I."}, {"s": 203733, "e": 212133, "t": "And Jesus saith unto him, Verily I say unto thee, That this day, even in this night, before the cock crow twice, thou shalt deny me thrice."}, {"s": 212133, "e": 218133, "t": "But he spake the more vehemently, If I should die with thee, I will not deny thee in any wise."}, {"s": 218133, "e": 220000, "t": "Likewise also said they all."}, {"s": 220000, "e": 227733, "t": "And they came to a place which was named Gethsemane: and he saith to his disciples, Sit ye here, while I shall pray."}, {"s": 227733, "e": 241333, "t": "And he taketh with him Peter and James and John, and began to be sore amazed, and to be very heavy; And saith unto them, My soul is exceeding sorrowful unto death: tarry ye here, and watch."}, {"s": 241333, "e": 246933, "t": "And he went forward a little, and fell on the ground, and prayed that, if it were possible, the hour might pass from him."}, {"s": 246933, "e": 257200, "t": "And he said, Abba, Father, all things are possible unto thee; take away this cup from me: nevertheless not what I will, but what thou wilt."}, {"s": 257200, "e": 264267, "t": "And he cometh, and findeth them sleeping, and saith unto Peter, Simon, sleepest thou?"}, {"s": 264267, "e": 266133, "t": "couldest not thou watch one hour?"}, {"s": 266133, "e": 269867, "t": "Watch ye and pray, lest ye enter into temptation."}, {"s": 269867, "e": 273467, "t": "The spirit truly is ready, but the flesh is weak."}, {"s": 273467, "e": 277200, "t": "And again he went away, and prayed, and spake the same words."}, {"s": 277200, "e": 283467, "t": "And when he returned, he found them asleep again, (for their eyes were heavy,) neither wist they what to answer him."}, {"s": 283467, "e": 294667, "t": "And he cometh the third time, and saith unto them, Sleep on now, and take your rest: it is enough, the hour is come; behold, the Son of man is betrayed into the hands of sinners."}, {"s": 294667, "e": 298800, "t": "Rise up, let us go; lo, he that betrayeth me is at hand."}, {"s": 298800, "e": 308267, "t": "And immediately, while he yet spake, cometh Judas, one of the twelve, and with him a great multitude with swords and staves, from the chief priests and the scribes and the elders."}, {"s": 308267, "e": 316400, "t": "And he that betrayed him had given them a token, saying, Whomsoever I shall kiss, that same is he; take him, and lead him away safely."}, {"s": 316400, "e": 322267, "t": "And as soon as he was come, he goeth straightway to him, and saith, Master, master; and kissed him."}, {"s": 322267, "e": 325600, "t": "And they laid their hands on him, and took him."}, {"s": 325600, "e": 331733, "t": "And one of them that stood by drew a sword, and smote a servant of the high priest, and cut off his ear."}, {"s": 331733, "e": 338400, "t": "And Jesus answered and said unto them, Are ye come out, as against a thief, with swords and with staves to take me?"}, {"s": 338400, "e": 344667, "t": "I was daily with you in the temple teaching, and ye took me not: but the scriptures must be fulfilled."}, {"s": 344667, "e": 347467, "t": "And they all forsook him, and fled."}, {"s": 347467, "e": 357467, "t": "And there followed him a certain young man, having a linen cloth cast about his naked body; and the young men laid hold on him: And he left the linen cloth, and fled from them naked."}, {"s": 357467, "e": 365067, "t": "And they led Jesus away to the high priest: and with him were assembled all the chief priests and the elders and the scribes."}, {"s": 365067, "e": 372800, "t": "And Peter followed him afar off, even into the palace of the high priest: and he sat with the servants, and warmed himself at the fire."}, {"s": 372800, "e": 378533, "t": "And the chief priests and all the council sought for witness against Jesus to put him to death; and found none."}, {"s": 378533, "e": 383200, "t": "For many bare false witness against him, but their witness agreed not together."}, {"s": 383200, "e": 394933, "t": "And there arose certain, and bare false witness against him, saying, We heard him say, I will destroy this temple that is made with hands, and within three days I will build another made without hands."}, {"s": 394933, "e": 398000, "t": "But neither so did their witness agree together."}, {"s": 398000, "e": 403467, "t": "And the high priest stood up in the midst, and asked Jesus, saying, Answerest thou nothing?"}, {"s": 403467, "e": 405867, "t": "what is it which these witness against thee?"}, {"s": 405867, "e": 408667, "t": "But he held his peace, and answered nothing."}, {"s": 408667, "e": 414667, "t": "Again the high priest asked him, and said unto him, Art thou the Christ, the Son of the Blessed?"}, {"s": 414667, "e": 421600, "t": "And Jesus said, I am: and ye shall see the Son of man sitting on the right hand of power, and coming in the clouds of heaven."}, {"s": 421600, "e": 427333, "t": "Then the high priest rent his clothes, and saith, What need we any further witnesses?"}, {"s": 427333, "e": 430667, "t": "Ye have heard the blasphemy: what think ye?"}, {"s": 430667, "e": 433467, "t": "And they all condemned him to be guilty of death."}, {"s": 433467, "e": 443200, "t": "And some began to spit on him, and to cover his face, and to buffet him, and to say unto him, Prophesy: and the servants did strike him with the palms of their hands."}, {"s": 443200, "e": 454267, "t": "And as Peter was beneath in the palace, there cometh one of the maids of the high priest: And when she saw Peter warming himself, she looked upon him, and said, And thou also wast with Jesus of Nazareth."}, {"s": 454267, "e": 459067, "t": "But he denied, saying, I know not, neither understand I what thou sayest."}, {"s": 459067, "e": 462533, "t": "And he went out into the porch; and the cock crew."}, {"s": 462533, "e": 467733, "t": "And a maid saw him again, and began to say to them that stood by, This is one of them."}, {"s": 467733, "e": 469333, "t": "And he denied it again."}, {"s": 469333, "e": 478400, "t": "And a little after, they that stood by said again to Peter, Surely thou art one of them: for thou art a Galilaean, and thy speech agreeth thereto."}, {"s": 478400, "e": 483867, "t": "But he began to curse and to swear, saying, I know not this man of whom ye speak."}, {"s": 483867, "e": 486133, "t": "And the second time the cock crew."}, {"s": 486133, "e": 493467, "t": "And Peter called to mind the word that Jesus said unto him, Before the cock crow twice, thou shalt deny me thrice."}, {"s": 493467, "e": 495733, "t": "And when he thought thereon, he wept."}],a=document.getElementById('a'),t=document.getElementById('t');
