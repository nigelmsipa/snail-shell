<script>
const S=[{"s": 0, "e": 1733, "t": "John, Chapter Nineteen."}, {"s": 1733, "e": 5333, "t": "Then Pilate therefore took Jesus, and scourged him."}, {"s": 5333, "e": 13467, "t": "And the soldiers platted a crown of thorns, and put it on his head, and they put on him a purple robe, And said, Hail, King of the Jews!"}, {"s": 13467, "e": 15333, "t": "and they smote him with their hands."}, {"s": 15333, "e": 23333, "t": "Pilate therefore went forth again, and saith unto them, Behold, I bring him forth to you, that ye may know that I find no fault in him."}, {"s": 23333, "e": 27600, "t": "Then came Jesus forth, wearing the crown of thorns, and the purple robe."}, {"s": 27600, "e": 30933, "t": "And Pilate saith unto them, Behold the man!"}, {"s": 30933, "e": 36800, "t": "When the chief priests therefore and officers saw him, they cried out, saying, Crucify him, crucify him."}, {"s": 36800, "e": 42933, "t": "Pilate saith unto them, Take ye him, and crucify him: for I find no fault in him."}, {"s": 42933, "e": 50533, "t": "The Jews answered him, We have a law, and by our law he ought to die, because he made himself the Son of God."}, {"s": 50533, "e": 59467, "t": "When Pilate therefore heard that saying, he was the more afraid; And went again into the judgment hall, and saith unto Jesus, Whence art thou?"}, {"s": 59467, "e": 61867, "t": "But Jesus gave him no answer."}, {"s": 61867, "e": 65200, "t": "Then saith Pilate unto him, Speakest thou not unto me?"}, {"s": 65200, "e": 70267, "t": "knowest thou not that I have power to crucify thee, and have power to release thee?"}, {"s": 70267, "e": 79600, "t": "Jesus answered, Thou couldest have no power at all against me, except it were given thee from above: therefore he that delivered me unto thee hath the greater sin."}, {"s": 79600, "e": 92133, "t": "And from thenceforth Pilate sought to release him: but the Jews cried out, saying, If thou let this man go, thou art not Caesar's friend: whosoever maketh himself a king speaketh against Caesar."}, {"s": 92133, "e": 102000, "t": "When Pilate therefore heard that saying, he brought Jesus forth, and sat down in the judgment seat in a place that is called the Pavement, but in the Hebrew, Gabbatha."}, {"s": 102000, "e": 109867, "t": "And it was the preparation of the passover, and about the sixth hour: and he saith unto the Jews, Behold your King!"}, {"s": 109867, "e": 113867, "t": "But they cried out, Away with him, away with him, crucify him."}, {"s": 113867, "e": 117067, "t": "Pilate saith unto them, Shall I crucify your King?"}, {"s": 117067, "e": 120533, "t": "The chief priests answered, We have no king but Caesar."}, {"s": 120533, "e": 124267, "t": "Then delivered he him therefore unto them to be crucified."}, {"s": 124267, "e": 126667, "t": "And they took Jesus, and led him away."}, {"s": 126667, "e": 139200, "t": "And he bearing his cross went forth into a place called the place of a skull, which is called in the Hebrew Golgotha: Where they crucified him, and two other with him, on either side one, and Jesus in the midst."}, {"s": 139200, "e": 142800, "t": "And Pilate wrote a title, and put it on the cross."}, {"s": 142800, "e": 147067, "t": "And the writing was, JESUS OF NAZARETH THE KING OF THE JEWS."}, {"s": 147067, "e": 156800, "t": "This title then read many of the Jews: for the place where Jesus was crucified was nigh to the city: and it was written in Hebrew, and Greek, and Latin."}, {"s": 156800, "e": 164133, "t": "Then said the chief priests of the Jews to Pilate, Write not, The King of the Jews; but that he said, I am King of the Jews."}, {"s": 164133, "e": 167600, "t": "Pilate answered, What I have written I have written."}, {"s": 167600, "e": 179600, "t": "Then the soldiers, when they had crucified Jesus, took his garments, and made four parts, to every soldier a part; and also his coat: now the coat was without seam, woven from the top throughout."}, {"s": 179600, "e": 192533, "t": "They said therefore among themselves, Let us not rend it, but cast lots for it, whose it shall be: that the scripture might be fulfilled, which saith, They parted my raiment among them, and for my vesture they did cast lots."}, {"s": 192533, "e": 195333, "t": "These things therefore the soldiers did."}, {"s": 195333, "e": 203600, "t": "Now there stood by the cross of Jesus his mother, and his mother's sister, Mary the wife of Cleophas, and Mary Magdalene."}, {"s": 203600, "e": 211733, "t": "When Jesus therefore saw his mother, and the disciple standing by, whom he loved, he saith unto his mother, Woman, behold thy son!"}, {"s": 211733, "e": 215333, "t": "Then saith he to the disciple, Behold thy mother!"}, {"s": 215333, "e": 219200, "t": "And from that hour that disciple took her unto his own home."}, {"s": 219200, "e": 226133, "t": "After this, Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, saith, I thirst."}, {"s": 226133, "e": 233600, "t": "Now there was set a vessel full of vinegar: and they filled a spunge with vinegar, and put it upon hyssop, and put it to his mouth."}, {"s": 233600, "e": 240533, "t": "When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up the ghost."}, {"s": 240533, "e": 254000, "t": "The Jews therefore, because it was the preparation, that the bodies should not remain upon the cross on the sabbath day, (for that sabbath day was an high day,) besought Pilate that their legs might be broken, and that they might be taken away."}, {"s": 254000, "e": 259867, "t": "Then came the soldiers, and brake the legs of the first, and of the other which was crucified with him."}, {"s": 259867, "e": 271200, "t": "But when they came to Jesus, and saw that he was dead already, they brake not his legs: But one of the soldiers with a spear pierced his side, and forthwith came there out blood and water."}, {"s": 271200, "e": 278800, "t": "And he that saw it bare record, and his record is true: and he knoweth that he saith true, that ye might believe."}, {"s": 278800, "e": 284933, "t": "For these things were done, that the scripture should be fulfilled, A bone of him shall not be broken."}, {"s": 284933, "e": 289733, "t": "And again another scripture saith, They shall look on him whom they pierced."}, {"s": 289733, "e": 300267, "t": "And after this Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave him leave."}, {"s": 300267, "e": 303200, "t": "He came therefore, and took the body of Jesus."}, {"s": 303200, "e": 311733, "t": "And there came also Nicodemus, which at the first came to Jesus by night, and brought a mixture of myrrh and aloes, about an hundred pound weight."}, {"s": 311733, "e": 318800, "t": "Then took they the body of Jesus, and wound it in linen clothes with the spices, as the manner of the Jews is to bury."}, {"s": 318800, "e": 326267, "t": "Now in the place where he was crucified there was a garden; and in the garden a new sepulchre, wherein was never man yet laid."}, {"s": 326267, "e": 333467, "t": "There laid they Jesus therefore because of the Jews' preparation day; for the sepulchre was nigh at hand."}],a=document.getElementById('a'),t=document.getElementById('t');
