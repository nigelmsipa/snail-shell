const S=[{"s": 0, "e": 1467, "t": "Luke, Chapter Seven."}, {"s": 1467, "e": 7600, "t": "Now when he had ended all his sayings in the audience of the people, he entered into Capernaum."}, {"s": 7600, "e": 13600, "t": "And a certain centurion's servant, who was dear unto him, was sick, and ready to die."}, {"s": 13600, "e": 20667, "t": "And when he heard of Jesus, he sent unto him the elders of the Jews, beseeching him that he would come and heal his servant."}, {"s": 20667, "e": 30933, "t": "And when they came to Jesus, they besought him instantly, saying, That he was worthy for whom he should do this: For he loveth our nation, and he hath built us a synagogue."}, {"s": 30933, "e": 33067, "t": "Then Jesus went with them."}, {"s": 33067, "e": 52933, "t": "And when he was now not far from the house, the centurion sent friends to him, saying unto him, Lord, trouble not thyself: for I am not worthy that thou shouldest enter under my roof: Wherefore neither thought I myself worthy to come unto thee: but say in a word, and my servant shall be healed."}, {"s": 52933, "e": 66267, "t": "For I also am a man set under authority, having under me soldiers, and I say unto one, Go, and he goeth; and to another, Come, and he cometh; and to my servant, Do this, and he doeth it."}, {"s": 66267, "e": 76800, "t": "When Jesus heard these things, he marvelled at him, and turned him about, and said unto the people that followed him, I say unto you, I have not found so great faith, no, not in Israel."}, {"s": 76800, "e": 81600, "t": "And they that were sent, returning to the house, found the servant whole that had been sick."}, {"s": 81600, "e": 89200, "t": "And it came to pass the day after, that he went into a city called Nain; and many of his disciples went with him, and much people."}, {"s": 89200, "e": 99333, "t": "Now when he came nigh to the gate of the city, behold, there was a dead man carried out, the only son of his mother, and she was a widow: and much people of the city was with her."}, {"s": 99333, "e": 104533, "t": "And when the Lord saw her, he had compassion on her, and said unto her, Weep not."}, {"s": 104533, "e": 108800, "t": "And he came and touched the bier: and they that bare him stood still."}, {"s": 108800, "e": 112000, "t": "And he said, Young man, I say unto thee, Arise."}, {"s": 112000, "e": 115333, "t": "And he that was dead sat up, and began to speak."}, {"s": 115333, "e": 117733, "t": "And he delivered him to his mother."}, {"s": 117733, "e": 127067, "t": "And there came a fear on all: and they glorified God, saying, That a great prophet is risen up among us; and, That God hath visited his people."}, {"s": 127067, "e": 132933, "t": "And this rumour of him went forth throughout all Judaea, and throughout all the region round about."}, {"s": 132933, "e": 136133, "t": "And the disciples of John shewed him of all these things."}, {"s": 136133, "e": 142000, "t": "And John calling unto him two of his disciples sent them to Jesus, saying, Art thou he that should come?"}, {"s": 142000, "e": 144133, "t": "or look we for another?"}, {"s": 144133, "e": 150667, "t": "When the men were come unto him, they said, John Baptist hath sent us unto thee, saying, Art thou he that should come?"}, {"s": 150667, "e": 152000, "t": "or look we for another?"}, {"s": 152000, "e": 160000, "t": "And in that same hour he cured many of their infirmities and plagues, and of evil spirits; and unto many that were blind he gave sight."}, {"s": 160000, "e": 174133, "t": "Then Jesus answering said unto them, Go your way, and tell John what things ye have seen and heard; how that the blind see, the lame walk, the lepers are cleansed, the deaf hear, the dead are raised, to the poor the gospel is preached."}, {"s": 174133, "e": 178267, "t": "And blessed is he, whosoever shall not be offended in me."}, {"s": 178267, "e": 186933, "t": "And when the messengers of John were departed, he began to speak unto the people concerning John, What went ye out into the wilderness for to see?"}, {"s": 186933, "e": 188800, "t": "A reed shaken with the wind?"}, {"s": 188800, "e": 191200, "t": "But what went ye out for to see?"}, {"s": 191200, "e": 193200, "t": "A man clothed in soft raiment?"}, {"s": 193200, "e": 199200, "t": "Behold, they which are gorgeously apparelled, and live delicately, are in kings' courts."}, {"s": 199200, "e": 202000, "t": "But what went ye out for to see?"}, {"s": 202000, "e": 202800, "t": "A prophet?"}, {"s": 202800, "e": 206400, "t": "Yea, I say unto you, and much more than a prophet."}, {"s": 206400, "e": 214133, "t": "This is he, of whom it is written, Behold, I send my messenger before thy face, which shall prepare thy way before thee."}, {"s": 214133, "e": 223600, "t": "For I say unto you, Among those that are born of women there is not a greater prophet than John the Baptist: but he that is least in the kingdom of God is greater than he."}, {"s": 223600, "e": 229867, "t": "And all the people that heard him, and the publicans, justified God, being baptized with the baptism of John."}, {"s": 229867, "e": 235467, "t": "But the Pharisees and lawyers rejected the counsel of God against themselves, being not baptized of him."}, {"s": 235467, "e": 239333, "t": "And the Lord said, Whereunto then shall I liken the men of this generation?"}, {"s": 239333, "e": 241200, "t": "and to what are they like?"}, {"s": 241200, "e": 253467, "t": "They are like unto children sitting in the marketplace, and calling one to another, and saying, We have piped unto you, and ye have not danced; we have mourned to you, and ye have not wept."}, {"s": 253467, "e": 260800, "t": "For John the Baptist came neither eating bread nor drinking wine; and ye say, He hath a devil."}, {"s": 260800, "e": 270000, "t": "The Son of man is come eating and drinking; and ye say, Behold a gluttonous man, and a winebibber, a friend of publicans and sinners!"}, {"s": 270000, "e": 272800, "t": "But wisdom is justified of all her children."}, {"s": 272800, "e": 276267, "t": "And one of the Pharisees desired him that he would eat with him."}, {"s": 276267, "e": 280133, "t": "And he went into the Pharisee's house, and sat down to meat."}, {"s": 280133, "e": 297467, "t": "And, behold, a woman in the city, which was a sinner, when she knew that Jesus sat at meat in the Pharisee's house, brought an alabaster box of ointment, And stood at his feet behind him weeping, and began to wash his feet with tears, and did wipe them with the hairs of her head,"}, {"s": 297467, "e": 300667, "t": "and kissed his feet, and anointed them with the ointment."}, {"s": 300667, "e": 313067, "t": "Now when the Pharisee which had bidden him saw it, he spake within himself, saying, This man, if he were a prophet, would have known who and what manner of woman this is that toucheth him: for she is a sinner."}, {"s": 313067, "e": 318533, "t": "And Jesus answering said unto him, Simon, I have somewhat to say unto thee."}, {"s": 318533, "e": 320933, "t": "And he saith, Master, say on."}, {"s": 320933, "e": 326667, "t": "There was a certain creditor which had two debtors: the one owed five hundred pence, and the other fifty."}, {"s": 326667, "e": 330667, "t": "And when they had nothing to pay, he frankly forgave them both."}, {"s": 330667, "e": 334533, "t": "Tell me therefore, which of them will love him most?"}, {"s": 334533, "e": 339200, "t": "Simon answered and said, I suppose that he, to whom he forgave most."}, {"s": 339200, "e": 342267, "t": "And he said unto him, Thou hast rightly judged."}, {"s": 342267, "e": 346933, "t": "And he turned to the woman, and said unto Simon, Seest thou this woman?"}, {"s": 346933, "e": 355200, "t": "I entered into thine house, thou gavest me no water for my feet: but she hath washed my feet with tears, and wiped them with the hairs of her head."}, {"s": 355200, "e": 360933, "t": "Thou gavest me no kiss: but this woman since the time I came in hath not ceased to kiss my feet."}, {"s": 360933, "e": 366133, "t": "My head with oil thou didst not anoint: but this woman hath anointed my feet with ointment."}, {"s": 366133, "e": 374933, "t": "Wherefore I say unto thee, Her sins, which are many, are forgiven; for she loved much: but to whom little is forgiven, the same loveth little."}, {"s": 374933, "e": 377867, "t": "And he said unto her, Thy sins are forgiven."}, {"s": 377867, "e": 384400, "t": "And they that sat at meat with him began to say within themselves, Who is this that forgiveth sins also?"}, {"s": 384400, "e": 388667, "t": "And he said to the woman, Thy faith hath saved thee; go in peace."}],a=document.getElementById('a'),t=document.getElementById('t');
