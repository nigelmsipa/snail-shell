<script>
const S=[{"s": 0, "e": 1600, "t": "Luke, Chapter Nine."}, {"s": 1600, "e": 8667, "t": "Then he called his twelve disciples together, and gave them power and authority over all devils, and to cure diseases."}, {"s": 8667, "e": 12400, "t": "And he sent them to preach the kingdom of God, and to heal the sick."}, {"s": 12400, "e": 21333, "t": "And he said unto them, Take nothing for your journey, neither staves, nor scrip, neither bread, neither money; neither have two coats apiece."}, {"s": 21333, "e": 26533, "t": "And whatsoever house ye enter into, there abide, and thence depart."}, {"s": 26533, "e": 34533, "t": "And whosoever will not receive you, when ye go out of that city, shake off the very dust from your feet for a testimony against them."}, {"s": 34533, "e": 39733, "t": "And they departed, and went through the towns, preaching the gospel, and healing every where."}, {"s": 39733, "e": 54533, "t": "Now Herod the tetrarch heard of all that was done by him: and he was perplexed, because that it was said of some, that John was risen from the dead; And of some, that Elias had appeared; and of others, that one of the old prophets was risen again."}, {"s": 54533, "e": 59733, "t": "And Herod said, John have I beheaded: but who is this, of whom I hear such things?"}, {"s": 59733, "e": 61333, "t": "And he desired to see him."}, {"s": 61333, "e": 64933, "t": "And the apostles, when they were returned, told him all that they had done."}, {"s": 64933, "e": 70667, "t": "And he took them, and went aside privately into a desert place belonging to the city called Bethsaida."}, {"s": 70667, "e": 79867, "t": "And the people, when they knew it, followed him: and he received them, and spake unto them of the kingdom of God, and healed them that had need of healing."}, {"s": 79867, "e": 92933, "t": "And when the day began to wear away, then came the twelve, and said unto him, Send the multitude away, that they may go into the towns and country round about, and lodge, and get victuals: for we are here in a desert place."}, {"s": 92933, "e": 96133, "t": "But he said unto them, Give ye them to eat."}, {"s": 96133, "e": 102267, "t": "And they said, We have no more but five loaves and two fishes; except we should go and buy meat for all this people."}, {"s": 102267, "e": 104800, "t": "For they were about five thousand men."}, {"s": 104800, "e": 109733, "t": "And he said to his disciples, Make them sit down by fifties in a company."}, {"s": 109733, "e": 112400, "t": "And they did so, and made them all sit down."}, {"s": 112400, "e": 120800, "t": "Then he took the five loaves and the two fishes, and looking up to heaven, he blessed them, and brake, and gave to the disciples to set before the multitude."}, {"s": 120800, "e": 126667, "t": "And they did eat, and were all filled: and there was taken up of fragments that remained to them twelve baskets."}, {"s": 126667, "e": 134000, "t": "And it came to pass, as he was alone praying, his disciples were with him: and he asked them, saying, Whom say the people that I am?"}, {"s": 134000, "e": 140800, "t": "They answering said, John the Baptist; but some say, Elias; and others say, that one of the old prophets is risen again."}, {"s": 140800, "e": 144667, "t": "He said unto them, But whom say ye that I am?"}, {"s": 144667, "e": 147467, "t": "Peter answering said, The Christ of God."}, {"s": 147467, "e": 160000, "t": "And he straitly charged them, and commanded them to tell no man that thing; Saying, The Son of man must suffer many things, and be rejected of the elders and chief priests and scribes, and be slain, and be raised the third day."}, {"s": 160000, "e": 166667, "t": "And he said to them all, If any man will come after me, let him deny himself, and take up his cross daily, and follow me."}, {"s": 166667, "e": 175067, "t": "For whosoever will save his life shall lose it: but whosoever will lose his life for my sake, the same shall save it."}, {"s": 175067, "e": 181467, "t": "For what is a man advantaged, if he gain the whole world, and lose himself, or be cast away?"}, {"s": 181467, "e": 192000, "t": "For whosoever shall be ashamed of me and of my words, of him shall the Son of man be ashamed, when he shall come in his own glory, and in his Father's, and of the holy angels."}, {"s": 192000, "e": 199067, "t": "But I tell you of a truth, there be some standing here, which shall not taste of death, till they see the kingdom of God."}, {"s": 199067, "e": 206267, "t": "And it came to pass about an eight days after these sayings, he took Peter and John and James, and went up into a mountain to pray."}, {"s": 206267, "e": 211333, "t": "And as he prayed, the fashion of his countenance was altered, and his raiment was white and glistering."}, {"s": 211333, "e": 220133, "t": "And, behold, there talked with him two men, which were Moses and Elias: Who appeared in glory, and spake of his decease which he should accomplish at Jerusalem."}, {"s": 220133, "e": 228133, "t": "But Peter and they that were with him were heavy with sleep: and when they were awake, they saw his glory, and the two men that stood with him."}, {"s": 228133, "e": 242000, "t": "And it came to pass, as they departed from him, Peter said unto Jesus, Master, it is good for us to be here: and let us make three tabernacles; one for thee, and one for Moses, and one for Elias: not knowing what he said."}, {"s": 242000, "e": 248667, "t": "While he thus spake, there came a cloud, and overshadowed them: and they feared as they entered into the cloud."}, {"s": 248667, "e": 255067, "t": "And there came a voice out of the cloud, saying, This is my beloved Son: hear him."}, {"s": 255067, "e": 258667, "t": "And when the voice was past, Jesus was found alone."}, {"s": 258667, "e": 263867, "t": "And they kept it close, and told no man in those days any of those things which they had seen."}, {"s": 263867, "e": 269600, "t": "And it came to pass, that on the next day, when they were come down from the hill, much people met him."}, {"s": 269600, "e": 277600, "t": "And, behold, a man of the company cried out, saying, Master, I beseech thee, look upon my son: for he is mine only child."}, {"s": 277600, "e": 286800, "t": "And, lo, a spirit taketh him, and he suddenly crieth out; and it teareth him that he foameth again, and bruising him hardly departeth from him."}, {"s": 286800, "e": 291200, "t": "And I besought thy disciples to cast him out; and they could not."}, {"s": 291200, "e": 299200, "t": "And Jesus answering said, O faithless and perverse generation, how long shall I be with you, and suffer you?"}, {"s": 299200, "e": 300667, "t": "Bring thy son hither."}, {"s": 300667, "e": 305067, "t": "And as he was yet a coming, the devil threw him down, and tare him."}, {"s": 305067, "e": 311333, "t": "And Jesus rebuked the unclean spirit, and healed the child, and delivered him again to his father."}, {"s": 311333, "e": 314800, "t": "And they were all amazed at the mighty power of God."}, {"s": 314800, "e": 325867, "t": "But while they wondered every one at all things which Jesus did, he said unto his disciples, Let these sayings sink down into your ears: for the Son of man shall be delivered into the hands of men."}, {"s": 325867, "e": 334000, "t": "But they understood not this saying, and it was hid from them, that they perceived it not: and they feared to ask him of that saying."}, {"s": 334000, "e": 338400, "t": "Then there arose a reasoning among them, which of them should be greatest."}, {"s": 338400, "e": 356800, "t": "And Jesus, perceiving the thought of their heart, took a child, and set him by him, And said unto them, Whosoever shall receive this child in my name receiveth me: and whosoever shall receive me receiveth him that sent me: for he that is least among you all, the same shall be great."}, {"s": 356800, "e": 366133, "t": "And John answered and said, Master, we saw one casting out devils in thy name; and we forbad him, because he followeth not with us."}, {"s": 366133, "e": 372667, "t": "And Jesus said unto him, Forbid him not: for he that is not against us is for us."}, {"s": 372667, "e": 387333, "t": "And it came to pass, when the time was come that he should be received up, he stedfastly set his face to go to Jerusalem, And sent messengers before his face: and they went, and entered into a village of the Samaritans, to make ready for him."}, {"s": 387333, "e": 392000, "t": "And they did not receive him, because his face was as though he would go to Jerusalem."}, {"s": 392000, "e": 401200, "t": "And when his disciples James and John saw this, they said, Lord, wilt thou that we command fire to come down from heaven, and consume them, even as Elias did?"}, {"s": 401200, "e": 406933, "t": "But he turned, and rebuked them, and said, Ye know not what manner of spirit ye are of."}, {"s": 406933, "e": 411467, "t": "For the Son of man is not come to destroy men's lives, but to save them."}, {"s": 411467, "e": 413333, "t": "And they went to another village."}, {"s": 413333, "e": 420667, "t": "And it came to pass, that, as they went in the way, a certain man said unto him, Lord, I will follow thee whithersoever thou goest."}, {"s": 420667, "e": 428133, "t": "And Jesus said unto him, Foxes have holes, and birds of the air have nests; but the Son of man hath not where to lay his head."}, {"s": 428133, "e": 431333, "t": "And he said unto another, Follow me."}, {"s": 431333, "e": 435200, "t": "But he said, Lord, suffer me first to go and bury my father."}, {"s": 435200, "e": 440667, "t": "Jesus said unto him, Let the dead bury their dead: but go thou and preach the kingdom of God."}, {"s": 440667, "e": 447600, "t": "And another also said, Lord, I will follow thee; but let me first go bid them farewell, which are at home at my house."}, {"s": 447600, "e": 454933, "t": "And Jesus said unto him, No man, having put his hand to the plough, and looking back, is fit for the kingdom of God."}],a=document.getElementById('a'),t=document.getElementById('t')
