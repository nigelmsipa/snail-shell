 and took counsel how they might entangle him in his talk."}, {"s": 96400, "e": 110133, "t": "And they sent out unto him their disciples with the Herodians, saying, Master, we know that thou art true, and teachest the way of God in truth, neither carest thou for any man: for thou regardest not the person of men."}, {"s": 110133, "e": 112400, "t": "Tell us therefore, What thinkest thou?"}, {"s": 112400, "e": 116000, "t": "Is it lawful to give tribute unto Caesar, or not?"}, {"s": 116000, "e": 121333, "t": "But Jesus perceived their wickedness, and said, Why tempt ye me, ye hypocrites?"}, {"s": 121333, "e": 122800, "t": "Shew me the tribute money."}, {"s": 122800, "e": 124933, "t": "And they brought unto him a penny."}, {"s": 124933, "e": 128533, "t": "And he saith unto them, Whose is this image and superscription?"}, {"s": 128533, "e": 131333, "t": "They say unto him, Caesar's."}, {"s": 131333, "e": 139067, "t": "Then saith he unto them, Render therefore unto Caesar the things which are Caesar's; and unto God the things that are God's."}, {"s": 139067, "e": 144000, "t": "When they had heard these words, they marvelled, and left him, and went their way."}, {"s": 144000, "e": 158133, "t": "The same day came to him the Sadducees, which say that there is no resurrection, and asked him, Saying, Master, Moses said, If a man die, having no children, his brother shall marry his wife, and raise up seed unto his brother."}, {"s": 158133, "e": 172400, "t": "Now there were with us seven brethren: and the first, when he had married a wife, deceased, and, having no issue, left his wife unto his brother: Likewise the second also, and the third, unto the seventh."}, {"s": 172400, "e": 174400, "t": "And last of all the woman died also."}, {"s": 174400, "e": 178533, "t": "Therefore in the resurrection whose wife shall she be of the seven?"}, {"s": 178533, "e": 180533, "t": "for they all had her."}, {"s": 180533, "e": 187333, "t": "Jesus answered and said unto them, Ye do err, not knowing the scriptures, nor the power of God."}, {"s": 187333, "e": 194267, "t": "For in the resurrection they neither marry, nor are given in marriage, but are as the angels of God in heaven."}, {"s": 194267, "e": 204800, "t": "But as touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob?"}, {"s": 204800, "e": 208400, "t": "God is not the God of the dead, but of the living."}, {"s": 208400, "e": 212267, "t": "And when the multitude heard this, they were astonished at his doctrine."}, {"s": 212267, "e": 217733, "t": "But when the Pharisees had heard that he had put the Sadducees to silence, they were gathered together."}, {"s": 217733, "e": 226133, "t": "Then one of them, which was a lawyer, asked him a question, tempting him, and saying, Master, which is the great commandment in the law?"}, {"s": 226133, "e": 234267, "t": "Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind."}, {"s": 234267, "e": 236267, "t": "This is the first and great commandment."}, {"s": 236267, "e": 241067, "t": "And the second is like unto it, Thou shalt love thy neighbour as thyself."}, {"s": 241067, "e": 245067, "t": "On these two commandments hang all the law and the prophets."}, {"s": 245067, "e": 250533, "t": "While the Pharisees were gathered together, Jesus asked them, Saying, What think ye of Christ?"}, {"s": 250533, "e": 251733, "t": "whose son is he?"}, {"s": 251733, "e": 253867, "t": "They say unto him, The Son of David."}, {"s": 253867, "e": 264800, "t": "He saith unto them, How then doth David in spirit call him Lord, saying, The LORD said unto my Lord, Sit thou on my right hand, till I make thine enemies thy footstool?"}, {"s": 264800, "e": 268133, "t": "If David then call him Lord, how is he his son?"}, {"s": 268133, "e": 275067, "t": "And no man was able to answer him a word, neither durst any man f
