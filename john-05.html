<!doctype html><html lang="en"><head>

<title>john-05</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
   font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
   line-height:1.7;font-size:1.15rem}

<main><h1>john-05</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1467, "t": "John, Chapter Five."}, {"s": 1467, "e": 5867, "t": "After this there was a feast of the Jews; and Jesus went up to Jerusalem."}, {"s": 5867, "e": 12667, "t": "Now there is at Jerusalem by the sheep market a pool, which is called in the Hebrew tongue Bethesda, having five porches."}, {"s": 12667, "e": 20800, "t": "In these lay a great multitude of impotent folk, of blind, halt, withered, waiting for the moving of the water."}, {"s": 20800, "e": 31200, "t": "For an angel went down at a certain season into the pool, and troubled the water: whosoever then first after the troubling of the water stepped in was made whole of whatsoever disease he had."}, {"s": 31200, "e": 35600, "t": "And a certain man was there, which had an infirmity thirty and eight years."}, {"s": 35600, "e": 44267, "t": "When Jesus saw him lie, and knew that he had been now a long time in that case, he saith unto him, Wilt thou be made whole?"}, {"s": 44267, "e": 54000, "t": "The impotent man answered him, Sir, I have no man, when the water is troubled, to put me into the pool: but while I am coming, another steppeth down before me."}, {"s": 54000, "e": 58000, "t": "Jesus saith unto him, Rise, take up thy bed, and walk."}, {"s": 58000, "e": 64800, "t": "And immediately the man was made whole, and took up his bed, and walked: and on the same day was the sabbath."}, {"s": 64800, "e": 71867, "t": "The Jews therefore said unto him that was cured, It is the sabbath day: it is not lawful for thee to carry thy bed."}, {"s": 71867, "e": 78267, "t": "He answered them, He that made me whole, the same said unto me, Take up thy bed, and walk."}, {"s": 78267, "e": 84133, "t": "Then asked they him, What man is that which said unto thee, Take up thy bed, and walk?"}, {"s": 84133, "e": 91067, "t": "And he that was healed wist not who it was: for Jesus had conveyed himself away, a multitude being in that place."}, {"s": 91067, "e": 99733, "t": "Afterward Jesus findeth him in the temple, and said unto him, Behold, thou art made whole: sin no more, lest a worse thing come unto thee."}, {"s": 99733, "e": 104800, "t": "The man departed, and told the Jews that it was Jesus, which had made him whole."}, {"s": 104800, "e": 111600, "t": "And therefore did the Jews persecute Jesus, and sought to slay him, because he had done these things on the sabbath day."}, {"s": 111600, "e": 116800, "t": "But Jesus answered them, My Father worketh hitherto, and I work."}, {"s": 116800, "e": 126133, "t": "Therefore the Jews sought the more to kill him, because he not only had broken the sabbath, but said also that God was his Father, making himself equal with God."}, {"s": 126133, "e": 140400, "t": "Then answered Jesus and said unto them, Verily, verily, I say unto you, The Son can do nothing of himself, but what he seeth the Father do: for what things soever he doeth, these also doeth the Son likewise."}, {"s": 140400, "e": 148933, "t": "For the Father loveth the Son, and sheweth him all things that himself doeth: and he will shew him greater works than these, that ye may marvel."}, {"s": 148933, "e": 155600, "t": "For as the Father raiseth up the dead, and quickeneth them; even so the Son quickeneth whom he will."}, {"s": 155600, "e": 164133, "t": "For the Father judgeth no man, but hath committed all judgment unto the Son: That all men should honour the Son, even as they honour the Father."}, {"s": 164133, "e": 168400, "t": "He that honoureth not the Son honoureth not the Father which hath sent him."}, {"s": 168400, "e": 180000, "t": "Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life."}, {"s": 180000, "e": 189067, "t": "Verily, verily, I say unto you, The hour is coming, and now is, when the dead shall hear the voice of the Son of God: and they that hear shall live."}, {"s": 189067, "e": 200667, "t": "For as the Father hath life in himself; so hath he given to the Son to have life in himself; And hath given him authority to execute judgment also, because he is the Son of man."}, {"s": 200667, "e": 215333, "t": "Marvel not at this: for the hour is coming, in the which all that are in the graves shall hear his voice, And shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of damnation."}, {"s": 215333, "e": 226267, "t": "I can of mine own self do nothing: as I hear, I judge: and my judgment is just; because I seek not mine own will, but the will of the Father which hath sent me."}, {"s": 226267, "e": 230267, "t": "If I bear witness of myself, my witness is not true."}, {"s": 230267, "e": 236800, "t": "There is another that beareth witness of me; and I know that the witness which he witnesseth of me is true."}, {"s": 236800, "e": 241067, "t": "Ye sent unto John, and he bare witness unto the truth."}, {"s": 241067, "e": 247067, "t": "But I receive not testimony from man: but these things I say, that ye might be saved."}, {"s": 247067, "e": 252267, "t": "He was a burning and a shining light: and ye were willing for a season to rejoice in his light."}, {"s": 252267, "e": 262933, "t": "But I have greater witness than that of John: for the works which the Father hath given me to finish, the same works that I do, bear witness of me, that the Father hath sent me."}, {"s": 262933, "e": 266533, "t": "And the Father himself, which hath sent me, hath borne witness of me."}, {"s": 266533, "e": 270267, "t": "Ye have neither heard his voice at any time, nor seen his shape."}, {"s": 270267, "e": 276000, "t": "And ye have not his word abiding in you: for whom he hath sent, him ye believe not."}, {"s": 276000, "e": 282667, "t": "Search the scriptures; for in them ye think ye have eternal life: and they are they which testify of me."}, {"s": 282667, "e": 286000, "t": "And ye will not come to me, that ye might have life."}, {"s": 286000, "e": 288000, "t": "I receive not honour from men."}, {"s": 288000, "e": 291867, "t": "But I know you, that ye have not the love of God in you."}, {"s": 291867, "e": 298667, "t": "I am come in my Father's name, and ye receive me not: if another shall come in his own name, him ye will receive."}, {"s": 298667, "e": 305200, "t": "How can ye believe, which receive honour one of another, and seek not the honour that cometh from God only?"}, {"s": 305200, "e": 312533, "t": "Do not think that I will accuse you to the Father: there is one that accuseth you, even Moses, in whom ye trust."}, {"s": 312533, "e": 316667, "t": "For had ye believed Moses, ye would have believed me: for he wrote of me."}, {"s": 316667, "e": 321067, "t": "But if ye believe not his writings, how shall ye believe my words?"}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
