<script>
const S=[{"s": 0, "e": 1467, "t": "John, Chapter Seven."}, {"s": 1467, "e": 7600, "t": "After these things Jesus walked in Galilee: for he would not walk in Jewry, because the Jews sought to kill him."}, {"s": 7600, "e": 10667, "t": "Now the Jews' feast of tabernacles was at hand."}, {"s": 10667, "e": 19067, "t": "His brethren therefore said unto him, Depart hence, and go into Judaea, that thy disciples also may see the works that thou doest."}, {"s": 19067, "e": 25333, "t": "For there is no man that doeth any thing in secret, and he himself seeketh to be known openly."}, {"s": 25333, "e": 28800, "t": "If thou do these things, shew thyself to the world."}, {"s": 28800, "e": 31333, "t": "For neither did his brethren believe in him."}, {"s": 31333, "e": 37467, "t": "Then Jesus said unto them, My time is not yet come: but your time is alway ready."}, {"s": 37467, "e": 44933, "t": "The world cannot hate you; but me it hateth, because I testify of it, that the works thereof are evil."}, {"s": 44933, "e": 51600, "t": "Go ye up unto this feast: I go not up yet unto this feast; for my time is not yet full come."}, {"s": 51600, "e": 56000, "t": "When he had said these words unto them, he abode still in Galilee."}, {"s": 56000, "e": 63600, "t": "But when his brethren were gone up, then went he also up unto the feast, not openly, but as it were in secret."}, {"s": 63600, "e": 67867, "t": "Then the Jews sought him at the feast, and said, Where is he?"}, {"s": 67867, "e": 76933, "t": "And there was much murmuring among the people concerning him: for some said, He is a good man: others said, Nay; but he deceiveth the people."}, {"s": 76933, "e": 80400, "t": "Howbeit no man spake openly of him for fear of the Jews."}, {"s": 80400, "e": 84533, "t": "Now about the midst of the feast Jesus went up into the temple, and taught."}, {"s": 84533, "e": 88933, "t": "And the Jews marvelled, saying, How knoweth this man letters, having never learned?"}, {"s": 88933, "e": 93600, "t": "Jesus answered them, and said, My doctrine is not mine, but his that sent me."}, {"s": 93600, "e": 100000, "t": "If any man will do his will, he shall know of the doctrine, whether it be of God, or whether I speak of myself."}, {"s": 100000, "e": 109467, "t": "He that speaketh of himself seeketh his own glory: but he that seeketh his glory that sent him, the same is true, and no unrighteousness is in him."}, {"s": 109467, "e": 113600, "t": "Did not Moses give you the law, and yet none of you keepeth the law?"}, {"s": 113600, "e": 115867, "t": "Why go ye about to kill me?"}, {"s": 115867, "e": 121467, "t": "The people answered and said, Thou hast a devil: who goeth about to kill thee?"}, {"s": 121467, "e": 126133, "t": "Jesus answered and said unto them, I have done one work, and ye all marvel."}, {"s": 126133, "e": 134800, "t": "Moses therefore gave unto you circumcision; (not because it is of Moses, but of the fathers;) and ye on the sabbath day circumcise a man."}, {"s": 134800, "e": 144667, "t": "If a man on the sabbath day receive circumcision, that the law of Moses should not be broken; are ye angry at me, because I have made a man every whit whole on the sabbath day?"}, {"s": 144667, "e": 148267, "t": "Judge not according to the appearance, but judge righteous judgment."}, {"s": 148267, "e": 153467, "t": "Then said some of them of Jerusalem, Is not this he, whom they seek to kill?"}, {"s": 153467, "e": 157067, "t": "But, lo, he speaketh boldly, and they say nothing unto him."}, {"s": 157067, "e": 160133, "t": "Do the rulers know indeed that this is the very Christ?"}, {"s": 160133, "e": 166400, "t": "Howbeit we know this man whence he is: but when Christ cometh, no man knoweth whence he is."}, {"s": 166400, "e": 177733, "t": "Then cried Jesus in the temple as he taught, saying, Ye both know me, and ye know whence I am: and I am not come of myself, but he that sent me is true, whom ye know not."}, {"s": 177733, "e": 182267, "t": "But I know him: for I am from him, and he hath sent me."}, {"s": 182267, "e": 187600, "t": "Then they sought to take him: but no man laid hands on him, because his hour was not yet come."}, {"s": 187600, "e": 194933, "t": "And many of the people believed on him, and said, When Christ cometh, will he do more miracles than these which this man hath done?"}, {"s": 194933, "e": 202667, "t": "The Pharisees heard that the people murmured such things concerning him; and the Pharisees and the chief priests sent officers to take him."}, {"s": 202667, "e": 209200, "t": "Then said Jesus unto them, Yet a little while am I with you, and then I go unto him that sent me."}, {"s": 209200, "e": 214267, "t": "Ye shall seek me, and shall not find me: and where I am, thither ye cannot come."}, {"s": 214267, "e": 219200, "t": "Then said the Jews among themselves, Whither will he go, that we shall not find him?"}, {"s": 219200, "e": 223200, "t": "will he go unto the dispersed among the Gentiles, and teach the Gentiles?"}, {"s": 223200, "e": 231333, "t": "What manner of saying is this that he said, Ye shall seek me, and shall not find me: and where I am, thither ye cannot come?"}, {"s": 231333, "e": 240133, "t": "In the last day, that great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink."}, {"s": 240133, "e": 246000, "t": "He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water."}, {"s": 246000, "e": 260933, "t": "(But this spake he of the Spirit, which they that believe on him should receive: for the Holy Ghost was not yet given; because that Jesus was not yet glorified.) Many of the people therefore, when they heard this saying, said, Of a truth this is the Prophet."}, {"s": 260933, "e": 263600, "t": "Others said, This is the Christ."}, {"s": 263600, "e": 266533, "t": "But some said, Shall Christ come out of Galilee?"}, {"s": 266533, "e": 274933, "t": "Hath not the scripture said, That Christ cometh of the seed of David, and out of the town of Bethlehem, where David was?"}, {"s": 274933, "e": 277733, "t": "So there was a division among the people because of him."}, {"s": 277733, "e": 282133, "t": "And some of them would have taken him; but no man laid hands on him."}, {"s": 282133, "e": 288933, "t": "Then came the officers to the chief priests and Pharisees; and they said unto them, Why have ye not brought him?"}, {"s": 288933, "e": 292267, "t": "The officers answered, Never man spake like this man."}, {"s": 292267, "e": 295867, "t": "Then answered them the Pharisees, Are ye also deceived?"}, {"s": 295867, "e": 299867, "t": "Have any of the rulers or of the Pharisees believed on him?"}, {"s": 299867, "e": 303200, "t": "But this people who knoweth not the law are cursed."}, {"s": 303200, "e": 312133, "t": "Nicodemus saith unto them, (he that came to Jesus by night, being one of them,) Doth our law judge any man, before it hear him, and know what he doeth?"}, {"s": 312133, "e": 316533, "t": "They answered and said unto him, Art thou also of Galilee?"}, {"s": 316533, "e": 320667, "t": "Search, and look: for out of Galilee ariseth no prophet."}, {"s": 320667, "e": 323200, "t": "And every man went unto his own house."}],a=document.getElementById('a'),t=document.getElementById('t');
