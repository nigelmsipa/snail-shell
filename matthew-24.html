gdom shall be preached in all the world for a witness unto all nations; and then shall the end come."}, {"s": 92933, "e": 110000, "t": "When ye therefore shall see the abomination of desolation, spoken of by Daniel the prophet, stand in the holy place, (whoso readeth, let him understand:) Then let them which be in Judaea flee into the mountains: Let him which is on the housetop not come down to take any thing out of his house:"}, {"s": 110000, "e": 113467, "t": "Neither let him which is in the field return back to take his clothes."}, {"s": 113467, "e": 118267, "t": "And woe unto them that are with child, and to them that give suck in those days!"}, {"s": 118267, "e": 129467, "t": "But pray ye that your flight be not in the winter, neither on the sabbath day: For then shall be great tribulation, such as was not since the beginning of the world to this time, no, nor ever shall be."}, {"s": 129467, "e": 136533, "t": "And except those days should be shortened, there should no flesh be saved: but for the elect's sake those days shall be shortened."}, {"s": 136533, "e": 142933, "t": "Then if any man shall say unto you, Lo, here is Christ, or there; believe it not."}, {"s": 142933, "e": 154000, "t": "For there shall arise false Christs, and false prophets, and shall shew great signs and wonders; insomuch that, if it were possible, they shall deceive the very elect."}, {"s": 154000, "e": 156267, "t": "Behold, I have told you before."}, {"s": 156267, "e": 164400, "t": "Wherefore if they shall say unto you, Behold, he is in the desert; go not forth: behold, he is in the secret chambers; believe it not."}, {"s": 164400, "e": 171200, "t": "For as the lightning cometh out of the east, and shineth even unto the west; so shall also the coming of the Son of man be."}, {"s": 171200, "e": 175467, "t": "For wheresoever the carcase is, there will the eagles be gathered together."}, {"s": 175467, "e": 189600, "t": "Immediately after the tribulation of those days shall the sun be darkened, and the moon shall not give her light, and the stars shall fall from heaven, and the powers of the heavens shall be shaken: And then shall appear the sign of the Son of man in heaven:"}, {"s": 189600, "e": 198000, "t": "and then shall all the tribes of the earth mourn, and they shall see the Son of man coming in the clouds of heaven with power and great glory."}, {"s": 198000, "e": 206667, "t": "And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other."}, {"s": 206667, "e": 219867, "t": "Now learn a parable of the fig tree; When his branch is yet tender, and putteth forth leaves, ye know that summer is nigh: So likewise ye, when ye shall see all these things, know that it is near, even at the doors."}, {"s": 219867, "e": 226000, "t": "Verily I say unto you, This generation shall not pass, till all these things be fulfilled."}, {"s": 226000, "e": 230667, "t": "Heaven and earth shall pass away, but my words shall not pass away."}, {"s": 230667, "e": 236667, "t": "But of that day and hour knoweth no man, no, not the angels of heaven, but my Father only."}, {"s": 236667, "e": 240933, "t": "But as the days of Noe were, so shall also the coming of the Son of man be."}, {"s": 240933, "e": 255600, "t": "For as in the days that were before the flood they were eating and drinking, marrying and giving in marriage, until the day that Noe entered into the ark, And knew not until the flood came, and took them all away; so shall also the coming of the Son of man be."}, {"s": 255600, "e": 260133, "t": "Then shall two be in the field; the one shall be taken, and the other left."}, {"s": 260133, "e": 265067, "t": "Two women shall be grinding at the mill; the one shall be taken, and the other left."}, {"s": 265067, "e": 269600, "t": "Watch therefore: for ye know not what hour your Lord doth come."}, {"s": 269600, "e": 278533, "t": "But know this, that if the goodman of the house had known in what watch the thief would come, he would have watched, and would not have suffered his house to be broken up."}, {"s": 278533, "e": 284667, "t": "Therefore be ye also ready: for in such an hour as ye think not the Son of man cometh."}, {"s": 284667, "e": 292267, "t": "Who then is a faithful and wise servant, whom his lord hath made ruler over his household, to give them meat in due season?"}, {"s": 292267, "e": 296667, "t": "Blessed is that servant, whom his lord when he cometh shall find so doing."}, {"s": 296667, "e": 301200, "t": "Verily I say unto you, That he shall make him ruler over all his goods."}, {"s": 301200, "e": 318133, "t": "But and if that evil servant shall say in his heart, My lord delayeth his coming; And shall begin to smite his fellowservants, and to eat and drink with the drunken; The lord of that servant shall come in a day when he looketh not for him, and in an hour that he is not aware of,"}, {"s": 318133, "e": 324667, "t": "And shall cut him asunder, and appoint him his portion with the hypocrites: there shall be weeping and gnashing of teeth."}],a=document.getElementById('a'),t=document.getElementById('t');
