const S=[{"s": 0, "e": 1600, "t": "Mark, Chapter Fifteen."}, {"s": 1600, "e": 12400, "t": "And straightway in the morning the chief priests held a consultation with the elders and scribes and the whole council, and bound Jesus, and carried him away, and delivered him to Pilate."}, {"s": 12400, "e": 16000, "t": "And Pilate asked him, Art thou the King of the Jews?"}, {"s": 16000, "e": 18933, "t": "And he answering said unto him, Thou sayest it."}, {"s": 18933, "e": 23200, "t": "And the chief priests accused him of many things: but he answered nothing."}, {"s": 23200, "e": 27467, "t": "And Pilate asked him again, saying, Answerest thou nothing?"}, {"s": 27467, "e": 30400, "t": "behold how many things they witness against thee."}, {"s": 30400, "e": 34400, "t": "But Jesus yet answered nothing; so that Pilate marvelled."}, {"s": 34400, "e": 39200, "t": "Now at that feast he released unto them one prisoner, whomsoever they desired."}, {"s": 39200, "e": 46667, "t": "And there was one named Barabbas, which lay bound with them that had made insurrection with him, who had committed murder in the insurrection."}, {"s": 46667, "e": 51733, "t": "And the multitude crying aloud began to desire him to do as he had ever done unto them."}, {"s": 51733, "e": 56133, "t": "But Pilate answered them, saying, Will ye that I release unto you the King of the Jews?"}, {"s": 56133, "e": 59600, "t": "For he knew that the chief priests had delivered him for envy."}, {"s": 59600, "e": 64933, "t": "But the chief priests moved the people, that he should rather release Barabbas unto them."}, {"s": 64933, "e": 72133, "t": "And Pilate answered and said again unto them, What will ye then that I shall do unto him whom ye call the King of the Jews?"}, {"s": 72133, "e": 74667, "t": "And they cried out again, Crucify him."}, {"s": 74667, "e": 78533, "t": "Then Pilate said unto them, Why, what evil hath he done?"}, {"s": 78533, "e": 81600, "t": "And they cried out the more exceedingly, Crucify him."}, {"s": 81600, "e": 90000, "t": "And so Pilate, willing to content the people, released Barabbas unto them, and delivered Jesus, when he had scourged him, to be crucified."}, {"s": 90000, "e": 95867, "t": "And the soldiers led him away into the hall, called Praetorium; and they call together the whole band."}, {"s": 95867, "e": 105067, "t": "And they clothed him with purple, and platted a crown of thorns, and put it about his head, And began to salute him, Hail, King of the Jews!"}, {"s": 105067, "e": 111067, "t": "And they smote him on the head with a reed, and did spit upon him, and bowing their knees worshipped him."}, {"s": 111067, "e": 118533, "t": "And when they had mocked him, they took off the purple from him, and put his own clothes on him, and led him out to crucify him."}, {"s": 118533, "e": 127333, "t": "And they compel one Simon a Cyrenian, who passed by, coming out of the country, the father of Alexander and Rufus, to bear his cross."}, {"s": 127333, "e": 133067, "t": "And they bring him unto the place Golgotha, which is, being interpreted, The place of a skull."}, {"s": 133067, "e": 137867, "t": "And they gave him to drink wine mingled with myrrh: but he received it not."}, {"s": 137867, "e": 144933, "t": "And when they had crucified him, they parted his garments, casting lots upon them, what every man should take."}, {"s": 144933, "e": 147733, "t": "And it was the third hour, and they crucified him."}, {"s": 147733, "e": 153467, "t": "And the superscription of his accusation was written over, THE KING OF THE JEWS."}, {"s": 153467, "e": 159467, "t": "And with him they crucify two thieves; the one on his right hand, and the other on his left."}, {"s": 159467, "e": 164400, "t": "And the scripture was fulfilled, which saith, And he was numbered with the transgressors."}, {"s": 164400, "e": 176133, "t": "And they that passed by railed on him, wagging their heads, and saying, Ah, thou that destroyest the temple, and buildest it in three days, Save thyself, and come down from the cross."}, {"s": 176133, "e": 184000, "t": "Likewise also the chief priests mocking said among themselves with the scribes, He saved others; himself he cannot save."}, {"s": 184000, "e": 189333, "t": "Let Christ the King of Israel descend now from the cross, that we may see and believe."}, {"s": 189333, "e": 192533, "t": "And they that were crucified with him reviled him."}, {"s": 192533, "e": 197733, "t": "And when the sixth hour was come, there was darkness over the whole land until the ninth hour."}, {"s": 197733, "e": 203733, "t": "And at the ninth hour Jesus cried with a loud voice, saying, Eloi, Eloi, lama sabachthani?"}, {"s": 203733, "e": 209067, "t": "which is, being interpreted, My God, my God, why hast thou forsaken me?"}, {"s": 209067, "e": 214667, "t": "And some of them that stood by, when they heard it, said, Behold, he calleth Elias."}, {"s": 214667, "e": 224267, "t": "And one ran and filled a spunge full of vinegar, and put it on a reed, and gave him to drink, saying, Let alone; let us see whether Elias will come to take him down."}, {"s": 224267, "e": 227600, "t": "And Jesus cried with a loud voice, and gave up the ghost."}, {"s": 227600, "e": 231867, "t": "And the veil of the temple was rent in twain from the top to the bottom."}, {"s": 231867, "e": 240800, "t": "And when the centurion, which stood over against him, saw that he so cried out, and gave up the ghost, he said, Truly this man was the Son of God."}, {"s": 240800, "e": 257867, "t": "There were also women looking on afar off: among whom was Mary Magdalene, and Mary the mother of James the less and of Joses, and Salome; (Who also, when he was in Galilee, followed him, and ministered unto him;) and many other women which came up with him unto Jerusalem."}, {"s": 257867, "e": 273600, "t": "And now when the even was come, because it was the preparation, that is, the day before the sabbath, Joseph of Arimathaea, an honourable counseller, which also waited for the kingdom of God, came, and went in boldly unto Pilate, and craved the body of Jesus."}, {"s": 273600, "e": 281200, "t": "And Pilate marvelled if he were already dead: and calling unto him the centurion, he asked him whether he had been any while dead."}, {"s": 281200, "e": 284800, "t": "And when he knew it of the centurion, he gave the body to Joseph."}, {"s": 284800, "e": 294400, "t": "And he bought fine linen, and took him down, and wrapped him in the linen, and laid him in a sepulchre which was hewn out of a rock, and rolled a stone unto the door of the sepulchre."}, {"s": 294400, "e": 298133, "t": "And Mary Magdalene and Mary the mother of Joses beheld where he was laid."}],a=document.getElementById('a'),t=document.getElementById('t');
