<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>matthew-04</title>
<style>
 :root{--bg:#f4efe6;--fg:#2b2b2b;--hi:#ffe08a;--dim:#9a9388}
 *{box-sizing:border-box}

   line-height:1.7;font-size:1.15rem}

 audio{width:100%}
 main{max-width:42rem;margin:0 auto;padding:1.2rem 1.1rem 40vh}
 h1{font-size:1.1rem;color:var(--dim);font-weight:600;margin:.2rem 0 1rem}

 .spd button.on{background:var(--hi);border-color:#e0c050}
</style></head><body>
<header><audio id="a" src="matthew-04.opus" controls preload="metadata"></audio>
<div class="spd">Speed:
 <button data-r="1" class="on">1&times;</button><button data-r="1.25">1.25&times;</button>
 <button data-r="1.5">1.5&times;</button><button data-r="2">2&times;</button></div></header>
<main><h1>matthew-04</h1><p id="t"></p></main>
<script>
const S=[{"s": 0, "e": 1600, "t": "Matthew, Chapter Four."}, {"s": 1600, "e": 6400, "t": "Then was Jesus led up of the Spirit into the wilderness to be tempted of the devil."}, {"s": 6400, "e": 11067, "t": "And when he had fasted forty days and forty nights, he was afterward an hungred."}, {"s": 11067, "e": 18533, "t": "And when the tempter came to him, he said, If thou be the Son of God, command that these stones be made bread."}, {"s": 18533, "e": 27467, "t": "But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God."}, {"s": 27467, "e": 44400, "t": "Then the devil taketh him up into the holy city, and setteth him on a pinnacle of the temple, And saith unto him, If thou be the Son of God, cast thyself down: for it is written, He shall give his angels charge concerning thee: and in their hands they shall bear thee up,"}, {"s": 44400, "e": 47867, "t": "lest at any time thou dash thy foot against a stone."}, {"s": 47867, "e": 52933, "t": "Jesus said unto him, It is written again, Thou shalt not tempt the Lord thy God."}, {"s": 52933, "e": 65600, "t": "Again, the devil taketh him up into an exceeding high mountain, and sheweth him all the kingdoms of the world, and the glory of them; And saith unto him, All these things will I give thee, if thou wilt fall down and worship me."}, {"s": 65600, "e": 73867, "t": "Then saith Jesus unto him, Get thee hence, Satan: for it is written, Thou shalt worship the Lord thy God, and him only shalt thou serve."}, {"s": 73867, "e": 79467, "t": "Then the devil leaveth him, and, behold, angels came and ministered unto him."}, {"s": 79467, "e": 96667, "t": "Now when Jesus had heard that John was cast into prison, he departed into Galilee; And leaving Nazareth, he came and dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim: That it might be fulfilled which was spoken by Esaias the prophet, saying,"}, {"s": 96667, "e": 111200, "t": "The land of Zabulon, and the land of Nephthalim, by the way of the sea, beyond Jordan, Galilee of the Gentiles; The people which sat in darkness saw great light; and to them which sat in the region and shadow of death light is sprung up."}, {"s": 111200, "e": 117467, "t": "From that time Jesus began to preach, and to say, Repent: for the kingdom of heaven is at hand."}, {"s": 117467, "e": 126667, "t": "And Jesus, walking by the sea of Galilee, saw two brethren, Simon called Peter, and Andrew his brother, casting a net into the sea: for they were fishers."}, {"s": 126667, "e": 131733, "t": "And he saith unto them, Follow me, and I will make you fishers of men."}, {"s": 131733, "e": 135200, "t": "And they straightway left their nets, and followed him."}, {"s": 135200, "e": 146133, "t": "And going on from thence, he saw other two brethren, James the son of Zebedee, and John his brother, in a ship with Zebedee their father, mending their nets; and he called them."}, {"s": 146133, "e": 149867, "t": "And they immediately left the ship and their father, and followed him."}, {"s": 149867, "e": 159600, "t": "And Jesus went about all Galilee, teaching in their synagogues, and preaching the gospel of the kingdom, and healing all manner of sickness and all manner of disease among the people."}, {"s": 159600, "e": 173733, "t": "And his fame went throughout all Syria: and they brought unto him all sick people that were taken with divers diseases and torments, and those which were possessed with devils, and those which were lunatick, and those that had the palsy; and he healed them."}, {"s": 173733, "e": 182133, "t": "And there followed him great multitudes of people from Galilee, and from Decapolis, and from Jerusalem, and from Judaea, and from beyond Jordan."}],a=document.getElementById('a'),t=document.getElementById('t');
const spans=S.map((c,i)=>{const e=document.createElement('span');
 e.className='s';e.textContent=c.t+' ';e.onclick=()=>{a.currentTime=c.s/1000;a.play()};
 t.appendChild(e);return e});
let cur=-1;
function find(ms){if(cur>=0&&ms>=S[cur].s&&ms<S[cur].e)return cur;
 for(let i=0;i<S.length;i++)if(ms>=S[i].s&&ms<S[i].e)return i;return -1}
a.addEventListener('timeupdate',()=>{const ms=a.currentTime*1000,i=find(ms);
 if(i===cur)return; if(cur>=0)spans[cur].classList.remove('active');
 cur=i; if(i>=0){spans[i].classList.add('active');
  spans[i].scrollIntoView({block:'center',behavior:'smooth'})}});
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
 a.playbackRate=parseFloat(b.dataset.r); a.preservesPitch=true;
 document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
</script></body></html>
