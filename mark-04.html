<script>
const S=[{"s": 0, "e": 1467, "t": "Mark, Chapter Four."}, {"s": 1467, "e": 13733, "t": "And he began again to teach by the sea side: and there was gathered unto him a great multitude, so that he entered into a ship, and sat in the sea; and the whole multitude was by the sea on the land."}, {"s": 13733, "e": 28400, "t": "And he taught them many things by parables, and said unto them in his doctrine, Hearken; Behold, there went out a sower to sow: And it came to pass, as he sowed, some fell by the way side, and the fowls of the air came and devoured it up."}, {"s": 28400, "e": 40267, "t": "And some fell on stony ground, where it had not much earth; and immediately it sprang up, because it had no depth of earth: But when the sun was up, it was scorched; and because it had no root, it withered away."}, {"s": 40267, "e": 45600, "t": "And some fell among thorns, and the thorns grew up, and choked it, and it yielded no fruit."}, {"s": 45600, "e": 54000, "t": "And other fell on good ground, and did yield fruit that sprang up and increased; and brought forth, some thirty, and some sixty, and some an hundred."}, {"s": 54000, "e": 58267, "t": "And he said unto them, He that hath ears to hear, let him hear."}, {"s": 58267, "e": 63333, "t": "And when he was alone, they that were about him with the twelve asked of him the parable."}, {"s": 63333, "e": 79600, "t": "And he said unto them, Unto you it is given to know the mystery of the kingdom of God: but unto them that are without, all these things are done in parables: That seeing they may see, and not perceive; and hearing they may hear, and not understand; lest at any time they should be converted,"}, {"s": 79600, "e": 82533, "t": "and their sins should be forgiven them."}, {"s": 82533, "e": 85867, "t": "And he said unto them, Know ye not this parable?"}, {"s": 85867, "e": 89067, "t": "and how then will ye know all parables?"}, {"s": 89067, "e": 90800, "t": "The sower soweth the word."}, {"s": 90800, "e": 99733, "t": "And these are they by the way side, where the word is sown; but when they have heard, Satan cometh immediately, and taketh away the word that was sown in their hearts."}, {"s": 99733, "e": 116800, "t": "And these are they likewise which are sown on stony ground; who, when they have heard the word, immediately receive it with gladness; And have no root in themselves, and so endure but for a time: afterward, when affliction or persecution ariseth for the word's sake, immediately they are offended."}, {"s": 116800, "e": 131067, "t": "And these are they which are sown among thorns; such as hear the word, And the cares of this world, and the deceitfulness of riches, and the lusts of other things entering in, choke the word, and it becometh unfruitful."}, {"s": 131067, "e": 141067, "t": "And these are they which are sown on good ground; such as hear the word, and receive it, and bring forth fruit, some thirtyfold, some sixty, and some an hundred."}, {"s": 141067, "e": 146000, "t": "And he said unto them, Is a candle brought to be put under a bushel, or under a bed?"}, {"s": 146000, "e": 148133, "t": "and not to be set on a candlestick?"}, {"s": 148133, "e": 155733, "t": "For there is nothing hid, which shall not be manifested; neither was any thing kept secret, but that it should come abroad."}, {"s": 155733, "e": 158667, "t": "If any man have ears to hear, let him hear."}, {"s": 158667, "e": 167867, "t": "And he said unto them, Take heed what ye hear: with what measure ye mete, it shall be measured to you: and unto you that hear shall more be given."}, {"s": 167867, "e": 175333, "t": "For he that hath, to him shall be given: and he that hath not, from him shall be taken even that which he hath."}, {"s": 175333, "e": 187333, "t": "And he said, So is the kingdom of God, as if a man should cast seed into the ground; And should sleep, and rise night and day, and the seed should spring and grow up, he knoweth not how."}, {"s": 187333, "e": 193067, "t": "For the earth bringeth forth fruit of herself; first the blade, then the ear, after that the full corn in the ear."}, {"s": 193067, "e": 198667, "t": "But when the fruit is brought forth, immediately he putteth in the sickle, because the harvest is come."}, {"s": 198667, "e": 202400, "t": "And he said, Whereunto shall we liken the kingdom of God?"}, {"s": 202400, "e": 205600, "t": "or with what comparison shall we compare it?"}, {"s": 205600, "e": 223333, "t": "It is like a grain of mustard seed, which, when it is sown in the earth, is less than all the seeds that be in the earth: But when it is sown, it groweth up, and becometh greater than all herbs, and shooteth out great branches; so that the fowls of the air may lodge under the shadow of it."}, {"s": 223333, "e": 228133, "t": "And with many such parables spake he the word unto them, as they were able to hear it."}, {"s": 228133, "e": 235200, "t": "But without a parable spake he not unto them: and when they were alone, he expounded all things to his disciples."}, {"s": 235200, "e": 241867, "t": "And the same day, when the even was come, he saith unto them, Let us pass over unto the other side."}, {"s": 241867, "e": 246533, "t": "And when they had sent away the multitude, they took him even as he was in the ship."}, {"s": 246533, "e": 249600, "t": "And there were also with him other little ships."}, {"s": 249600, "e": 256000, "t": "And there arose a great storm of wind, and the waves beat into the ship, so that it was now full."}, {"s": 256000, "e": 266267, "t": "And he was in the hinder part of the ship, asleep on a pillow: and they awake him, and say unto him, Master, carest thou not that we perish?"}, {"s": 266267, "e": 271867, "t": "And he arose, and rebuked the wind, and said unto the sea, Peace, be still."}, {"s": 271867, "e": 274800, "t": "And the wind ceased, and there was a great calm."}, {"s": 274800, "e": 278133, "t": "And he said unto them, Why are ye so fearful?"}, {"s": 278133, "e": 280533, "t": "how is it that ye have no faith?"
