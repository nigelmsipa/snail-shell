const S=[{"s": 0, "e": 1867, "t": "Luke, Chapter Nineteen."}, {"s": 1867, "e": 5467, "t": "And Jesus entered and passed through Jericho."}, {"s": 5467, "e": 11067, "t": "And, behold, there was a man named Zacchaeus, which was the chief among the publicans, and he was rich."}, {"s": 11067, "e": 17867, "t": "And he sought to see Jesus who he was; and could not for the press, because he was little of stature."}, {"s": 17867, "e": 24267, "t": "And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way."}, {"s": 24267, "e": 34400, "t": "And when Jesus came to the place, he looked up, and saw him, and said unto him, Zacchaeus, make haste, and come down; for to day I must abide at thy house."}, {"s": 34400, "e": 38400, "t": "And he made haste, and came down, and received him joyfully."}, {"s": 38400, "e": 44000, "t": "And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner."}, {"s": 44000, "e": 55600, "t": "And Zacchaeus stood, and said unto the Lord; Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold."}, {"s": 55600, "e": 62533, "t": "And Jesus said unto him, This day is salvation come to this house, forsomuch as he also is a son of Abraham."}, {"s": 62533, "e": 66533, "t": "For the Son of man is come to seek and to save that which was lost."}, {"s": 66533, "e": 75733, "t": "And as they heard these things, he added and spake a parable, because he was nigh to Jerusalem, and because they thought that the kingdom of God should immediately appear."}, {"s": 75733, "e": 83067, "t": "He said therefore, A certain nobleman went into a far country to receive for himself a kingdom, and to return."}, {"s": 83067, "e": 89867, "t": "And he called his ten servants, and delivered them ten pounds, and said unto them, Occupy till I come."}, {"s": 89867, "e": 96400, "t": "But his citizens hated him, and sent a message after him, saying, We will not have this man to reign over us."}, {"s": 96400, "e": 108267, "t": "And it came to pass, that when he was returned, having received the kingdom, then he commanded these servants to be called unto him, to whom he had given the money, that he might know how much every man had gained by trading."}, {"s": 108267, "e": 113733, "t": "Then came the first, saying, Lord, thy pound hath gained ten pounds."}, {"s": 113733, "e": 121467, "t": "And he said unto him, Well, thou good servant: because thou hast been faithful in a very little, have thou authority over ten cities."}, {"s": 121467, "e": 126667, "t": "And the second came, saying, Lord, thy pound hath gained five pounds."}, {"s": 126667, "e": 130933, "t": "And he said likewise to him, Be thou also over five cities."}, {"s": 130933, "e": 145733, "t": "And another came, saying, Lord, behold, here is thy pound, which I have kept laid up in a napkin: For I feared thee, because thou art an austere man: thou takest up that thou layedst not down, and reapest that thou didst not sow."}, {"s": 145733, "e": 150667, "t": "And he saith unto him, Out of thine own mouth will I judge thee, thou wicked servant."}, {"s": 150667, "e": 164800, "t": "Thou knewest that I was an austere man, taking up that I laid not down, and reaping that I did not sow: Wherefore then gavest not thou my money into the bank, that at my coming I might have required mine own with usury?"}, {"s": 164800, "e": 170933, "t": "And he said unto them that stood by, Take from him the pound, and give it to him that hath ten pounds."}, {"s": 170933, "e": 183200, "t": "(And they said unto him, Lord, he hath ten pounds.) For I say unto you, That unto every one which hath shall be given; and from him that hath not, even that he hath shall be taken away from him."}, {"s": 183200, "e": 188667, "t": "But those mine enemies, which would not that I should reign over them, bring hither, and slay them before me."}, {"s": 188667, "e": 192933, "t": "And when he had thus spoken, he went before, ascending up to Jerusalem."}, {"s": 192933, "e": 210400, "t": "And it came to pass, when he was come nigh to Bethphage and Bethany, at the mount called the mount of Olives, he sent two of his disciples, Saying, Go ye into the village over against you; in the which at your entering ye shall find a colt tied, whereon yet never man sat: loose him,"}, {"s": 210400, "e": 212133, "t": "and bring him hither."}, {"s": 212133, "e": 215467, "t": "And if any man ask you, Why do ye loose him?"}, {"s": 215467, "e": 219333, "t": "thus shall ye say unto him, Because the Lord hath need of him."}, {"s": 219333, "e": 224133, "t": "And they that were sent went their way, and found even as he had said unto them."}, {"s": 224133, "e": 229867, "t": "And as they were loosing the colt, the owners thereof said unto them, Why loose ye the colt?"}, {"s": 229867, "e": 232667, "t": "And they said, The Lord hath need of him."}, {"s": 232667, "e": 238667, "t": "And they brought him to Jesus: and they cast their garments upon the colt, and they set Jesus thereon."}, {"s": 238667, "e": 242400, "t": "And as he went, they spread their clothes in the way."}, {"s": 242400, "e": 261467, "t": "And when he was come nigh, even now at the descent of the mount of Olives, the whole multitude of the disciples began to rejoice and praise God with a loud voice for all the mighty works that they had seen; Saying, Blessed be the King that cometh in the name of the Lord: peace in heaven,"}, {"s": 261467, "e": 263200, "t": "and glory in the highest."}, {"s": 263200, "e": 269200, "t": "And some of the Pharisees from among the multitude said unto him, Master, rebuke thy disciples."}, {"s": 269200, "e": 276400, "t": "And he answered and said unto them, I tell you that, if these should hold their peace, the stones would immediately cry out."}, {"s": 276400, "e": 288667, "t": "And when he was come near, he beheld the city, and wept over it, Saying, If thou hadst known, even thou, at least in this thy day, the things which belong unto thy peace!"}, {"s": 288667, "e": 290667, "t": "but now they are hid from thine eyes."}, {"s": 290667, "e": 308533, "t": "For the days shall come upon thee, that thine enemies shall cast a trench about thee, and compass thee round, and keep thee in on every side, And shall lay thee even with the ground, and thy children within thee; and they shall not leave in thee one stone upon another;"}, {"s": 308533, "e": 311333, "t": "because thou knewest not the time of thy visitation."}, {"s": 311333, "e": 322933, "t": "And he went into the temple, and began to cast out them that sold therein, and them that bought; Saying unto them, It is written, My house is the house of prayer: but ye have made it a den of thieves."}, {"s": 322933, "e": 325333, "t": "And he taught daily in the temple."}, {"s": 325333, "e": 335200, "t": "But the chief priests and the scribes and the chief of the people sought to destroy him, And could not find what they might do: for all the people were very attentive to hear him."}],a=document.getElementById('a'),t=document.getElementById('t');
