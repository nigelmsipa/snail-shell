<script>
const S=[{"s": 0, "e": 2667, "t": "Hebrews, Chapter Eleven."}, {"s": 2667, "e": 8133, "t": "Now faith is the substance of things hoped for, the evidence of things not seen."}, {"s": 8133, "e": 10667, "t": "For by it the elders obtained a good report."}, {"s": 10667, "e": 18533, "t": "Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear."}, {"s": 18533, "e": 31333, "t": "By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, God testifying of his gifts: and by it he being dead yet speaketh."}, {"s": 31333, "e": 44667, "t": "By faith Enoch was translated that he should not see death; and was not found, because God had translated him: for before his translation he had this testimony, that he pleased God."}, {"s": 44667, "e": 53733, "t": "But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him."}, {"s": 53733, "e": 67200, "t": "By faith Noah, being warned of God of things not seen as yet, moved with fear, prepared an ark to the saving of his house; by the which he condemned the world, and became heir of the righteousness which is by faith."}, {"s": 67200, "e": 76933, "t": "By faith Abraham, when he was called to go out into a place which he should after receive for an inheritance, obeyed; and he went out, not knowing whither he went."}, {"s": 76933, "e": 91200, "t": "By faith he sojourned in the land of promise, as in a strange country, dwelling in tabernacles with Isaac and Jacob, the heirs with him of the same promise: For he looked for a city which hath foundations, whose builder and maker is God."}, {"s": 91200, "e": 101600, "t": "Through faith also Sara herself received strength to conceive seed, and was delivered of a child when she was past age, because she judged him faithful who had promised."}, {"s": 101600, "e": 111733, "t": "Therefore sprang there even of one, and him as good as dead, so many as the stars of the sky in multitude, and as the sand which is by the sea shore innumerable."}, {"s": 111733, "e": 122933, "t": "These all died in faith, not having received the promises, but having seen them afar off, and were persuaded of them, and embraced them, and confessed that they were strangers and pilgrims on the earth."}, {"s": 122933, "e": 126667, "t": "For they that say such things declare plainly that they seek a country."}, {"s": 126667, "e": 133600, "t": "And truly, if they had been mindful of that country from whence they came out, they might have had opportunity to have returned."}, {"s": 133600, "e": 142933, "t": "But now they desire a better country, that is, an heavenly: wherefore God is not ashamed to be called their God: for he hath prepared for them a city."}, {"s": 142933, "e": 161867, "t": "By faith Abraham, when he was tried, offered up Isaac: and he that had received the promises offered up his only begotten son, Of whom it was said, That in Isaac shall thy seed be called: Accounting that God was able to raise him up, even from the dead; from whence also he received him in a figure."}, {"s": 161867, "e": 166133, "t": "By faith Isaac blessed Jacob and Esau concerning things to come."}, {"s": 166133, "e": 174133, "t": "By faith Jacob, when he was a dying, blessed both the sons of Joseph; and worshipped, leaning upon the top of his staff."}, {"s": 174133, "e": 181200, "t": "By faith Joseph, when he died, made mention of the departing of the children of Israel; and gave commandment concerning his bones."}, {"s": 181200, "e": 190667, "t": "By faith Moses, when he was born, was hid three months of his parents, because they saw he was a proper child; and they were not afraid of the king's commandment."}, {"s": 190667, "e": 206933, "t": "By faith Moses, when he was come to years, refused to be called the son of Pharaoh's daughter; Choosing rather to suffer affliction with the people of God, than to enjoy the pleasures of sin for a season; Esteeming the reproach of Christ greater riches than the treasures in Egypt:"}, {"s": 206933, "e": 209733, "t": "for he had respect unto the recompence of the reward."}, {"s": 209733, "e": 217467, "t": "By faith he forsook Egypt, not fearing the wrath of the king: for he endured, as seeing him who is invisible."}, {"s": 217467, "e": 224133, "t": "Through faith he kept the passover, and the sprinkling of blood, lest he that destroyed the firstborn should touch them."}, {"s": 224133, "e": 230533, "t": "By faith they passed through the Red sea as by dry land: which the Egyptians assaying to do were drowned."}, {"s": 230533, "e": 236133, "t": "By faith the walls of Jericho fell down, after they were compassed about seven days."}, {"s": 236133, "e": 242667, "t": "By faith the harlot Rahab perished not with them that believed not, when she had received the spies with peace."}, {"s": 242667, "e": 244667, "t": "And what shall I more say?"}, {"s": 244667, "e": 262800, "t": "for the time would fail me to tell of Gedeon, and of Barak, and of Samson, and of Jephthae; of David also, and Samuel, and of the prophets: Who through faith subdued kingdoms, wrought righteousness, obtained promises, stopped the mouths of lions, Quenched the violence of fire,"}, {"s": 262800, "e": 270000, "t": "escaped the edge of the sword, out of weakness were made strong, waxed valiant in fight, turned to flight the armies of the aliens."}, {"s": 270000, "e": 286933, "t": "Women received their dead raised to life again: and others were tortured, not accepting deliverance; that they might obtain a better resurrection: And others had trial of cruel mockings and scourgings, yea, moreover of bonds and imprisonment: They were stoned, they were sawn asunder, were tempted,"}, {"s": 286933, "e": 299733, "t": "were slain with the sword: they wandered about in sheepskins and goatskins; being destitute, afflicted, tormented; (Of whom the world was not worthy:) they wandered in deserts, and in mountains, and in dens and caves of the earth."}, {"s": 299733, "e": 309467, "t": "And these all, having obtained a good report through faith, received not the promise: God having provided some better thing for us, that they without us should not be made perfect."}],a=document.getElementById('a'),t=document.getElementById('t');
