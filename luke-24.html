const S=[{"s": 0, "e": 2133, "t": "Luke, Chapter Twenty-Four."}, {"s": 2133, "e": 11600, "t": "Now upon the first day of the week, very early in the morning, they came unto the sepulchre, bringing the spices which they had prepared, and certain others with them."}, {"s": 11600, "e": 14667, "t": "And they found the stone rolled away from the sepulchre."}, {"s": 14667, "e": 18933, "t": "And they entered in, and found not the body of the Lord Jesus."}, {"s": 18933, "e": 33067, "t": "And it came to pass, as they were much perplexed thereabout, behold, two men stood by them in shining garments: And as they were afraid, and bowed down their faces to the earth, they said unto them, Why seek ye the living among the dead?"}, {"s": 33067, "e": 46400, "t": "He is not here, but is risen: remember how he spake unto you when he was yet in Galilee, Saying, The Son of man must be delivered into the hands of sinful men, and be crucified, and the third day rise again."}, {"s": 46400, "e": 53867, "t": "And they remembered his words, And returned from the sepulchre, and told all these things unto the eleven, and to all the rest."}, {"s": 53867, "e": 61733, "t": "It was Mary Magdalene, and Joanna, and Mary the mother of James, and other women that were with them, which told these things unto the apostles."}, {"s": 61733, "e": 66533, "t": "And their words seemed to them as idle tales, and they believed them not."}, {"s": 66533, "e": 77467, "t": "Then arose Peter, and ran unto the sepulchre; and stooping down, he beheld the linen clothes laid by themselves, and departed, wondering in himself at that which was come to pass."}, {"s": 77467, "e": 84400, "t": "And, behold, two of them went that same day to a village called Emmaus, which was from Jerusalem about threescore furlongs."}, {"s": 84400, "e": 87733, "t": "And they talked together of all these things which had happened."}, {"s": 87733, "e": 94133, "t": "And it came to pass, that, while they communed together and reasoned, Jesus himself drew near, and went with them."}, {"s": 94133, "e": 97067, "t": "But their eyes were holden that they should not know him."}, {"s": 97067, "e": 103333, "t": "And he said unto them, What manner of communications are these that ye have one to another, as ye walk, and are sad?"}, {"s": 103333, "e": 113200, "t": "And the one of them, whose name was Cleopas, answering said unto him, Art thou only a stranger in Jerusalem, and hast not known the things which are come to pass there in these days?"}, {"s": 113200, "e": 115733, "t": "And he said unto them, What things?"}, {"s": 115733, "e": 128267, "t": "And they said unto him, Concerning Jesus of Nazareth, which was a prophet mighty in deed and word before God and all the people: And how the chief priests and our rulers delivered him to be condemned to death, and have crucified him."}, {"s": 128267, "e": 136533, "t": "But we trusted that it had been he which should have redeemed Israel: and beside all this, to day is the third day since these things were done."}, {"s": 136533, "e": 149600, "t": "Yea, and certain women also of our company made us astonished, which were early at the sepulchre; And when they found not his body, they came, saying, that they had also seen a vision of angels, which said that he was alive."}, {"s": 149600, "e": 157600, "t": "And certain of them which were with us went to the sepulchre, and found it even so as the women had said: but him they saw not."}, {"s": 157600, "e": 168133, "t": "Then he said unto them, O fools, and slow of heart to believe all that the prophets have spoken: Ought not Christ to have suffered these things, and to enter into his glory?"}, {"s": 168133, "e": 174533, "t": "And beginning at Moses and all the prophets, he expounded unto them in all the scriptures the things concerning himself."}, {"s": 174533, "e": 179867, "t": "And they drew nigh unto the village, whither they went: and he made as though he would have gone further."}, {"s": 179867, "e": 186133, "t": "But they constrained him, saying, Abide with us: for it is toward evening, and the day is far spent."}, {"s": 186133, "e": 188133, "t": "And he went in to tarry with them."}, {"s": 188133, "e": 193867, "t": "And it came to pass, as he sat at meat with them, he took bread, and blessed it, and brake, and gave to them."}, {"s": 193867, "e": 199200, "t": "And their eyes were opened, and they knew him; and he vanished out of their sight."}, {"s": 199200, "e": 206800, "t": "And they said one to another, Did not our heart burn within us, while he talked with us by the way, and while he opened to us the scriptures?"}, {"s": 206800, "e": 218000, "t": "And they rose up the same hour, and returned to Jerusalem, and found the eleven gathered together, and them that were with them, Saying, The Lord is risen indeed, and hath appeared to Simon."}, {"s": 218000, "e": 222933, "t": "And they told what things were done in the way, and how he was known of them in breaking of bread."}, {"s": 222933, "e": 229200, "t": "And as they thus spake, Jesus himself stood in the midst of them, and saith unto them, Peace be unto you."}, {"s": 229200, "e": 234000, "t": "But they were terrified and affrighted, and supposed that they had seen a spirit."}, {"s": 234000, "e": 236933, "t": "And he said unto them, Why are ye troubled?"}, {"s": 236933, "e": 239600, "t": "and why do thoughts arise in your hearts?"}, {"s": 239600, "e": 249067, "t": "Behold my hands and my feet, that it is I myself: handle me, and see; for a spirit hath not flesh and bones, as ye see me have."}, {"s": 249067, "e": 253067, "t": "And when he had thus spoken, he shewed them his hands and his feet."}, {"s": 253067, "e": 259067, "t": "And while they yet believed not for joy, and wondered, he said unto them, Have ye here any meat?"}, {"s": 259067, "e": 263200, "t": "And they gave him a piece of a broiled fish, and of an honeycomb."}, {"s": 263200, "e": 265733, "t": "And he took it, and did eat before them."}, {"s": 265733, "e": 277467, "t": "And he said unto them, These are the words which I spake unto you, while I was yet with you, that all things must be fulfilled, which were written in the law of Moses, and in the prophets, and in the psalms, concerning me."}, {"s": 277467, "e": 295333, "t": "Then opened he their understanding, that they might understand the scriptures, And said unto them, Thus it is written, and thus it behoved Christ to suffer, and to rise from the dead the third day: And that repentance and remission of sins should be preached in his name among all nations,"}, {"s": 295333, "e": 296933, "t": "beginning at Jerusalem."}, {"s": 296933, "e": 298933, "t": "And ye are witnesses of these things."}, {"s": 298933, "e": 307733, "t": "And, behold, I send the promise of my Father upon you: but tarry ye in the city of Jerusalem, until ye be endued with power from on high."}, {"s": 307733, "e": 313333, "t": "And he led them out as far as to Bethany, and he lifted up his hands, and blessed them."}, {"s": 313333, "e": 318533, "t": "And it came to pass, while he blessed them, he was parted from them, and carried up into heaven."}, {"s": 318533, "e": 325733, "t": "And they worshipped him, and returned to Jerusalem with great joy: And were continually in the temple, praising and blessing God."}, {"s": 325733, "e": 326533, "t": "Amen."}],a=document.getElementById('a'),t=document.getElementById('t');
